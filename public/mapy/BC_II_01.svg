<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 818" font-family="Segoe UI, Roboto, Arial, sans-serif">
<rect x="0" y="0" width="1280" height="818" fill="#f7f6f3"/>
<text x="32" y="40" font-size="19" font-weight="700" fill="#1a3868">Mentálna mapa</text>
<text x="32" y="59" font-size="12.5" fill="#6b7280">BC II 01 · esencia odpovede k bodom tézy</text>
<path d="M 490.0 424.0 C 420.0 424.0, 540.0 138.5, 470.0 138.5" stroke="#00adbd" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 490.0 424.0 C 420.0 424.0, 540.0 286.0, 470.0 286.0" stroke="#f26539" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 490.0 424.0 C 420.0 424.0, 540.0 424.0, 470.0 424.0" stroke="#28b065" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 490.0 424.0 C 420.0 424.0, 540.0 571.5, 470.0 571.5" stroke="#803594" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 490.0 424.0 C 420.0 424.0, 540.0 719.0, 470.0 719.0" stroke="#6a6eb3" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 790.0 424.0 C 860.0 424.0, 740.0 207.5, 810.0 207.5" stroke="#9a562a" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 790.0 424.0 C 860.0 424.0, 740.0 355.0, 810.0 355.0" stroke="#e6251e" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 790.0 424.0 C 860.0 424.0, 740.0 502.5, 810.0 502.5" stroke="#0e7490" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 790.0 424.0 C 860.0 424.0, 740.0 640.5, 810.0 640.5" stroke="#b45309" stroke-width="2.5" fill="none" opacity="0.85"/>
<rect x="490.0" y="385.0" width="300" height="78.0" rx="15" fill="#1a3868"/>
<text x="640.0" y="418.0" font-size="18.0" font-weight="700" fill="#ffffff" text-anchor="middle">Účtovná závierka a</text>
<text x="640.0" y="441.0" font-size="18.0" font-weight="700" fill="#ffffff" text-anchor="middle">účtovná uzávierka v SR</text>
<rect x="90.0" y="70.0" width="380" height="137.0" rx="12" fill="#ffffff" stroke="#00adbd" stroke-width="2.5"/>
<rect x="90.0" y="70.0" width="7" height="137.0" rx="3.5" fill="#00adbd"/>
<text x="107.0" y="97.0" font-size="14.5" font-weight="700" fill="#1a3868">1. Účtovná uzávierka – uzatvorenie účtovných</text>
<text x="107.0" y="116.0" font-size="14.5" font-weight="700" fill="#1a3868">kníh</text>
<text x="107.0" y="140.0" font-size="13.0" fill="#374151">Uzávierka = ČINNOSŤ uzatvorenia kníh (par. 16, par.</text>
<text x="107.0" y="156.5" font-size="13.0" fill="#374151">8 postupov): obraty MD/D, konečné stavy, VH pred</text>
<text x="107.0" y="173.0" font-size="13.0" fill="#374151">zdanením, splatná daň. Bilančná kontinuita: konečné</text>
<text x="107.0" y="189.5" font-size="13.0" fill="#374151">zostatky = začiatočné stavy.</text>
<rect x="90.0" y="227.0" width="380" height="118.0" rx="12" fill="#ffffff" stroke="#f26539" stroke-width="2.5"/>
<rect x="90.0" y="227.0" width="7" height="118.0" rx="3.5" fill="#f26539"/>
<text x="107.0" y="254.0" font-size="14.5" font-weight="700" fill="#1a3868">2. Uzávierkové operácie</text>
<text x="107.0" y="278.0" font-size="13.0" fill="#374151">Uzávierkové operácie (par. 2a): odpisy, opravné</text>
<text x="107.0" y="294.5" font-size="13.0" fill="#374151">položky, rezervy, kurzové rozdiely k súvahovému dňu</text>
<text x="107.0" y="311.0" font-size="13.0" fill="#374151">(563/663), časové rozlíšenie (381–385), dohadné</text>
<text x="107.0" y="327.5" font-size="13.0" fill="#374151">položky, manká, splatná daň 591/341.</text>
<rect x="90.0" y="365.0" width="380" height="118.0" rx="12" fill="#ffffff" stroke="#28b065" stroke-width="2.5"/>
<rect x="90.0" y="365.0" width="7" height="118.0" rx="3.5" fill="#28b065"/>
<text x="107.0" y="392.0" font-size="14.5" font-weight="700" fill="#1a3868">3. Uzatvorenie účtov cez uzávierkové účty</text>
<text x="107.0" y="416.0" font-size="13.0" fill="#374151">Technicky cez triedu 7: náklady (5) na MD 710,</text>
<text x="107.0" y="432.5" font-size="13.0" fill="#374151">výnosy (6) na D 710 = VH; aktíva na MD 702, pasíva</text>
<text x="107.0" y="449.0" font-size="13.0" fill="#374151">na D 702; zisk 710/702 (strata 702/710). Otvorenie</text>
<text x="107.0" y="465.5" font-size="13.0" fill="#374151">cez 701, VH na 431.</text>
<rect x="90.0" y="503.0" width="380" height="137.0" rx="12" fill="#ffffff" stroke="#803594" stroke-width="2.5"/>
<rect x="90.0" y="503.0" width="7" height="137.0" rx="3.5" fill="#803594"/>
<text x="107.0" y="530.0" font-size="14.5" font-weight="700" fill="#1a3868">4. Účtovná závierka – charakteristika a</text>
<text x="107.0" y="549.0" font-size="14.5" font-weight="700" fill="#1a3868">náležitosti</text>
<text x="107.0" y="573.0" font-size="13.0" fill="#374151">Závierka = VÝSTUP (par. 17 ods. 1), jeden celok;</text>
<text x="107.0" y="589.5" font-size="13.0" fill="#374151">riadna/mimoriadna/priebežná. Náležitosti (ods. 2):</text>
<text x="107.0" y="606.0" font-size="13.0" fill="#374151">meno, IČO, deň zostavenia a ku ktorému, obdobie,</text>
<text x="107.0" y="622.5" font-size="13.0" fill="#374151">podpis. Informácie významné a spoľahlivé.</text>
<rect x="90.0" y="660.0" width="380" height="118.0" rx="12" fill="#ffffff" stroke="#6a6eb3" stroke-width="2.5"/>
<rect x="90.0" y="660.0" width="7" height="118.0" rx="3.5" fill="#6a6eb3"/>
<text x="107.0" y="687.0" font-size="14.5" font-weight="700" fill="#1a3868">5. Súvaha a výkaz ziskov a strát</text>
<text x="107.0" y="711.0" font-size="13.0" fill="#374151">Súvaha = stavová veličina k dňu (aktíva = pasíva);</text>
<text x="107.0" y="727.5" font-size="13.0" fill="#374151">výkaz ziskov a strát = toková za obdobie, druhové</text>
<text x="107.0" y="744.0" font-size="13.0" fill="#374151">členenie. Oba uvádzajú bežné aj minulé obdobie.</text>
<text x="107.0" y="760.5" font-size="13.0" fill="#374151">Štruktúra podľa veľkostnej skupiny.</text>
<rect x="810.0" y="148.5" width="380" height="118.0" rx="12" fill="#ffffff" stroke="#9a562a" stroke-width="2.5"/>
<rect x="810.0" y="148.5" width="7" height="118.0" rx="3.5" fill="#9a562a"/>
<text x="827.0" y="175.5" font-size="14.5" font-weight="700" fill="#1a3868">6. Poznámky – význam a obsah</text>
<text x="827.0" y="199.5" font-size="13.0" fill="#374151">Poznámky = rovnocenná tretia súčasť (par. 18 ods.</text>
<text x="827.0" y="216.0" font-size="13.0" fill="#374151">5): vysvetľujú výkazy, zásady a metódy, podmienené</text>
<text x="827.0" y="232.5" font-size="13.0" fill="#374151">záväzky, spory, udalosti po dni závierky, spriaznené</text>
<text x="827.0" y="249.0" font-size="13.0" fill="#374151">osoby. Rozsah podľa veľkosti.</text>
<rect x="810.0" y="286.5" width="380" height="137.0" rx="12" fill="#ffffff" stroke="#e6251e" stroke-width="2.5"/>
<rect x="810.0" y="286.5" width="7" height="137.0" rx="3.5" fill="#e6251e"/>
<text x="827.0" y="313.5" font-size="14.5" font-weight="700" fill="#1a3868">7. Kontrola vecnej a formálnej správnosti</text>
<text x="827.0" y="332.5" font-size="14.5" font-weight="700" fill="#1a3868">účtovníctva</text>
<text x="827.0" y="356.5" font-size="13.0" fill="#374151">Formálna správnosť = úplnosť dokladov, podvojnosť,</text>
<text x="827.0" y="373.0" font-size="13.0" fill="#374151">súlad obratov v predvahe (MD = D), bilančná</text>
<text x="827.0" y="389.5" font-size="13.0" fill="#374151">kontinuita. Vecná = zhoda so skutočnosťou;</text>
<text x="827.0" y="406.0" font-size="13.0" fill="#374151">preukazuje ju inventarizácia (par. 30 ods. 3).</text>
<rect x="810.0" y="443.5" width="380" height="118.0" rx="12" fill="#ffffff" stroke="#0e7490" stroke-width="2.5"/>
<rect x="810.0" y="443.5" width="7" height="118.0" rx="3.5" fill="#0e7490"/>
<text x="827.0" y="470.5" font-size="14.5" font-weight="700" fill="#1a3868">8. Inventarizácia – charakteristika a priebeh</text>
<text x="827.0" y="494.5" font-size="13.0" fill="#374151">Inventarizácia (par. 29) overuje zhodu účtovného a</text>
<text x="827.0" y="511.0" font-size="13.0" fill="#374151">skutočného stavu; ku dňu závierky (hmotný majetok aj</text>
<text x="827.0" y="527.5" font-size="13.0" fill="#374151">do 4 rokov). Priebeh: inventúra, súpis, porovnanie,</text>
<text x="827.0" y="544.0" font-size="13.0" fill="#374151">rozdiely, zápis a zaúčtovanie.</text>
<rect x="810.0" y="581.5" width="380" height="118.0" rx="12" fill="#ffffff" stroke="#b45309" stroke-width="2.5"/>
<rect x="810.0" y="581.5" width="7" height="118.0" rx="3.5" fill="#b45309"/>
<text x="827.0" y="608.5" font-size="14.5" font-weight="700" fill="#1a3868">9. Druhy inventúr, súpis, rozdiely a zápis</text>
<text x="827.0" y="632.5" font-size="13.0" fill="#374151">Inventúra (par. 30): fyzická (hmotný/nehmotný</text>
<text x="827.0" y="649.0" font-size="13.0" fill="#374151">majetok), dokladová (záväzky), kombinovaná. Rozdiel:</text>
<text x="827.0" y="665.5" font-size="13.0" fill="#374151">manko (nižší stav, pri peniazoch schodok), prebytok</text>
<text x="827.0" y="682.0" font-size="13.0" fill="#374151">(vyšší). Účtuje sa do obdobia.</text>
</svg>