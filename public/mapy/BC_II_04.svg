<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 701" font-family="Segoe UI, Roboto, Arial, sans-serif">
<rect x="0" y="0" width="1280" height="701" fill="#f7f6f3"/>
<text x="32" y="40" font-size="19" font-weight="700" fill="#1a3868">Mentálna mapa</text>
<text x="32" y="59" font-size="12.5" fill="#6b7280">BC II 04 · esencia odpovede k bodom tézy</text>
<path d="M 490.0 365.8 C 420.0 365.8, 540.0 130.2, 470.0 130.2" stroke="#00adbd" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 490.0 365.8 C 420.0 365.8, 540.0 277.8, 470.0 277.8" stroke="#f26539" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 490.0 365.8 C 420.0 365.8, 540.0 434.8, 470.0 434.8" stroke="#28b065" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 490.0 365.8 C 420.0 365.8, 540.0 591.8, 470.0 591.8" stroke="#803594" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 790.0 365.8 C 860.0 365.8, 740.0 130.2, 810.0 130.2" stroke="#6a6eb3" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 790.0 365.8 C 860.0 365.8, 740.0 279.0, 810.0 279.0" stroke="#9a562a" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 790.0 365.8 C 860.0 365.8, 740.0 436.0, 810.0 436.0" stroke="#e6251e" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 790.0 365.8 C 860.0 365.8, 740.0 593.0, 810.0 593.0" stroke="#0e7490" stroke-width="2.5" fill="none" opacity="0.85"/>
<rect x="490.0" y="326.8" width="300" height="78.0" rx="15" fill="#1a3868"/>
<text x="640.0" y="359.8" font-size="18.0" font-weight="700" fill="#ffffff" text-anchor="middle">Aktivita a zadlženosť,</text>
<text x="640.0" y="382.8" font-size="18.0" font-weight="700" fill="#ffffff" text-anchor="middle">rentabilita a likvidita</text>
<rect x="90.0" y="71.2" width="380" height="118.0" rx="12" fill="#ffffff" stroke="#00adbd" stroke-width="2.5"/>
<rect x="90.0" y="71.2" width="7" height="118.0" rx="3.5" fill="#00adbd"/>
<text x="107.0" y="98.2" font-size="14.5" font-weight="700" fill="#1a3868">1. Ukazovatele AKTIVITY – ako pracuje majetok</text>
<text x="107.0" y="122.2" font-size="13.0" fill="#374151">Aktivita = obrátky (tržby/aktíva) a doby obratu</text>
<text x="107.0" y="138.8" font-size="13.0" fill="#374151">(dni). Zdravé: doba inkasa pohľadávok &lt; doba úhrady</text>
<text x="107.0" y="155.2" font-size="13.0" fill="#374151">záväzkov, lebo dodávatelia tak financujú prevádzkový</text>
<text x="107.0" y="171.8" font-size="13.0" fill="#374151">kapitál.</text>
<rect x="90.0" y="209.2" width="380" height="137.0" rx="12" fill="#ffffff" stroke="#f26539" stroke-width="2.5"/>
<rect x="90.0" y="209.2" width="7" height="137.0" rx="3.5" fill="#f26539"/>
<text x="107.0" y="236.2" font-size="14.5" font-weight="700" fill="#1a3868">2. Aktivita – súvis s viazanosťou a obchodným</text>
<text x="107.0" y="255.2" font-size="14.5" font-weight="700" fill="#1a3868">úverom</text>
<text x="107.0" y="279.2" font-size="13.0" fill="#374151">Viazanosť aktív = aktíva/tržby (prevrátený obrat).</text>
<text x="107.0" y="295.8" font-size="13.0" fill="#374151">Doby obratu tvoria obratový cyklus peňazí (zásoby +</text>
<text x="107.0" y="312.2" font-size="13.0" fill="#374151">inkaso − úhrada záväzkov); jeho skrátenie uvoľní</text>
<text x="107.0" y="328.8" font-size="13.0" fill="#374151">hotovosť.</text>
<rect x="90.0" y="366.2" width="380" height="137.0" rx="12" fill="#ffffff" stroke="#28b065" stroke-width="2.5"/>
<rect x="90.0" y="366.2" width="7" height="137.0" rx="3.5" fill="#28b065"/>
<text x="107.0" y="393.2" font-size="14.5" font-weight="700" fill="#1a3868">3. Ukazovatele ZADLŽENOSTI – z čoho je podnik</text>
<text x="107.0" y="412.2" font-size="14.5" font-weight="700" fill="#1a3868">financovaný</text>
<text x="107.0" y="436.2" font-size="13.0" fill="#374151">Celková zadlženosť = cudzí kapitál/aktíva (vysoká</text>
<text x="107.0" y="452.8" font-size="13.0" fill="#374151">nad 50 %, max ~70 %); samofinancovanie je doplnok do</text>
<text x="107.0" y="469.2" font-size="13.0" fill="#374151">100 %. Úrokové krytie EBIT/úroky (optimum ~5, min</text>
<text x="107.0" y="485.8" font-size="13.0" fill="#374151">3); páka = aktíva/VI.</text>
<rect x="90.0" y="523.2" width="380" height="137.0" rx="12" fill="#ffffff" stroke="#803594" stroke-width="2.5"/>
<rect x="90.0" y="523.2" width="7" height="137.0" rx="3.5" fill="#803594"/>
<text x="107.0" y="550.2" font-size="14.5" font-weight="700" fill="#1a3868">4. Zadlženosť – ekonomická interpretácia a</text>
<text x="107.0" y="569.2" font-size="14.5" font-weight="700" fill="#1a3868">efekt páky</text>
<text x="107.0" y="593.2" font-size="13.0" fill="#374151">Pozitívny efekt páky, keď ROA &gt; úroková sadzba dlhu</text>
<text x="107.0" y="609.8" font-size="13.0" fill="#374151">(dlh dvíha ROE); ak ROA klesne pod cenu dlhu, páka</text>
<text x="107.0" y="626.2" font-size="13.0" fill="#374151">ROE znižuje. Cudzí kapitál je lacnejší (daňový</text>
<text x="107.0" y="642.8" font-size="13.0" fill="#374151">štít), ale rizikový.</text>
<rect x="810.0" y="70.0" width="380" height="120.5" rx="12" fill="#ffffff" stroke="#6a6eb3" stroke-width="2.5"/>
<rect x="810.0" y="70.0" width="7" height="120.5" rx="3.5" fill="#6a6eb3"/>
<text x="827.0" y="97.0" font-size="14.5" font-weight="700" fill="#1a3868">5. Ukazovatele RENTABILITY – koľko zisku to</text>
<text x="827.0" y="116.0" font-size="14.5" font-weight="700" fill="#1a3868">tvorí</text>
<text x="827.0" y="140.0" font-size="13.0" fill="#374151">Rentabilita = zisk/vložené prostriedky: ROA =</text>
<text x="827.0" y="156.5" font-size="13.0" fill="#374151">EBIT/aktíva, ROE = čistý zisk/VI, ROS = zisk/tržby,</text>
<text x="827.0" y="173.0" font-size="13.0" fill="#374151">ROCE = EBIT/(VI + dlhodobé záväzky).</text>
<rect x="810.0" y="210.5" width="380" height="137.0" rx="12" fill="#ffffff" stroke="#9a562a" stroke-width="2.5"/>
<rect x="810.0" y="210.5" width="7" height="137.0" rx="3.5" fill="#9a562a"/>
<text x="827.0" y="237.5" font-size="14.5" font-weight="700" fill="#1a3868">6. DuPont rozklad ROE a ekonomická pridaná</text>
<text x="827.0" y="256.5" font-size="14.5" font-weight="700" fill="#1a3868">hodnota (EVA)</text>
<text x="827.0" y="280.5" font-size="13.0" fill="#374151">DuPont: ROE = ROS × obrat aktív × páka. EVA = (ROIC</text>
<text x="827.0" y="297.0" font-size="13.0" fill="#374151">− WACC) × investovaný kapitál; EVA &gt; 0 tvorí</text>
<text x="827.0" y="313.5" font-size="13.0" fill="#374151">hodnotu, EVA &lt; 0 ničí. Ziskový podnik môže mať</text>
<text x="827.0" y="330.0" font-size="13.0" fill="#374151">zápornú EVA, ak ROIC &lt; WACC.</text>
<rect x="810.0" y="367.5" width="380" height="137.0" rx="12" fill="#ffffff" stroke="#e6251e" stroke-width="2.5"/>
<rect x="810.0" y="367.5" width="7" height="137.0" rx="3.5" fill="#e6251e"/>
<text x="827.0" y="394.5" font-size="14.5" font-weight="700" fill="#1a3868">7. Ukazovatele LIKVIDITY – schopnosť hradiť</text>
<text x="827.0" y="413.5" font-size="14.5" font-weight="700" fill="#1a3868">záväzky</text>
<text x="827.0" y="437.5" font-size="13.0" fill="#374151">Likvidita ako rebrík: L1 (finančný majetok/KZ)</text>
<text x="827.0" y="454.0" font-size="13.0" fill="#374151">0,2-0,6; L2 (OM − zásoby)/KZ 1,0-1,5; L3 (OM/KZ)</text>
<text x="827.0" y="470.5" font-size="13.0" fill="#374151">~1,5-2,5. ČPK = OM − KZ je vankúš krytý dlhodobými</text>
<text x="827.0" y="487.0" font-size="13.0" fill="#374151">zdrojmi.</text>
<rect x="810.0" y="524.5" width="380" height="137.0" rx="12" fill="#ffffff" stroke="#0e7490" stroke-width="2.5"/>
<rect x="810.0" y="524.5" width="7" height="137.0" rx="3.5" fill="#0e7490"/>
<text x="827.0" y="551.5" font-size="14.5" font-weight="700" fill="#1a3868">8. Likvidita na báze cash flow a</text>
<text x="827.0" y="570.5" font-size="14.5" font-weight="700" fill="#1a3868">interpretácia</text>
<text x="827.0" y="594.5" font-size="13.0" fill="#374151">Statická likvidita zo súvahy skresľujú nehybné</text>
<text x="827.0" y="611.0" font-size="13.0" fill="#374151">zásoby a nedobytné pohľadávky, preto sa dopĺňa CF</text>
<text x="827.0" y="627.5" font-size="13.0" fill="#374151">likviditou (prevádzkový CF/KZ). Optimum je rozpätie:</text>
<text x="827.0" y="644.0" font-size="13.0" fill="#374151">priveľa likvidity znižuje rentabilitu.</text>
</svg>