<path d="M 490.0 452.5 C 420.0 452.5, 540.0 598.8, 470.0 598.8" stroke="#803594" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 490.0 452.5 C 420.0 452.5, 540.0 738.0, 470.0 738.0" stroke="#6a6eb3" stroke-width="2.5" fill="none" opacity="0.85"/>
