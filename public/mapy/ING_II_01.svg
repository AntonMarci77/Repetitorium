<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 952" font-family="Segoe UI, Roboto, Arial, sans-serif">
<rect x="0" y="0" width="1280" height="952" fill="#f7f6f3"/>
<text x="32" y="40" font-size="19" font-weight="700" fill="#1a3868">Mentálna mapa</text>
<text x="32" y="59" font-size="12.5" fill="#6b7280">ING II 01 · esencia odpovede k bodom tézy</text>
<path d="M 490.0 491.2 C 420.0 491.2, 540.0 146.8, 470.0 146.8" stroke="#00adbd" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 490.0 491.2 C 420.0 491.2, 540.0 328.5, 470.0 328.5" stroke="#f26539" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 490.0 491.2 C 420.0 491.2, 540.0 510.2, 470.0 510.2" stroke="#28b065" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 490.0 491.2 C 420.0 491.2, 540.0 674.2, 470.0 674.2" stroke="#803594" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 490.0 491.2 C 420.0 491.2, 540.0 837.0, 470.0 837.0" stroke="#6a6eb3" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 790.0 491.2 C 860.0 491.2, 740.0 225.2, 810.0 225.2" stroke="#9a562a" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 790.0 491.2 C 860.0 491.2, 740.0 396.2, 810.0 396.2" stroke="#e6251e" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 790.0 491.2 C 860.0 491.2, 740.0 576.8, 810.0 576.8" stroke="#0e7490" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 790.0 491.2 C 860.0 491.2, 740.0 757.2, 810.0 757.2" stroke="#b45309" stroke-width="2.5" fill="none" opacity="0.85"/>
<rect x="490.0" y="429.2" width="300" height="124.0" rx="15" fill="#1a3868"/>
<text x="640.0" y="462.2" font-size="18.0" font-weight="700" fill="#ffffff" text-anchor="middle">Podstata, cieľ, právna</text>
<text x="640.0" y="485.2" font-size="18.0" font-weight="700" fill="#ffffff" text-anchor="middle">úprava a základné</text>
<text x="640.0" y="508.2" font-size="18.0" font-weight="700" fill="#ffffff" text-anchor="middle">princípy auditu účtovnej</text>
<text x="640.0" y="531.2" font-size="18.0" font-weight="700" fill="#ffffff" text-anchor="middle">závierky</text>
<rect x="90.0" y="70.0" width="380" height="153.5" rx="12" fill="#ffffff" stroke="#00adbd" stroke-width="2.5"/>
<rect x="90.0" y="70.0" width="7" height="153.5" rx="3.5" fill="#00adbd"/>
<text x="107.0" y="97.0" font-size="14.5" font-weight="700" fill="#1a3868">1. Podstata a cieľ auditu – primeraná istota</text>
<text x="107.0" y="116.0" font-size="14.5" font-weight="700" fill="#1a3868">a názor</text>
<text x="107.0" y="140.0" font-size="13.0" fill="#374151">Štatutárny audit (§ 2 zák. 423/2015) = overovanie</text>
<text x="107.0" y="156.5" font-size="13.0" fill="#374151">závierky a výročnej správy. Cieľom (ISA 200) nie je</text>
<text x="107.0" y="173.0" font-size="13.0" fill="#374151">bezchybnosť, ale PRIMERANÁ ISTOTA (vysoká, nie</text>
<text x="107.0" y="189.5" font-size="13.0" fill="#374151">absolútna), že závierka neobsahuje významnú</text>
<text x="107.0" y="206.0" font-size="13.0" fill="#374151">nesprávnosť, a vyjadrenie názoru o vernom obraze.</text>
<rect x="90.0" y="243.5" width="380" height="170.0" rx="12" fill="#ffffff" stroke="#f26539" stroke-width="2.5"/>
<rect x="90.0" y="243.5" width="7" height="170.0" rx="3.5" fill="#f26539"/>
<text x="107.0" y="270.5" font-size="14.5" font-weight="700" fill="#1a3868">2. Zodpovednosť audítora vs. zodpovednosť</text>
<text x="107.0" y="289.5" font-size="14.5" font-weight="700" fill="#1a3868">manažmentu</text>
<text x="107.0" y="313.5" font-size="13.0" fill="#374151">ZA ZOSTAVENIE závierky, účtovníctvo, vnútorný</text>
<text x="107.0" y="330.0" font-size="13.0" fill="#374151">kontrolný systém a nepretržité pokračovanie</text>
<text x="107.0" y="346.5" font-size="13.0" fill="#374151">zodpovedá MANAŽMENT. Audítor NEZOSTAVUJE závierku</text>
<text x="107.0" y="363.0" font-size="13.0" fill="#374151">(kontrola vlastnej práce). Audítor zodpovedá za</text>
<text x="107.0" y="379.5" font-size="13.0" fill="#374151">výkon podľa ISA, dôkazy a podložený názor; prevencia</text>
<text x="107.0" y="396.0" font-size="13.0" fill="#374151">podvodu je na manažmente.</text>
<rect x="90.0" y="433.5" width="380" height="153.5" rx="12" fill="#ffffff" stroke="#28b065" stroke-width="2.5"/>
<rect x="90.0" y="433.5" width="7" height="153.5" rx="3.5" fill="#28b065"/>
<text x="107.0" y="460.5" font-size="14.5" font-weight="700" fill="#1a3868">3. Nadnárodná a národná úprava štatutárneho</text>
<text x="107.0" y="479.5" font-size="14.5" font-weight="700" fill="#1a3868">auditu</text>
<text x="107.0" y="503.5" font-size="13.0" fill="#374151">Tri vrstvy: EÚ – smernica 2006/43/ES a nariadenie</text>
<text x="107.0" y="520.0" font-size="13.0" fill="#374151">537/2014 pre SVZ (rotácia, zákaz služieb, výbor pre</text>
<text x="107.0" y="536.5" font-size="13.0" fill="#374151">audit); NÁRODNÁ – zákon 423/2015 (SKAU, ÚDVA),</text>
<text x="107.0" y="553.0" font-size="13.0" fill="#374151">povinnosť auditu určuje zákon 431/2002 (§ 19);</text>
<text x="107.0" y="569.5" font-size="13.0" fill="#374151">ODBORNÁ – ISA vydané cez IFAC.</text>
<rect x="90.0" y="607.0" width="380" height="134.5" rx="12" fill="#ffffff" stroke="#803594" stroke-width="2.5"/>
<rect x="90.0" y="607.0" width="7" height="134.5" rx="3.5" fill="#803594"/>
<text x="107.0" y="634.0" font-size="14.5" font-weight="700" fill="#1a3868">4. Inštitúcie vo svete – IFAC, IAASB, IESBA</text>
<text x="107.0" y="658.0" font-size="13.0" fill="#374151">IFAC = svetová federácia profesijných organizácií.</text>
<text x="107.0" y="674.5" font-size="13.0" fill="#374151">Dve nezávislé rady: IAASB vydáva ISA, uisťovacie</text>
<text x="107.0" y="691.0" font-size="13.0" fill="#374151">štandardy a riadenie kvality (ISQM 1, ISQM 2); IESBA</text>
<text x="107.0" y="707.5" font-size="13.0" fill="#374151">vydáva Etický kódex vrátane nezávislosti. Dohľad</text>
<text x="107.0" y="724.0" font-size="13.0" fill="#374151">PIOB; obe pod nadáciou IFEA.</text>
<rect x="90.0" y="761.5" width="380" height="151.0" rx="12" fill="#ffffff" stroke="#6a6eb3" stroke-width="2.5"/>
<rect x="90.0" y="761.5" width="7" height="151.0" rx="3.5" fill="#6a6eb3"/>
<text x="107.0" y="788.5" font-size="14.5" font-weight="700" fill="#1a3868">5. Inštitúcie na Slovensku – SKAU a ÚDVA</text>
<text x="107.0" y="812.5" font-size="13.0" fill="#374151">SKAU = samospráva profesie (povinné členstvo,</text>
<text x="107.0" y="829.0" font-size="13.0" fill="#374151">vzdelávanie, Etický kódex, disciplinárne konania,</text>
<text x="107.0" y="845.5" font-size="13.0" fill="#374151">previerky kvality u ne-SVZ). ÚDVA = nezávislý</text>
<text x="107.0" y="862.0" font-size="13.0" fill="#374151">VEREJNÝ dohľad (skúšky, register, schvaľovanie</text>
<text x="107.0" y="878.5" font-size="13.0" fill="#374151">predpisov komory, dohľad pri SVZ). SKAU =</text>
<text x="107.0" y="895.0" font-size="13.0" fill="#374151">samospráva, ÚDVA = dohľad.</text>
<rect x="810.0" y="149.8" width="380" height="151.0" rx="12" fill="#ffffff" stroke="#9a562a" stroke-width="2.5"/>
<rect x="810.0" y="149.8" width="7" height="151.0" rx="3.5" fill="#9a562a"/>
<text x="827.0" y="176.8" font-size="14.5" font-weight="700" fill="#1a3868">6. Etický kódex audítora</text>
<text x="827.0" y="200.8" font-size="13.0" fill="#374151">Etický kódex (§ 28 zák. 423/2015) je predpis SKAU v</text>
<text x="827.0" y="217.2" font-size="13.0" fill="#374151">súlade s kódexom IFAC/IESBA. Päť princípov:</text>
<text x="827.0" y="233.8" font-size="13.0" fill="#374151">integrita, objektívnosť, odborná spôsobilosť,</text>
<text x="827.0" y="250.2" font-size="13.0" fill="#374151">dôvernosť, profesionálne správanie. Koncepčný rámec:</text>
<text x="827.0" y="266.8" font-size="13.0" fill="#374151">identifikovať hrozby, vyhodnotiť a uplatniť</text>
<text x="827.0" y="283.2" font-size="13.0" fill="#374151">opatrenia. Pri SVZ prísnejšie.</text>
<rect x="810.0" y="320.8" width="380" height="151.0" rx="12" fill="#ffffff" stroke="#e6251e" stroke-width="2.5"/>
<rect x="810.0" y="320.8" width="7" height="151.0" rx="3.5" fill="#e6251e"/>
<text x="827.0" y="347.8" font-size="14.5" font-weight="700" fill="#1a3868">7. Nezávislosť audítora – základná požiadavka</text>
<text x="827.0" y="371.8" font-size="13.0" fill="#374151">Nezávislosť (§ 21 zák. 423/2015) = nestrannosť a</text>
<text x="827.0" y="388.2" font-size="13.0" fill="#374151">nezapojenie do rozhodovania subjektu. Rozlišuje sa</text>
<text x="827.0" y="404.8" font-size="13.0" fill="#374151">nezávislosť v MYSLENÍ a na POHĽAD. Prekážky:</text>
<text x="827.0" y="421.2" font-size="13.0" fill="#374151">vlastnícky/pracovný vzťah, členstvo v orgánoch,</text>
<text x="827.0" y="437.8" font-size="13.0" fill="#374151">blízka osoba. Pri SVZ (537/2014): rotácia (max. 10</text>
<text x="827.0" y="454.2" font-size="13.0" fill="#374151">r.), zákaz služieb, strop honorárov.</text>
<rect x="810.0" y="491.8" width="380" height="170.0" rx="12" fill="#ffffff" stroke="#0e7490" stroke-width="2.5"/>
<rect x="810.0" y="491.8" width="7" height="170.0" rx="3.5" fill="#0e7490"/>
<text x="827.0" y="518.8" font-size="14.5" font-weight="700" fill="#1a3868">8. Profesionálny skepticizmus a odborný</text>
<text x="827.0" y="537.8" font-size="14.5" font-weight="700" fill="#1a3868">úsudok</text>
<text x="827.0" y="561.8" font-size="13.0" fill="#374151">Profesionálny skepticizmus (§ 20 zák., ISA 200) =</text>
<text x="827.0" y="578.2" font-size="13.0" fill="#374151">ostražitosť voči okolnostiam možnej nesprávnosti</text>
<text x="827.0" y="594.8" font-size="13.0" fill="#374151">(chyba/podvod) a kritické posudzovanie dôkazov počas</text>
<text x="827.0" y="611.2" font-size="13.0" fill="#374151">celého auditu. Audítor automaticky neverí manažmentu</text>
<text x="827.0" y="627.8" font-size="13.0" fill="#374151">(ani dôverčivý, ani podozrievavý). Súvisí s odborným</text>
<text x="827.0" y="644.2" font-size="13.0" fill="#374151">úsudkom.</text>
<rect x="810.0" y="681.8" width="380" height="151.0" rx="12" fill="#ffffff" stroke="#b45309" stroke-width="2.5"/>
<rect x="810.0" y="681.8" width="7" height="151.0" rx="3.5" fill="#b45309"/>
<text x="827.0" y="708.8" font-size="14.5" font-weight="700" fill="#1a3868">9. Kontrola kvality – ISQM 1, ISQM 2, ISA 220</text>
<text x="827.0" y="732.8" font-size="13.0" fill="#374151">Kvalita na dvoch úrovniach: FIRMA – ISQM 1 (nahradil</text>
<text x="827.0" y="749.2" font-size="13.0" fill="#374151">ISQC 1), RIZIKOVO orientovaný prístup (ciele,</text>
<text x="827.0" y="765.8" font-size="13.0" fill="#374151">riziká, reakcie, monitoring); ISQM 2 = preskúmanie</text>
<text x="827.0" y="782.2" font-size="13.0" fill="#374151">kvality zákazky (EQR). ZÁKAZKA – ISA 220 revid.</text>
<text x="827.0" y="798.8" font-size="13.0" fill="#374151">(engagement partner, od 15. 12. 2022). Dohľad ÚDVA a</text>
<text x="827.0" y="815.2" font-size="13.0" fill="#374151">SKAU.</text>
</svg>