<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 856" font-family="Segoe UI, Roboto, Arial, sans-serif">
<rect x="0" y="0" width="1280" height="856" fill="#f7f6f3"/>
<text x="32" y="40" font-size="19" font-weight="700" fill="#1a3868">Mentálna mapa</text>
<text x="32" y="59" font-size="12.5" fill="#6b7280">BC II 02 · esencia odpovede k bodom tézy</text>
<path d="M 490.0 443.0 C 420.0 443.0, 540.0 138.5, 470.0 138.5" stroke="#00adbd" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 490.0 443.0 C 420.0 443.0, 540.0 286.0, 470.0 286.0" stroke="#f26539" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 490.0 443.0 C 420.0 443.0, 540.0 433.5, 470.0 433.5" stroke="#28b065" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 490.0 443.0 C 420.0 443.0, 540.0 590.5, 470.0 590.5" stroke="#803594" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 490.0 443.0 C 420.0 443.0, 540.0 747.5, 470.0 747.5" stroke="#6a6eb3" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 790.0 443.0 C 860.0 443.0, 740.0 236.0, 810.0 236.0" stroke="#9a562a" stroke-width="2.5" fill="none" opacity="0.85"/>
