<path d="M 790.0 443.0 C 860.0 443.0, 740.0 521.5, 810.0 521.5" stroke="#0e7490" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 790.0 443.0 C 860.0 443.0, 740.0 659.5, 810.0 659.5" stroke="#b45309" stroke-width="2.5" fill="none" opacity="0.85"/>
<rect x="490.0" y="369.5" width="300" height="147.0" rx="15" fill="#1a3868"/>
<text x="640.0" y="402.5" font-size="18.0" font-weight="700" fill="#ffffff" text-anchor="middle">Osobitosti obsahu a</text>
<text x="640.0" y="425.5" font-size="18.0" font-weight="700" fill="#ffffff" text-anchor="middle">rozsahu účtovných</text>
<text x="640.0" y="448.5" font-size="18.0" font-weight="700" fill="#ffffff" text-anchor="middle">závierok podnikateľov v</text>
<text x="640.0" y="471.5" font-size="18.0" font-weight="700" fill="#ffffff" text-anchor="middle">SR podľa veľkostných</text>
<text x="640.0" y="494.5" font-size="18.0" font-weight="700" fill="#ffffff" text-anchor="middle">kritérií</text>
<rect x="90.0" y="70.0" width="380" height="137.0" rx="12" fill="#ffffff" stroke="#00adbd" stroke-width="2.5"/>
<rect x="90.0" y="70.0" width="7" height="137.0" rx="3.5" fill="#00adbd"/>
<text x="107.0" y="97.0" font-size="14.5" font-weight="700" fill="#1a3868">1. Veľkostné skupiny a kto sa triedi (§ 2</text>
<text x="107.0" y="116.0" font-size="14.5" font-weight="700" fill="#1a3868">ods. 5)</text>
<text x="107.0" y="140.0" font-size="13.0" fill="#374151">Triedia sa (par. 2 ods. 5): obchodné spoločnosti,</text>
<text x="107.0" y="156.5" font-size="13.0" fill="#374151">družstvá, FO v PÚ, pozemkové spoločenstvá (NIE</text>
<text x="107.0" y="173.0" font-size="13.0" fill="#374151">banky, poisťovne, neziskovky). Skupiny</text>
<text x="107.0" y="189.5" font-size="13.0" fill="#374151">mikro/malá/veľká určujú opatrenie a vzor výkazov.</text>
<rect x="90.0" y="227.0" width="380" height="118.0" rx="12" fill="#ffffff" stroke="#f26539" stroke-width="2.5"/>
<rect x="90.0" y="227.0" width="7" height="118.0" rx="3.5" fill="#f26539"/>
<text x="107.0" y="254.0" font-size="14.5" font-weight="700" fill="#1a3868">2. Tri kritériá a pravidlo 2 z 3</text>
<text x="107.0" y="278.0" font-size="13.0" fill="#374151">Tri kritériá: celková suma majetku (NETTO), čistý</text>
<text x="107.0" y="294.5" font-size="13.0" fill="#374151">obrat, priemerný prepočítaný počet zamestnancov.</text>
<text x="107.0" y="311.0" font-size="13.0" fill="#374151">Pravidlo aspoň 2 z 3. Čistý obrat = 601/602/604 bez</text>
<text x="107.0" y="327.5" font-size="13.0" fill="#374151">641, 648, zmeny zásob a aktivácie.</text>
<rect x="90.0" y="365.0" width="380" height="137.0" rx="12" fill="#ffffff" stroke="#28b065" stroke-width="2.5"/>
<rect x="90.0" y="365.0" width="7" height="137.0" rx="3.5" fill="#28b065"/>
<text x="107.0" y="392.0" font-size="14.5" font-weight="700" fill="#1a3868">3. Konkrétne prahy mikro / malá / veľká</text>
<text x="107.0" y="411.0" font-size="14.5" font-weight="700" fill="#1a3868">(aktuálne hodnoty)</text>
<text x="107.0" y="435.0" font-size="13.0" fill="#374151">Aktuálne prahy (novela 105/2024, platí 2025/2026):</text>
<text x="107.0" y="451.5" font-size="13.0" fill="#374151">MIKRO do 450 000/900 000/10; MALÁ do 5 mil./10</text>
<text x="107.0" y="468.0" font-size="13.0" fill="#374151">mil./50; VEĽKÁ nad 5 mil./10 mil./50. Staré prahy</text>
<text x="107.0" y="484.5" font-size="13.0" fill="#374151">(350/700 tis., 4/8 mil.) NEPLATIA.</text>
<rect x="90.0" y="522.0" width="380" height="137.0" rx="12" fill="#ffffff" stroke="#803594" stroke-width="2.5"/>
<rect x="90.0" y="522.0" width="7" height="137.0" rx="3.5" fill="#803594"/>
<text x="107.0" y="549.0" font-size="14.5" font-weight="700" fill="#1a3868">4. Subjekt verejného záujmu a postup pri</text>
<text x="107.0" y="568.0" font-size="14.5" font-weight="700" fill="#1a3868">zatriedení</text>
<text x="107.0" y="592.0" font-size="13.0" fill="#374151">SVZ (par. 2 ods. 14: emitent na regulovanom trhu,</text>
<text x="107.0" y="608.5" font-size="13.0" fill="#374151">banka, poisťovňa, DSS) = vždy VEĽKÁ bez ohľadu na</text>
<text x="107.0" y="625.0" font-size="13.0" fill="#374151">prahy. Kto sa nevie zatriediť = malá; mikro môže</text>
<text x="107.0" y="641.5" font-size="13.0" fill="#374151">dobrovoľne ako malá (nahor áno).</text>
<rect x="90.0" y="679.0" width="380" height="137.0" rx="12" fill="#ffffff" stroke="#6a6eb3" stroke-width="2.5"/>
<rect x="90.0" y="679.0" width="7" height="137.0" rx="3.5" fill="#6a6eb3"/>
<text x="107.0" y="706.0" font-size="14.5" font-weight="700" fill="#1a3868">5. Časový test: prvý deň obdobia a dve po</text>
<text x="107.0" y="725.0" font-size="14.5" font-weight="700" fill="#1a3868">sebe idúce obdobia (§ 2 ods. 10)</text>
<text x="107.0" y="749.0" font-size="13.0" fill="#374151">Posudzuje sa k prvému dňu obdobia za 2</text>
<text x="107.0" y="765.5" font-size="13.0" fill="#374151">predchádzajúce obdobia; zmena až od nasledujúceho</text>
<text x="107.0" y="782.0" font-size="13.0" fill="#374151">obdobia po 2 po sebe idúcich obdobiach prekročenia.</text>
<text x="107.0" y="798.5" font-size="13.0" fill="#374151">Pri likvidácii/konkurze sa zatriedenie nemení.</text>
<rect x="810.0" y="167.5" width="380" height="137.0" rx="12" fill="#ffffff" stroke="#9a562a" stroke-width="2.5"/>
<rect x="810.0" y="167.5" width="7" height="137.0" rx="3.5" fill="#9a562a"/>
<text x="827.0" y="194.5" font-size="14.5" font-weight="700" fill="#1a3868">6. Tri zložky závierky a spoločný základ (§</text>
<text x="827.0" y="213.5" font-size="14.5" font-weight="700" fill="#1a3868">17)</text>
<text x="827.0" y="237.5" font-size="13.0" fill="#374151">Závierka v PÚ = súvaha + výkaz ziskov a strát +</text>
<text x="827.0" y="254.0" font-size="13.0" fill="#374151">poznámky (par. 17 ods. 3), rovnaké pre všetkých.</text>
<text x="827.0" y="270.5" font-size="13.0" fill="#374151">Líši sa rozsah. Opatrenia: mikro 15464/2013, malé</text>
<text x="827.0" y="287.0" font-size="13.0" fill="#374151">23378/2014, veľké/SVZ 23377/2014.</text>
<rect x="810.0" y="324.5" width="380" height="118.0" rx="12" fill="#ffffff" stroke="#e6251e" stroke-width="2.5"/>
<rect x="810.0" y="324.5" width="7" height="118.0" rx="3.5" fill="#e6251e"/>
<text x="827.0" y="351.5" font-size="14.5" font-weight="700" fill="#1a3868">7. Rozdiely v súvahe podľa veľkosti</text>
<text x="827.0" y="375.5" font-size="13.0" fill="#374151">Súvaha: mikro SKRÁTENÁ (len NETTO); malá a veľká</text>
<text x="827.0" y="392.0" font-size="13.0" fill="#374151">plný vzor v 3 stĺpcoch (brutto/korekcia/netto).</text>
<text x="827.0" y="408.5" font-size="13.0" fill="#374151">Veľká navyše analyticky člení podľa prepojenosti,</text>
<text x="827.0" y="425.0" font-size="13.0" fill="#374151">malá tieto riadky nevypĺňa.</text>
<rect x="810.0" y="462.5" width="380" height="118.0" rx="12" fill="#ffffff" stroke="#0e7490" stroke-width="2.5"/>
<rect x="810.0" y="462.5" width="7" height="118.0" rx="3.5" fill="#0e7490"/>
<text x="827.0" y="489.5" font-size="14.5" font-weight="700" fill="#1a3868">8. Rozdiely vo výkaze ziskov a strát</text>
<text x="827.0" y="513.5" font-size="13.0" fill="#374151">Výkaz ziskov a strát: mikro skrátený; malá a veľká</text>
<text x="827.0" y="530.0" font-size="13.0" fill="#374151">rovnaký podrobnejší (Úč POD). Mikro neúčtuje o</text>
<text x="827.0" y="546.5" font-size="13.0" fill="#374151">odloženej dani, neoceňuje reálnou hodnotou = mikro</text>
<text x="827.0" y="563.0" font-size="13.0" fill="#374151">režim úľav.</text>
<rect x="810.0" y="600.5" width="380" height="118.0" rx="12" fill="#ffffff" stroke="#b45309" stroke-width="2.5"/>
<rect x="810.0" y="600.5" width="7" height="118.0" rx="3.5" fill="#b45309"/>
<text x="827.0" y="627.5" font-size="14.5" font-weight="700" fill="#1a3868">9. Rozdiely v poznámkach – najväčší rozdiel</text>
<text x="827.0" y="651.5" font-size="13.0" fill="#374151">Najväčší rozdiel = POZNÁMKY: mikro najstručnejšie</text>
<text x="827.0" y="668.0" font-size="13.0" fill="#374151">(len bežné obdobie), malá širšie, veľká/SVZ</text>
<text x="827.0" y="684.5" font-size="13.0" fill="#374151">približne dvojnásobok + členenie podľa prepojenosti.</text>
<text x="827.0" y="701.0" font-size="13.0" fill="#374151">Novela 013838/2025-74 od 1.1.2026.</text>
</svg>