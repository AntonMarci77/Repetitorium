<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1082" font-family="Segoe UI, Roboto, Arial, sans-serif">
<rect x="0" y="0" width="1280" height="1082" fill="#f7f6f3"/>
<text x="32" y="40" font-size="19" font-weight="700" fill="#1a3868">Mentálna mapa</text>
<text x="32" y="59" font-size="12.5" fill="#6b7280">ING I 04 · esencia odpovede k bodom tézy</text>
<path d="M 490.0 556.0 C 420.0 556.0, 540.0 163.2, 470.0 163.2" stroke="#00adbd" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 490.0 556.0 C 420.0 556.0, 540.0 360.2, 470.0 360.2" stroke="#f26539" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 490.0 556.0 C 420.0 556.0, 540.0 547.8, 470.0 547.8" stroke="#28b065" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 490.0 556.0 C 420.0 556.0, 540.0 743.5, 470.0 743.5" stroke="#803594" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 490.0 556.0 C 420.0 556.0, 540.0 948.8, 470.0 948.8" stroke="#6a6eb3" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 790.0 556.0 C 860.0 556.0, 740.0 266.5, 810.0 266.5" stroke="#9a562a" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 790.0 556.0 C 860.0 556.0, 740.0 471.8, 810.0 471.8" stroke="#e6251e" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 790.0 556.0 C 860.0 556.0, 740.0 667.5, 810.0 667.5" stroke="#0e7490" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 790.0 556.0 C 860.0 556.0, 740.0 846.8, 810.0 846.8" stroke="#b45309" stroke-width="2.5" fill="none" opacity="0.85"/>
<rect x="490.0" y="505.5" width="300" height="101.0" rx="15" fill="#1a3868"/>
<text x="640.0" y="538.5" font-size="18.0" font-weight="700" fill="#ffffff" text-anchor="middle">Výnosy zo zmlúv o</text>
<text x="640.0" y="561.5" font-size="18.0" font-weight="700" fill="#ffffff" text-anchor="middle">predaji výkonov podľa</text>
<text x="640.0" y="584.5" font-size="18.0" font-weight="700" fill="#ffffff" text-anchor="middle">IFRS 15</text>
<rect x="90.0" y="70.0" width="380" height="186.5" rx="12" fill="#ffffff" stroke="#00adbd" stroke-width="2.5"/>
<rect x="90.0" y="70.0" width="7" height="186.5" rx="3.5" fill="#00adbd"/>
<text x="107.0" y="97.0" font-size="14.5" font-weight="700" fill="#1a3868">1. Pôsobnosť a podmienky pre uplatnenie IFRS</text>
<text x="107.0" y="116.0" font-size="14.5" font-weight="700" fill="#1a3868">15</text>
<text x="107.0" y="140.0" font-size="13.0" fill="#374151">Uplatňuje sa na zmluvy so zákazníkmi (nadobudnutie</text>
<text x="107.0" y="156.5" font-size="13.0" fill="#374151">tovaru/služieb z bežnej činnosti za protihodnotu).</text>
<text x="107.0" y="173.0" font-size="13.0" fill="#374151">Vyňaté: lízingy (IFRS 16), poistné zmluvy (IFRS 17),</text>
<text x="107.0" y="189.5" font-size="13.0" fill="#374151">finančné nástroje (IFRS 9 a i.) a nepeňažné výmeny v</text>
<text x="107.0" y="206.0" font-size="13.0" fill="#374151">rovnakej oblasti podnikania. Protistrana NIE je</text>
<text x="107.0" y="222.5" font-size="13.0" fill="#374151">zákazník, ak strany spoločne znášajú riziká a úžitky</text>
<text x="107.0" y="239.0" font-size="13.0" fill="#374151">(dohoda o spolupráci).</text>
<rect x="90.0" y="276.5" width="380" height="167.5" rx="12" fill="#ffffff" stroke="#f26539" stroke-width="2.5"/>
<rect x="90.0" y="276.5" width="7" height="167.5" rx="3.5" fill="#f26539"/>
<text x="107.0" y="303.5" font-size="14.5" font-weight="700" fill="#1a3868">2. Krok 1 – Identifikácia zmluvy (5 kritérií)</text>
<text x="107.0" y="327.5" font-size="13.0" fill="#374151">Zmluva sa účtuje len ak sú splnené VŠETKY kritériá:</text>
<text x="107.0" y="344.0" font-size="13.0" fill="#374151">a) súhlas strán a odhodlanie plniť; b)</text>
<text x="107.0" y="360.5" font-size="13.0" fill="#374151">identifikovateľné práva; c) identifikovateľné</text>
<text x="107.0" y="377.0" font-size="13.0" fill="#374151">platobné podmienky; d) komerčná podstata; e)</text>
<text x="107.0" y="393.5" font-size="13.0" fill="#374151">pravdepodobnosť získania protihodnoty (schopnosť a</text>
<text x="107.0" y="410.0" font-size="13.0" fill="#374151">úmysel zaplatiť). Inak je prijatá platba záväzok,</text>
<text x="107.0" y="426.5" font-size="13.0" fill="#374151">nie výnos.</text>
<rect x="90.0" y="464.0" width="380" height="167.5" rx="12" fill="#ffffff" stroke="#28b065" stroke-width="2.5"/>
<rect x="90.0" y="464.0" width="7" height="167.5" rx="3.5" fill="#28b065"/>
<text x="107.0" y="491.0" font-size="14.5" font-weight="700" fill="#1a3868">3. Krok 2 – Identifikácia povinností plnenia</text>
<text x="107.0" y="515.0" font-size="13.0" fill="#374151">Identifikujú sa samostatné povinnosti = prísľub</text>
<text x="107.0" y="531.5" font-size="13.0" fill="#374151">previesť odlišný (distinct) tovar/službu. Odlišný,</text>
<text x="107.0" y="548.0" font-size="13.0" fill="#374151">ak: zákazník z neho má úžitok samostatne (alebo s</text>
<text x="107.0" y="564.5" font-size="13.0" fill="#374151">dostupnými zdrojmi) A prísľub je oddeliteľný od</text>
<text x="107.0" y="581.0" font-size="13.0" fill="#374151">ostatných. Administratívne úkony bez prevodu nie sú</text>
<text x="107.0" y="597.5" font-size="13.0" fill="#374151">povinnosťou. Príklad: stroj + servisná zmluva = dve</text>
<text x="107.0" y="614.0" font-size="13.0" fill="#374151">povinnosti.</text>
<rect x="90.0" y="651.5" width="380" height="184.0" rx="12" fill="#ffffff" stroke="#803594" stroke-width="2.5"/>
<rect x="90.0" y="651.5" width="7" height="184.0" rx="3.5" fill="#803594"/>
<text x="107.0" y="678.5" font-size="14.5" font-weight="700" fill="#1a3868">4. Krok 3 – Určenie transakčnej ceny</text>
<text x="107.0" y="702.5" font-size="13.0" fill="#374151">Transakčná cena = očakávaná protihodnota bez súm v</text>
<text x="107.0" y="719.0" font-size="13.0" fill="#374151">mene tretích strán (DPH). Zohľadní: premenlivú</text>
<text x="107.0" y="735.5" font-size="13.0" fill="#374151">protihodnotu (zľavy, bonusy – odhad očakávanou</text>
<text x="107.0" y="752.0" font-size="13.0" fill="#374151">hodnotou/najpravdepodobnejšou sumou s obmedzením,</text>
<text x="107.0" y="768.5" font-size="13.0" fill="#374151">aby nedošlo k významnému zníženiu výnosu), významnú</text>
<text x="107.0" y="785.0" font-size="13.0" fill="#374151">zložku financovania (časová hodnota peňazí),</text>
<text x="107.0" y="801.5" font-size="13.0" fill="#374151">nepeňažnú protihodnotu (reálna hodnota) a</text>
<text x="107.0" y="818.0" font-size="13.0" fill="#374151">protihodnotu splatnú zákazníkovi (znižuje cenu).</text>
<rect x="90.0" y="855.5" width="380" height="186.5" rx="12" fill="#ffffff" stroke="#6a6eb3" stroke-width="2.5"/>
<rect x="90.0" y="855.5" width="7" height="186.5" rx="3.5" fill="#6a6eb3"/>
<text x="107.0" y="882.5" font-size="14.5" font-weight="700" fill="#1a3868">5. Krok 4 – Alokácia ceny na povinnosti</text>
<text x="107.0" y="901.5" font-size="14.5" font-weight="700" fill="#1a3868">plnenia</text>
<text x="107.0" y="925.5" font-size="13.0" fill="#374151">Cena sa rozdelí na povinnosti v pomere ich</text>
<text x="107.0" y="942.0" font-size="13.0" fill="#374151">samostatných predajných cien (stand-alone selling</text>
<text x="107.0" y="958.5" font-size="13.0" fill="#374151">price); ak nie sú pozorovateľné, odhadnú sa (náklady</text>
<text x="107.0" y="975.0" font-size="13.0" fill="#374151">plus marža, trhová cena). Zľava (súčet samostatných</text>
<text x="107.0" y="991.5" font-size="13.0" fill="#374151">cien &gt; transakčná cena) sa spravidla alokuje</text>
<text x="107.0" y="1008.0" font-size="13.0" fill="#374151">pomerne. Bráni to skresleniu výnosu presunom hodnoty</text>
<text x="107.0" y="1024.5" font-size="13.0" fill="#374151">medzi položkami.</text>
<rect x="810.0" y="181.5" width="380" height="170.0" rx="12" fill="#ffffff" stroke="#9a562a" stroke-width="2.5"/>
<rect x="810.0" y="181.5" width="7" height="170.0" rx="3.5" fill="#9a562a"/>
<text x="827.0" y="208.5" font-size="14.5" font-weight="700" fill="#1a3868">6. Krok 5 – Vykázanie výnosu pri splnení</text>
<text x="827.0" y="227.5" font-size="14.5" font-weight="700" fill="#1a3868">povinnosti</text>
<text x="827.0" y="251.5" font-size="13.0" fill="#374151">Výnos sa vykáže pri prevode KONTROLY na zákazníka</text>
<text x="827.0" y="268.0" font-size="13.0" fill="#374151">(schopnosť riadiť použitie aktíva, získať v podstate</text>
<text x="827.0" y="284.5" font-size="13.0" fill="#374151">všetky úžitky a zabrániť v tom iným). Najprv sa</text>
<text x="827.0" y="301.0" font-size="13.0" fill="#374151">určí, či sa povinnosť plní postupom času; ak nie, v</text>
<text x="827.0" y="317.5" font-size="13.0" fill="#374151">určitom okamihu. Rozhoduje sa pri vzniku zmluvy pre</text>
<text x="827.0" y="334.0" font-size="13.0" fill="#374151">každú povinnosť osobitne.</text>
<rect x="810.0" y="371.5" width="380" height="200.5" rx="12" fill="#ffffff" stroke="#e6251e" stroke-width="2.5"/>
<rect x="810.0" y="371.5" width="7" height="200.5" rx="3.5" fill="#e6251e"/>
<text x="827.0" y="398.5" font-size="14.5" font-weight="700" fill="#1a3868">7. Over time vs. point in time – kritériá</text>
<text x="827.0" y="422.5" font-size="13.0" fill="#374151">Postupom času (over time), ak je splnené aspoň JEDNO</text>
<text x="827.0" y="439.0" font-size="13.0" fill="#374151">z troch kritérií: a) zákazník súbežne spotrebúva</text>
<text x="827.0" y="455.5" font-size="13.0" fill="#374151">úžitky (služby); b) ÚJ vytvára/vylepšuje aktívum pod</text>
<text x="827.0" y="472.0" font-size="13.0" fill="#374151">kontrolou zákazníka (stavba na jeho pozemku); c)</text>
<text x="827.0" y="488.5" font-size="13.0" fill="#374151">aktívum bez alternatívneho použitia + vymožiteľné</text>
<text x="827.0" y="505.0" font-size="13.0" fill="#374151">právo na platbu za doterajšie plnenie. Ak ani jedno</text>
<text x="827.0" y="521.5" font-size="13.0" fill="#374151">– v určitom okamihu (point in time) podľa</text>
<text x="827.0" y="538.0" font-size="13.0" fill="#374151">indikátorov prevodu kontroly (platba, vlastníctvo,</text>
<text x="827.0" y="554.5" font-size="13.0" fill="#374151">držba, riziká, prevzatie).</text>
<rect x="810.0" y="592.0" width="380" height="151.0" rx="12" fill="#ffffff" stroke="#0e7490" stroke-width="2.5"/>
<rect x="810.0" y="592.0" width="7" height="151.0" rx="3.5" fill="#0e7490"/>
<text x="827.0" y="619.0" font-size="14.5" font-weight="700" fill="#1a3868">8. Stanovenie výšky výnosu v bežnom období</text>
<text x="827.0" y="643.0" font-size="13.0" fill="#374151">Pri point in time celá alokovaná suma v momente</text>
<text x="827.0" y="659.5" font-size="13.0" fill="#374151">prevodu kontroly. Pri over time časť podľa</text>
<text x="827.0" y="676.0" font-size="13.0" fill="#374151">dosiahnutého pokroku (napr. % rozostavanosti x</text>
<text x="827.0" y="692.5" font-size="13.0" fill="#374151">alokovaná cena) mínus už vykázané výnosy. Premietne</text>
<text x="827.0" y="709.0" font-size="13.0" fill="#374151">sa premenlivá protihodnota a jej obmedzenie; sumy v</text>
<text x="827.0" y="725.5" font-size="13.0" fill="#374151">mene tretích strán (DPH) sa nezahŕňajú.</text>
<rect x="810.0" y="763.0" width="380" height="167.5" rx="12" fill="#ffffff" stroke="#b45309" stroke-width="2.5"/>
<rect x="810.0" y="763.0" width="7" height="167.5" rx="3.5" fill="#b45309"/>
<text x="827.0" y="790.0" font-size="14.5" font-weight="700" fill="#1a3868">9. Transakcie mimo IFRS 15</text>
<text x="827.0" y="814.0" font-size="13.0" fill="#374151">Mimo IFRS 15: transakcie s vlastníkmi (rozdiel</text>
<text x="827.0" y="830.5" font-size="13.0" fill="#374151">nad/pod férovú cenu = pohyb vo vlastnom imaní, nie</text>
<text x="827.0" y="847.0" font-size="13.0" fill="#374151">výnos/náklad), transakcie bez komerčnej podstaty</text>
<text x="827.0" y="863.5" font-size="13.0" fill="#374151">(nemenia budúce peňažné toky – bez výnosu) a predaj</text>
<text x="827.0" y="880.0" font-size="13.0" fill="#374151">nefinančného majetku neobstarávaného na predaj (IAS</text>
<text x="827.0" y="896.5" font-size="13.0" fill="#374151">1 – vykáže sa len ČISTÝ zisk/strata = cena mínus</text>
<text x="827.0" y="913.0" font-size="13.0" fill="#374151">zostatková hodnota, nie hrubý výnos).</text>
</svg>