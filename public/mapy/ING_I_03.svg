<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 861" font-family="Segoe UI, Roboto, Arial, sans-serif">
<rect x="0" y="0" width="1280" height="861" fill="#f7f6f3"/>
<text x="32" y="40" font-size="19" font-weight="700" fill="#1a3868">Mentálna mapa</text>
<text x="32" y="59" font-size="12.5" fill="#6b7280">ING I 03 · esencia odpovede k bodom tézy</text>
<path d="M 490.0 445.8 C 420.0 445.8, 540.0 196.2, 470.0 196.2" stroke="#00adbd" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 490.0 445.8 C 420.0 445.8, 540.0 359.0, 470.0 359.0" stroke="#f26539" stroke-width="2.5" fill="none" opacity="0.85"/>
