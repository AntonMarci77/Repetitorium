<path d="M 490.0 445.8 C 420.0 445.8, 540.0 694.0, 470.0 694.0" stroke="#803594" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 790.0 445.8 C 860.0 445.8, 740.0 155.0, 810.0 155.0" stroke="#6a6eb3" stroke-width="2.5" fill="none" opacity="0.85"/>
