<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 952" font-family="Segoe UI, Roboto, Arial, sans-serif">
<rect x="0" y="0" width="1280" height="952" fill="#f7f6f3"/>
<text x="32" y="40" font-size="19" font-weight="700" fill="#1a3868">Mentálna mapa</text>
<text x="32" y="59" font-size="12.5" fill="#6b7280">BC II 08 · esencia odpovede k bodom tézy</text>
<path d="M 490.0 491.2 C 420.0 491.2, 540.0 137.2, 470.0 137.2" stroke="#00adbd" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 490.0 491.2 C 420.0 491.2, 540.0 309.5, 470.0 309.5" stroke="#f26539" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 490.0 491.2 C 420.0 491.2, 540.0 481.8, 470.0 481.8" stroke="#28b065" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 490.0 491.2 C 420.0 491.2, 540.0 654.0, 470.0 654.0" stroke="#803594" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 490.0 491.2 C 420.0 491.2, 540.0 835.8, 470.0 835.8" stroke="#6a6eb3" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 790.0 491.2 C 860.0 491.2, 740.0 224.0, 810.0 224.0" stroke="#9a562a" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 790.0 491.2 C 860.0 491.2, 740.0 397.5, 810.0 397.5" stroke="#e6251e" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 790.0 491.2 C 860.0 491.2, 740.0 569.8, 810.0 569.8" stroke="#0e7490" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 790.0 491.2 C 860.0 491.2, 740.0 750.2, 810.0 750.2" stroke="#b45309" stroke-width="2.5" fill="none" opacity="0.85"/>
<rect x="490.0" y="440.8" width="300" height="101.0" rx="15" fill="#1a3868"/>
<text x="640.0" y="473.8" font-size="18.0" font-weight="700" fill="#ffffff" text-anchor="middle">Vybrané aspekty úpravy</text>
<text x="640.0" y="496.8" font-size="18.0" font-weight="700" fill="#ffffff" text-anchor="middle">výsledku hospodárenia na</text>
<text x="640.0" y="519.8" font-size="18.0" font-weight="700" fill="#ffffff" text-anchor="middle">základ dane</text>
<rect x="90.0" y="70.0" width="380" height="134.5" rx="12" fill="#ffffff" stroke="#00adbd" stroke-width="2.5"/>
<rect x="90.0" y="70.0" width="7" height="134.5" rx="3.5" fill="#00adbd"/>
<text x="107.0" y="97.0" font-size="14.5" font-weight="700" fill="#1a3868">1. Dva typy rozdielov</text>
<text x="107.0" y="121.0" font-size="13.0" fill="#374151">Trvalý rozdiel sa nikdy nevyrovná (náklady: pokuty</text>
<text x="107.0" y="137.5" font-size="13.0" fill="#374151">od štátu, reprezentácia; výnosy: oslobodená</text>
<text x="107.0" y="154.0" font-size="13.0" fill="#374151">dividenda) - bez odloženej dane. Dočasný sa vyrovná</text>
<text x="107.0" y="170.5" font-size="13.0" fill="#374151">v inom období (nezaplatený náklad § 17/19, OP,</text>
<text x="107.0" y="187.0" font-size="13.0" fill="#374151">rezerva) - vzniká z neho odložená daň.</text>
<rect x="90.0" y="224.5" width="380" height="170.0" rx="12" fill="#ffffff" stroke="#f26539" stroke-width="2.5"/>
<rect x="90.0" y="224.5" width="7" height="170.0" rx="3.5" fill="#f26539"/>
<text x="107.0" y="251.5" font-size="14.5" font-weight="700" fill="#1a3868">2. Technické zhodnotenie majetku (§ 17 ods.</text>
<text x="107.0" y="270.5" font-size="14.5" font-weight="700" fill="#1a3868">20, § 24 ods. 2)</text>
<text x="107.0" y="294.5" font-size="13.0" fill="#374151">Technické zhodnotenie nad 1 700 €/rok pri prenajatom</text>
<text x="107.0" y="311.0" font-size="13.0" fill="#374151">majetku odpisuje nájomca (písomný súhlas vlastníka,</text>
<text x="107.0" y="327.5" font-size="13.0" fill="#374151">sám uhrádza) v odpisovej skupine prenajatého</text>
<text x="107.0" y="344.0" font-size="13.0" fill="#374151">majetku. Pri bezodplatnom prevzatí má prenajímateľ</text>
<text x="107.0" y="360.5" font-size="13.0" fill="#374151">nepeňažný príjem vo výške daňovej ZC. TZ sa nedá</text>
<text x="107.0" y="377.0" font-size="13.0" fill="#374151">rozdeliť.</text>
<rect x="90.0" y="414.5" width="380" height="134.5" rx="12" fill="#ffffff" stroke="#28b065" stroke-width="2.5"/>
<rect x="90.0" y="414.5" width="7" height="134.5" rx="3.5" fill="#28b065"/>
<text x="107.0" y="441.5" font-size="14.5" font-weight="700" fill="#1a3868">3. Pokuty, penále a úroky z omeškania</text>
<text x="107.0" y="465.5" font-size="13.0" fill="#374151">Sankcie voči štátu (pokuty správcu dane, penále,</text>
<text x="107.0" y="482.0" font-size="13.0" fill="#374151">úroky z omeškania) sú podľa § 21/2/a nedaňové</text>
<text x="107.0" y="498.5" font-size="13.0" fill="#374151">natrvalo (trvalý rozdiel). Zmluvné pokuty a úroky z</text>
<text x="107.0" y="515.0" font-size="13.0" fill="#374151">omeškania zo súkromných vzťahov sú daňové až po</text>
<text x="107.0" y="531.5" font-size="13.0" fill="#374151">zaplatení (§ 17/19/g) - dočasný rozdiel.</text>
<rect x="90.0" y="569.0" width="380" height="170.0" rx="12" fill="#ffffff" stroke="#803594" stroke-width="2.5"/>
<rect x="90.0" y="569.0" width="7" height="170.0" rx="3.5" fill="#803594"/>
<text x="107.0" y="596.0" font-size="14.5" font-weight="700" fill="#1a3868">4. Náklady uznané až po zaplatení (§ 17 ods.</text>
<text x="107.0" y="615.0" font-size="14.5" font-weight="700" fill="#1a3868">19)</text>
<text x="107.0" y="639.0" font-size="13.0" fill="#374151">§ 17 ods. 19 taxatívne určuje náklady daňové až po</text>
<text x="107.0" y="655.5" font-size="13.0" fill="#374151">úhrade (nájom, licencie FO, marketing, provízie,</text>
<text x="107.0" y="672.0" font-size="13.0" fill="#374151">poradenstvo, zmluvné pokuty). V roku zaúčtovania bez</text>
<text x="107.0" y="688.5" font-size="13.0" fill="#374151">úhrady = pripočítateľná, v roku úhrady =</text>
<text x="107.0" y="705.0" font-size="13.0" fill="#374151">odpočítateľná položka. Bráni krateniu ZD</text>
<text x="107.0" y="721.5" font-size="13.0" fill="#374151">nezaplatenými faktúrami.</text>
<rect x="90.0" y="759.0" width="380" height="153.5" rx="12" fill="#ffffff" stroke="#6a6eb3" stroke-width="2.5"/>
<rect x="90.0" y="759.0" width="7" height="153.5" rx="3.5" fill="#6a6eb3"/>
<text x="107.0" y="786.0" font-size="14.5" font-weight="700" fill="#1a3868">5. Záväzky po splatnosti viac ako 360 dní (§</text>
<text x="107.0" y="805.0" font-size="14.5" font-weight="700" fill="#1a3868">17 ods. 27)</text>
<text x="107.0" y="829.0" font-size="13.0" fill="#374151">Záväzok po splatnosti (§ 17/27): ZD sa zvýši o 20 %</text>
<text x="107.0" y="845.5" font-size="13.0" fill="#374151">nad 360 dní, 50 % nad 720 dní, 100 % nad 1 080 dní.</text>
<text x="107.0" y="862.0" font-size="13.0" fill="#374151">Pásma sú KUMULATÍVNE (dopĺňa sa do vyššej úrovne).</text>
<text x="107.0" y="878.5" font-size="13.0" fill="#374151">Vychádza sa z pôvodnej splatnosti. Po úhrade sa</text>
<text x="107.0" y="895.0" font-size="13.0" fill="#374151">zdanené sumy odpočítajú (§ 17/32).</text>
<rect x="810.0" y="147.2" width="380" height="153.5" rx="12" fill="#ffffff" stroke="#9a562a" stroke-width="2.5"/>
<rect x="810.0" y="147.2" width="7" height="153.5" rx="3.5" fill="#9a562a"/>
<text x="827.0" y="174.2" font-size="14.5" font-weight="700" fill="#1a3868">6. Nezrealizované kurzové rozdiely (§ 17 ods.</text>
<text x="827.0" y="193.2" font-size="14.5" font-weight="700" fill="#1a3868">17)</text>
<text x="827.0" y="217.2" font-size="13.0" fill="#374151">Nezrealizované kurzové rozdiely z neuhradených</text>
<text x="827.0" y="233.8" font-size="13.0" fill="#374151">pohľadávok a záväzkov v cudzej mene sú štandardne v</text>
<text x="827.0" y="250.2" font-size="13.0" fill="#374151">ZD už v období účtovania. Daňovník sa však môže</text>
<text x="827.0" y="266.8" font-size="13.0" fill="#374151">rozhodnúť (oznámi správcovi dane) zahrnúť ich až pri</text>
<text x="827.0" y="283.2" font-size="13.0" fill="#374151">inkase/úhrade (§ 17/17).</text>
<rect x="810.0" y="320.8" width="380" height="153.5" rx="12" fill="#ffffff" stroke="#e6251e" stroke-width="2.5"/>
<rect x="810.0" y="320.8" width="7" height="153.5" rx="3.5" fill="#e6251e"/>
<text x="827.0" y="347.8" font-size="14.5" font-weight="700" fill="#1a3868">7. Manká a škody (§ 21 ods. 2 písm. e, § 19</text>
<text x="827.0" y="366.8" font-size="14.5" font-weight="700" fill="#1a3868">ods. 3 písm. g)</text>
<text x="827.0" y="390.8" font-size="13.0" fill="#374151">Manká a škody sú nedaňové v sume nad prijaté</text>
<text x="827.0" y="407.2" font-size="13.0" fill="#374151">náhrady. Daňové v plnej výške: živelná pohroma a</text>
<text x="827.0" y="423.8" font-size="13.0" fill="#374151">škoda od neznámeho páchateľa potvrdená políciou v</text>
<text x="827.0" y="440.2" font-size="13.0" fill="#374151">tom istom období. Pri známom páchateľovi je suma nad</text>
<text x="827.0" y="456.8" font-size="13.0" fill="#374151">náhrady nedaňová. Stratné do normy je daňové.</text>
<rect x="810.0" y="494.2" width="380" height="151.0" rx="12" fill="#ffffff" stroke="#0e7490" stroke-width="2.5"/>
<rect x="810.0" y="494.2" width="7" height="151.0" rx="3.5" fill="#0e7490"/>
<text x="827.0" y="521.2" font-size="14.5" font-weight="700" fill="#1a3868">8. Rezervy (§ 19 ods. 3 písm. f, § 20)</text>
<text x="827.0" y="545.2" font-size="13.0" fill="#374151">Tvorba rezervy je daňová len ak je taxatívne v § 20</text>
<text x="827.0" y="561.8" font-size="13.0" fill="#374151">(nevyčerpané dovolenky, lesná pestovná činnosť,</text>
<text x="827.0" y="578.2" font-size="13.0" fill="#374151">likvidácia baní, skládky). Účtovné rezervy mimo</text>
<text x="827.0" y="594.8" font-size="13.0" fill="#374151">zoznamu (bonusy, audit, súdne spory) = pri tvorbe</text>
<text x="827.0" y="611.2" font-size="13.0" fill="#374151">pripočítateľná, pri použití odpočítateľná položka.</text>
<text x="827.0" y="627.8" font-size="13.0" fill="#374151">Dohadné položky na známe daňové náklady sú uznané.</text>
<rect x="810.0" y="665.2" width="380" height="170.0" rx="12" fill="#ffffff" stroke="#b45309" stroke-width="2.5"/>
<rect x="810.0" y="665.2" width="7" height="170.0" rx="3.5" fill="#b45309"/>
<text x="827.0" y="692.2" font-size="14.5" font-weight="700" fill="#1a3868">9. Opravné položky a odpis pohľadávky (§ 20,</text>
<text x="827.0" y="711.2" font-size="14.5" font-weight="700" fill="#1a3868">§ 19 ods. 2)</text>
<text x="827.0" y="735.2" font-size="13.0" fill="#374151">Daňová OP k pohľadávke (§ 20/14) len ak bola</text>
<text x="827.0" y="751.8" font-size="13.0" fill="#374151">pohľadávka v zdaniteľných príjmoch, je nepremlčaná a</text>
<text x="827.0" y="768.2" font-size="13.0" fill="#374151">nenadobudnutá postúpením; časový test 20 % (nad 360</text>
<text x="827.0" y="784.8" font-size="13.0" fill="#374151">dní), 50 % (nad 720), 100 % (nad 1 080),</text>
<text x="827.0" y="801.2" font-size="13.0" fill="#374151">kumulatívne, účet 547/391. Je to možnosť, nie</text>
<text x="827.0" y="817.8" font-size="13.0" fill="#374151">povinnosť. Daňový odpis pohľadávky podľa § 19/2.</text>
</svg>