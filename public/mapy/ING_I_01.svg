<path d="M 790.0 425.2 C 860.0 425.2, 740.0 494.2, 810.0 494.2" stroke="#0e7490" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 790.0 425.2 C 860.0 425.2, 740.0 643.0, 810.0 643.0" stroke="#b45309" stroke-width="2.5" fill="none" opacity="0.85"/>
<rect x="490.0" y="374.8" width="300" height="101.0" rx="15" fill="#1a3868"/>
<text x="640.0" y="407.8" font-size="18.0" font-weight="700" fill="#ffffff" text-anchor="middle">Oceňovanie a osobitosti</text>
<text x="640.0" y="430.8" font-size="18.0" font-weight="700" fill="#ffffff" text-anchor="middle">jeho využitia v</text>
<text x="640.0" y="453.8" font-size="18.0" font-weight="700" fill="#ffffff" text-anchor="middle">účtovníctve</text>
<rect x="90.0" y="70.0" width="380" height="118.0" rx="12" fill="#ffffff" stroke="#00adbd" stroke-width="2.5"/>
<rect x="90.0" y="70.0" width="7" height="118.0" rx="3.5" fill="#00adbd"/>
<text x="107.0" y="97.0" font-size="14.5" font-weight="700" fill="#1a3868">1. Význam oceňovania a oceňovacie základne</text>
<text x="107.0" y="121.0" font-size="13.0" fill="#374151">Účtovníctvo meria v peniazoch, ktorých kúpna sila</text>
<text x="107.0" y="137.5" font-size="13.0" fill="#374151">kolíše, preto tri základne: historické ceny</text>
<text x="107.0" y="154.0" font-size="13.0" fill="#374151">(preukázateľné), ceny prítomnosti (reálna hodnota),</text>
<text x="107.0" y="170.5" font-size="13.0" fill="#374151">ceny budúcnosti (diskontovaná SH).</text>
<rect x="90.0" y="208.0" width="380" height="137.0" rx="12" fill="#ffffff" stroke="#f26539" stroke-width="2.5"/>
<rect x="90.0" y="208.0" width="7" height="137.0" rx="3.5" fill="#f26539"/>
<text x="107.0" y="235.0" font-size="14.5" font-weight="700" fill="#1a3868">2. Oceňovacie veličiny vo finančnom</text>
<text x="107.0" y="254.0" font-size="14.5" font-weight="700" fill="#1a3868">účtovníctve (SR)</text>
<text x="107.0" y="278.0" font-size="13.0" fill="#374151">SR viaže veličiny na základne: OC, vlastné náklady,</text>
<text x="107.0" y="294.5" font-size="13.0" fill="#374151">menovitá hodnota (historické), reálna hodnota</text>
<text x="107.0" y="311.0" font-size="13.0" fill="#374151">(prítomnosť), súčasná hodnota (budúcnosť). RH len ak</text>
<text x="107.0" y="327.5" font-size="13.0" fill="#374151">je spoľahlivo zistiteľná.</text>
<rect x="90.0" y="365.0" width="380" height="101.5" rx="12" fill="#ffffff" stroke="#28b065" stroke-width="2.5"/>
<rect x="90.0" y="365.0" width="7" height="101.5" rx="3.5" fill="#28b065"/>
<text x="107.0" y="392.0" font-size="14.5" font-weight="700" fill="#1a3868">3. Časová hodnota peňazí</text>
<text x="107.0" y="416.0" font-size="13.0" fill="#374151">Peniaze dnes &gt; rovnaká suma zajtra, preto sa toky</text>
<text x="107.0" y="432.5" font-size="13.0" fill="#374151">budúcnosti diskontujú. Aplikuje sa pri rezerve na</text>
<text x="107.0" y="449.0" font-size="13.0" fill="#374151">demontáž (do OC), VIU v IAS 36, lízingu.</text>
<rect x="90.0" y="486.5" width="380" height="137.0" rx="12" fill="#ffffff" stroke="#803594" stroke-width="2.5"/>
<rect x="90.0" y="486.5" width="7" height="137.0" rx="3.5" fill="#803594"/>
<text x="107.0" y="513.5" font-size="14.5" font-weight="700" fill="#1a3868">4. Vplyv oceňovania na zachovanie majetkovej</text>
<text x="107.0" y="532.5" font-size="14.5" font-weight="700" fill="#1a3868">podstaty (kapitálu)</text>
<text x="107.0" y="556.5" font-size="13.0" fill="#374151">Zisk až po zachovaní podstaty kapitálu (finančné vs.</text>
<text x="107.0" y="573.0" font-size="13.0" fill="#374151">fyzické udržanie). Historické ceny v inflácii</text>
<text x="107.0" y="589.5" font-size="13.0" fill="#374151">nadúvajú fiktívny zisk; zvýšenie do OSKV ho</text>
<text x="107.0" y="606.0" font-size="13.0" fill="#374151">nerozdelí.</text>
<rect x="90.0" y="643.5" width="380" height="137.0" rx="12" fill="#ffffff" stroke="#6a6eb3" stroke-width="2.5"/>
<rect x="90.0" y="643.5" width="7" height="137.0" rx="3.5" fill="#6a6eb3"/>
<text x="107.0" y="670.5" font-size="14.5" font-weight="700" fill="#1a3868">5. DHM podľa IAS 16 – prvotné a následné</text>
<text x="107.0" y="689.5" font-size="14.5" font-weight="700" fill="#1a3868">ocenenie</text>
<text x="107.0" y="713.5" font-size="13.0" fill="#374151">IAS 16: prvotne obstarávacie náklady (vrátane</text>
<text x="107.0" y="730.0" font-size="13.0" fill="#374151">demontáže, úrokov), následne voľba modelu OC alebo</text>
<text x="107.0" y="746.5" font-size="13.0" fill="#374151">precenenia; odpisuje sa OC mínus reziduál,</text>
<text x="107.0" y="763.0" font-size="13.0" fill="#374151">komponentne.</text>
<rect x="810.0" y="147.2" width="380" height="120.5" rx="12" fill="#ffffff" stroke="#9a562a" stroke-width="2.5"/>
<rect x="810.0" y="147.2" width="7" height="120.5" rx="3.5" fill="#9a562a"/>
<text x="827.0" y="174.2" font-size="14.5" font-weight="700" fill="#1a3868">6. Preceňovanie nevýsledkovo vs. výsledkovo –</text>
<text x="827.0" y="193.2" font-size="14.5" font-weight="700" fill="#1a3868">mechanika (IAS 16, IAS 40)</text>
<text x="827.0" y="217.2" font-size="13.0" fill="#374151">JADRO: IAS 16 zvýšenie NEVÝSLEDKOVO (OSKV/prebytok),</text>
<text x="827.0" y="233.8" font-size="13.0" fill="#374151">zníženie výsledkovo (najprv proti prebytku). IAS 40</text>
<text x="827.0" y="250.2" font-size="13.0" fill="#374151">reálna hodnota VŽDY výsledkovo a NEODPISUJE sa.</text>
<rect x="810.0" y="287.8" width="380" height="118.0" rx="12" fill="#ffffff" stroke="#e6251e" stroke-width="2.5"/>
<rect x="810.0" y="287.8" width="7" height="118.0" rx="3.5" fill="#e6251e"/>
<text x="827.0" y="314.8" font-size="14.5" font-weight="700" fill="#1a3868">7. Investičné nehnuteľnosti podľa IAS 40</text>
<text x="827.0" y="338.8" font-size="13.0" fill="#374151">IAS 40 investičné nehnuteľnosti</text>
<text x="827.0" y="355.2" font-size="13.0" fill="#374151">(prenájom/zhodnotenie): prvotne OC, následne voľba</text>
<text x="827.0" y="371.8" font-size="13.0" fill="#374151">OC modelu alebo modelu reálnej hodnoty (zmena</text>
<text x="827.0" y="388.2" font-size="13.0" fill="#374151">výsledkovo, bez odpisov).</text>
<rect x="810.0" y="425.8" width="380" height="137.0" rx="12" fill="#ffffff" stroke="#0e7490" stroke-width="2.5"/>
<rect x="810.0" y="425.8" width="7" height="137.0" rx="3.5" fill="#0e7490"/>
<text x="827.0" y="452.8" font-size="14.5" font-weight="700" fill="#1a3868">8. Nehmotný majetok podľa IAS 38 a neobežný</text>
<text x="827.0" y="471.8" font-size="14.5" font-weight="700" fill="#1a3868">majetok na predaj podľa IFRS 5</text>
<text x="827.0" y="495.8" font-size="13.0" fill="#374151">IAS 38 model precenenia LEN pri aktívnom trhu;</text>
<text x="827.0" y="512.2" font-size="13.0" fill="#374151">výskum sa neaktivuje, NM s neurčitou životnosťou sa</text>
<text x="827.0" y="528.8" font-size="13.0" fill="#374151">netestuje odpisom. IFRS 5: nižšia z ÚH a FVLCS,</text>
<text x="827.0" y="545.2" font-size="13.0" fill="#374151">neodpisuje sa.</text>
<rect x="810.0" y="582.8" width="380" height="120.5" rx="12" fill="#ffffff" stroke="#b45309" stroke-width="2.5"/>
<rect x="810.0" y="582.8" width="7" height="120.5" rx="3.5" fill="#b45309"/>
<text x="827.0" y="609.8" font-size="14.5" font-weight="700" fill="#1a3868">9. Zníženie hodnoty podľa IAS 36 (opravné</text>
<text x="827.0" y="628.8" font-size="14.5" font-weight="700" fill="#1a3868">položky)</text>
<text x="827.0" y="652.8" font-size="13.0" fill="#374151">IAS 36: spätne získateľná suma = VYŠŠIA z VIU a</text>
<text x="827.0" y="669.2" font-size="13.0" fill="#374151">FVLCS; ak &lt; ÚH, strata zo zníženia (výsledkovo/proti</text>
<text x="827.0" y="685.8" font-size="13.0" fill="#374151">prebytku). Reverzuje sa, okrem goodwillu.</text>
</svg>