<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="Segoe UI, Roboto, Arial, sans-serif">
<rect x="0" y="0" width="1280" height="820" fill="#f7f6f3"/>
<text x="32" y="40" font-size="19" font-weight="700" fill="#1a3868">Mentálna mapa</text>
<text x="32" y="59" font-size="12.5" fill="#6b7280">ING I 01 · esencia odpovede k bodom tézy</text>
<path d="M 490.0 425.2 C 420.0 425.2, 540.0 129.0, 470.0 129.0" stroke="#00adbd" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 490.0 425.2 C 420.0 425.2, 540.0 276.5, 470.0 276.5" stroke="#f26539" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 490.0 425.2 C 420.0 425.2, 540.0 415.8, 470.0 415.8" stroke="#28b065" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 490.0 425.2 C 420.0 425.2, 540.0 555.0, 470.0 555.0" stroke="#803594" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 490.0 425.2 C 420.0 425.2, 540.0 712.0, 470.0 712.0" stroke="#6a6eb3" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 790.0 425.2 C 860.0 425.2, 740.0 207.5, 810.0 207.5" stroke="#9a562a" stroke-width="2.5" fill="none" opacity="0.85"/>
