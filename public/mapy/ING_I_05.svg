<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1200" font-family="Segoe UI, Roboto, Arial, sans-serif">
<rect x="0" y="0" width="1280" height="1200" fill="#f7f6f3"/>
