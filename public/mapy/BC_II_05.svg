<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 834" font-family="Segoe UI, Roboto, Arial, sans-serif">
<rect x="0" y="0" width="1280" height="834" fill="#f7f6f3"/>
<text x="32" y="40" font-size="19" font-weight="700" fill="#1a3868">Mentálna mapa</text>
<text x="32" y="59" font-size="12.5" fill="#6b7280">BC II 05 · esencia odpovede k bodom tézy</text>
<path d="M 490.0 432.2 C 420.0 432.2, 540.0 129.0, 470.0 129.0" stroke="#00adbd" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 490.0 432.2 C 420.0 432.2, 540.0 275.2, 470.0 275.2" stroke="#f26539" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 490.0 432.2 C 420.0 432.2, 540.0 431.0, 470.0 431.0" stroke="#28b065" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 490.0 432.2 C 420.0 432.2, 540.0 588.0, 470.0 588.0" stroke="#803594" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 490.0 432.2 C 420.0 432.2, 540.0 735.5, 470.0 735.5" stroke="#6a6eb3" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 790.0 432.2 C 860.0 432.2, 740.0 189.8, 810.0 189.8" stroke="#9a562a" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 790.0 432.2 C 860.0 432.2, 740.0 327.8, 810.0 327.8" stroke="#e6251e" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 790.0 432.2 C 860.0 432.2, 740.0 483.5, 810.0 483.5" stroke="#0e7490" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 790.0 432.2 C 860.0 432.2, 740.0 657.0, 810.0 657.0" stroke="#b45309" stroke-width="2.5" fill="none" opacity="0.85"/>
<rect x="490.0" y="393.2" width="300" height="78.0" rx="15" fill="#1a3868"/>
<text x="640.0" y="426.2" font-size="18.0" font-weight="700" fill="#ffffff" text-anchor="middle">Predikčné a bankrotové</text>
<text x="640.0" y="449.2" font-size="18.0" font-weight="700" fill="#ffffff" text-anchor="middle">modely a udržateľnosť</text>
<rect x="90.0" y="70.0" width="380" height="118.0" rx="12" fill="#ffffff" stroke="#00adbd" stroke-width="2.5"/>
<rect x="90.0" y="70.0" width="7" height="118.0" rx="3.5" fill="#00adbd"/>
<text x="107.0" y="97.0" font-size="14.5" font-weight="700" fill="#1a3868">1. Bonitné vs. bankrotové modely</text>
<text x="107.0" y="121.0" font-size="13.0" fill="#374151">Bonitné (ratingové) modely hodnotia kvalitu/zdravie</text>
<text x="107.0" y="137.5" font-size="13.0" fill="#374151">podniku (Kralicek); bankrotové (predikčné) odhadujú</text>
<text x="107.0" y="154.0" font-size="13.0" fill="#374151">úpadok porovnaním skrachovaných a zdravých firiem</text>
<text x="107.0" y="170.5" font-size="13.0" fill="#374151">(Altman, IN05, Taffler). IN05 plní obe funkcie.</text>
<rect x="90.0" y="208.0" width="380" height="134.5" rx="12" fill="#ffffff" stroke="#f26539" stroke-width="2.5"/>
<rect x="90.0" y="208.0" width="7" height="134.5" rx="3.5" fill="#f26539"/>
<text x="107.0" y="235.0" font-size="14.5" font-weight="700" fill="#1a3868">2. Ako modely vznikli – diskriminačná analýza</text>
<text x="107.0" y="259.0" font-size="13.0" fill="#374151">Diskriminačná analýza na vzorke bankrotujúcich a</text>
<text x="107.0" y="275.5" font-size="13.0" fill="#374151">zdravých firiem našla premenné a ich váhy do</text>
<text x="107.0" y="292.0" font-size="13.0" fill="#374151">lineárnej funkcie skóre. Model platí len pre</text>
<text x="107.0" y="308.5" font-size="13.0" fill="#374151">prostredie a obdobie kalibrácie, preto vznikli</text>
<text x="107.0" y="325.0" font-size="13.0" fill="#374151">národné verzie.</text>
<rect x="90.0" y="362.5" width="380" height="137.0" rx="12" fill="#ffffff" stroke="#28b065" stroke-width="2.5"/>
<rect x="90.0" y="362.5" width="7" height="137.0" rx="3.5" fill="#28b065"/>
<text x="107.0" y="389.5" font-size="14.5" font-weight="700" fill="#1a3868">3. Altmanovo Z-score – pôvodná verzia</text>
<text x="107.0" y="408.5" font-size="14.5" font-weight="700" fill="#1a3868">(kótované a. s.)</text>
<text x="107.0" y="432.5" font-size="13.0" fill="#374151">Altman Z (kótované a.s., 1968): Z = 1,2x1 + 1,4x2 +</text>
<text x="107.0" y="449.0" font-size="13.0" fill="#374151">3,3x3 + 0,6x4 + 1,0x5; x4 = TRHOVÁ hodnota VI/cudzie</text>
<text x="107.0" y="465.5" font-size="13.0" fill="#374151">zdroje. Pásma: &gt; 2,99 prosperita, 1,81-2,99 sivá, &lt;</text>
<text x="107.0" y="482.0" font-size="13.0" fill="#374151">1,81 bankrot.</text>
<rect x="90.0" y="519.5" width="380" height="137.0" rx="12" fill="#ffffff" stroke="#803594" stroke-width="2.5"/>
<rect x="90.0" y="519.5" width="7" height="137.0" rx="3.5" fill="#803594"/>
<text x="107.0" y="546.5" font-size="14.5" font-weight="700" fill="#1a3868">4. Altmanovo Z'-score – pre nekótované</text>
<text x="107.0" y="565.5" font-size="14.5" font-weight="700" fill="#1a3868">podniky</text>
<text x="107.0" y="589.5" font-size="13.0" fill="#374151">Z'-score (nekótované): x4 = ÚČTOVNÁ hodnota</text>
<text x="107.0" y="606.0" font-size="13.0" fill="#374151">VI/cudzie zdroje, zmenené váhy (0,717; 0,847; 3,107;</text>
<text x="107.0" y="622.5" font-size="13.0" fill="#374151">0,420; 0,998). Pásma: &gt; 2,9 uspokojivá, 1,23-2,9</text>
<text x="107.0" y="639.0" font-size="13.0" fill="#374151">sivá, &lt; 1,23 problémy.</text>
<rect x="90.0" y="676.5" width="380" height="118.0" rx="12" fill="#ffffff" stroke="#6a6eb3" stroke-width="2.5"/>
<rect x="90.0" y="676.5" width="7" height="118.0" rx="3.5" fill="#6a6eb3"/>
<text x="107.0" y="703.5" font-size="14.5" font-weight="700" fill="#1a3868">5. Index IN05 (manželia Neumaierovci, ČR)</text>
<text x="107.0" y="727.5" font-size="13.0" fill="#374151">IN05 (Neumaierovci, stredná Európa) = 0,13A + 0,04B</text>
<text x="107.0" y="744.0" font-size="13.0" fill="#374151">+ 3,97C + 0,21D + 0,09E; B (úrokové krytie) sa zhora</text>
<text x="107.0" y="760.5" font-size="13.0" fill="#374151">obmedzí na 9. Pásma: &gt; 1,6 tvorí hodnotu, 0,9-1,6</text>
<text x="107.0" y="777.0" font-size="13.0" fill="#374151">sivá, &lt; 0,9 bankrot. Nepracuje s trhovou hodnotou.</text>
<rect x="810.0" y="130.8" width="380" height="118.0" rx="12" fill="#ffffff" stroke="#9a562a" stroke-width="2.5"/>
<rect x="810.0" y="130.8" width="7" height="118.0" rx="3.5" fill="#9a562a"/>
<text x="827.0" y="157.8" font-size="14.5" font-weight="700" fill="#1a3868">6. Tafflerov a Beaverov model</text>
<text x="827.0" y="181.8" font-size="13.0" fill="#374151">Taffler: rozhoduje ZNAMIENKO (TZ &gt; 0 zdravý, TZ &lt; 0</text>
<text x="827.0" y="198.2" font-size="13.0" fill="#374151">riziko). Beaver je jednorozmerný, sleduje TREND</text>
<text x="827.0" y="214.8" font-size="13.0" fill="#374151">ukazovateľov (najsilnejší cash flow/cudzie zdroje);</text>
<text x="827.0" y="231.2" font-size="13.0" fill="#374151">varuje už 5 rokov vopred.</text>
<rect x="810.0" y="268.8" width="380" height="118.0" rx="12" fill="#ffffff" stroke="#e6251e" stroke-width="2.5"/>
<rect x="810.0" y="268.8" width="7" height="118.0" rx="3.5" fill="#e6251e"/>
<text x="827.0" y="295.8" font-size="14.5" font-weight="700" fill="#1a3868">7. Interpretácia, obmedzenia a kombinovanie</text>
<text x="827.0" y="319.8" font-size="13.0" fill="#374151">Model je len pravdepodobnostné varovanie (nízke</text>
<text x="827.0" y="336.2" font-size="13.0" fill="#374151">skóre = nutná, nie postačujúca podmienka úpadku);</text>
<text x="827.0" y="352.8" font-size="13.0" fill="#374151">čítať v čase (trend), kombinovať viac modelov a</text>
<text x="827.0" y="369.2" font-size="13.0" fill="#374151">doplniť pomerovou analýzou.</text>
<rect x="810.0" y="406.8" width="380" height="153.5" rx="12" fill="#ffffff" stroke="#0e7490" stroke-width="2.5"/>
<rect x="810.0" y="406.8" width="7" height="153.5" rx="3.5" fill="#0e7490"/>
<text x="827.0" y="433.8" font-size="14.5" font-weight="700" fill="#1a3868">8. Udržateľnosť vo výročnej správe – CSRD a</text>
<text x="827.0" y="452.8" font-size="14.5" font-weight="700" fill="#1a3868">ESRS</text>
<text x="827.0" y="476.8" font-size="13.0" fill="#374151">CSRD (EÚ 2022/2464) zaviedla povinnú správu o</text>
<text x="827.0" y="493.2" font-size="13.0" fill="#374151">udržateľnosti (ESG) ako súčasť výročnej správy podľa</text>
<text x="827.0" y="509.8" font-size="13.0" fill="#374151">štandardov ESRS; vykazuje sa v XHTML s tagovaním a</text>
<text x="827.0" y="526.2" font-size="13.0" fill="#374151">uistením audítora (limited assurance). Princíp</text>
<text x="827.0" y="542.8" font-size="13.0" fill="#374151">dvojitej významnosti.</text>
<rect x="810.0" y="580.2" width="380" height="153.5" rx="12" fill="#ffffff" stroke="#b45309" stroke-width="2.5"/>
<rect x="810.0" y="580.2" width="7" height="153.5" rx="3.5" fill="#b45309"/>
<text x="827.0" y="607.2" font-size="14.5" font-weight="700" fill="#1a3868">9. Aktuálny stav CSRD v SR (2025/2026):</text>
<text x="827.0" y="626.2" font-size="14.5" font-weight="700" fill="#1a3868">Stop-the-clock a Omnibus I</text>
<text x="827.0" y="650.2" font-size="13.0" fill="#374151">CSRD do SR transponovaná novelou zákona 431/2002 (od</text>
<text x="827.0" y="666.8" font-size="13.0" fill="#374151">1.6.2024, §20c a §20g). Stop-the-clock (2025/1794)</text>
<text x="827.0" y="683.2" font-size="13.0" fill="#374151">odložila 2. a 3. vlnu o 2 roky; Omnibus I (2026/470,</text>
<text x="827.0" y="699.8" font-size="13.0" fill="#374151">účinná 18.3.2026) zúžil rozsah na podniky nad 1000</text>
<text x="827.0" y="716.2" font-size="13.0" fill="#374151">zamestnancov a obrat nad 450 mil. € od obdobia 2027.</text>
</svg>