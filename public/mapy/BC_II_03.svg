<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 699" font-family="Segoe UI, Roboto, Arial, sans-serif">
<rect x="0" y="0" width="1280" height="699" fill="#f7f6f3"/>
<text x="32" y="40" font-size="19" font-weight="700" fill="#1a3868">Mentálna mapa</text>
<text x="32" y="59" font-size="12.5" fill="#6b7280">BC II 03 · esencia odpovede k bodom tézy</text>
<path d="M 490.0 364.5 C 420.0 364.5, 540.0 157.5, 470.0 157.5" stroke="#00adbd" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 490.0 364.5 C 420.0 364.5, 540.0 295.5, 470.0 295.5" stroke="#f26539" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 490.0 364.5 C 420.0 364.5, 540.0 433.5, 470.0 433.5" stroke="#28b065" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 490.0 364.5 C 420.0 364.5, 540.0 571.5, 470.0 571.5" stroke="#803594" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 790.0 364.5 C 860.0 364.5, 740.0 129.0, 810.0 129.0" stroke="#6a6eb3" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 790.0 364.5 C 860.0 364.5, 740.0 276.5, 810.0 276.5" stroke="#9a562a" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 790.0 364.5 C 860.0 364.5, 740.0 433.5, 810.0 433.5" stroke="#e6251e" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 790.0 364.5 C 860.0 364.5, 740.0 590.5, 810.0 590.5" stroke="#0e7490" stroke-width="2.5" fill="none" opacity="0.85"/>
<rect x="490.0" y="314.0" width="300" height="101.0" rx="15" fill="#1a3868"/>
<text x="640.0" y="347.0" font-size="18.0" font-weight="700" fill="#ffffff" text-anchor="middle">Finančná analýza</text>
<text x="640.0" y="370.0" font-size="18.0" font-weight="700" fill="#ffffff" text-anchor="middle">individuálnej účtovnej</text>
<text x="640.0" y="393.0" font-size="18.0" font-weight="700" fill="#ffffff" text-anchor="middle">závierky</text>
<rect x="90.0" y="98.5" width="380" height="118.0" rx="12" fill="#ffffff" stroke="#00adbd" stroke-width="2.5"/>
<rect x="90.0" y="98.5" width="7" height="118.0" rx="3.5" fill="#00adbd"/>
<text x="107.0" y="125.5" font-size="14.5" font-weight="700" fill="#1a3868">1. Charakteristika a používatelia FA</text>
<text x="107.0" y="149.5" font-size="13.0" fill="#374151">FA hodnotí finančné zdravie: výkonnosť, likviditu,</text>
<text x="107.0" y="166.0" font-size="13.0" fill="#374151">zadlženosť, efektívnosť. Interní (manažment,</text>
<text x="107.0" y="182.5" font-size="13.0" fill="#374151">vlastníci) pre riadenie; externí (banky, investori,</text>
<text x="107.0" y="199.0" font-size="13.0" fill="#374151">dodávatelia, štát) podľa svojho záujmu.</text>
<rect x="90.0" y="236.5" width="380" height="118.0" rx="12" fill="#ffffff" stroke="#f26539" stroke-width="2.5"/>
<rect x="90.0" y="236.5" width="7" height="118.0" rx="3.5" fill="#f26539"/>
<text x="107.0" y="263.5" font-size="14.5" font-weight="700" fill="#1a3868">2. Vstupné a výstupné údaje</text>
<text x="107.0" y="287.5" font-size="13.0" fill="#374151">Vstupy: súvaha (stavové), výkaz ziskov a strát</text>
<text x="107.0" y="304.0" font-size="13.0" fill="#374151">(tokové), poznámky vrátane cash flow. Výstup:</text>
<text x="107.0" y="320.5" font-size="13.0" fill="#374151">ukazovatele + porovnanie + SLOVNÁ interpretácia.</text>
<text x="107.0" y="337.0" font-size="13.0" fill="#374151">Číslo bez porovnávacej základne nič nehovorí.</text>
<rect x="90.0" y="374.5" width="380" height="118.0" rx="12" fill="#ffffff" stroke="#28b065" stroke-width="2.5"/>
<rect x="90.0" y="374.5" width="7" height="118.0" rx="3.5" fill="#28b065"/>
<text x="107.0" y="401.5" font-size="14.5" font-weight="700" fill="#1a3868">3. Metódy FA: horizontálna analýza</text>
<text x="107.0" y="425.5" font-size="13.0" fill="#374151">Horizontálna analýza = vývoj položky v ČASE:</text>
<text x="107.0" y="442.0" font-size="13.0" fill="#374151">absolútna zmena (bežné − minulé v eur) a relatívna</text>
<text x="107.0" y="458.5" font-size="13.0" fill="#374151">zmena (absolútna/minulé × 100 v %). Odhaľuje trendy,</text>
<text x="107.0" y="475.0" font-size="13.0" fill="#374151">nie štruktúru.</text>
<rect x="90.0" y="512.5" width="380" height="118.0" rx="12" fill="#ffffff" stroke="#803594" stroke-width="2.5"/>
<rect x="90.0" y="512.5" width="7" height="118.0" rx="3.5" fill="#803594"/>
<text x="107.0" y="539.5" font-size="14.5" font-weight="700" fill="#1a3868">4. Metódy FA: vertikálna analýza</text>
<text x="107.0" y="563.5" font-size="13.0" fill="#374151">Vertikálna analýza = ŠTRUKTÚRA, podiel položky na</text>
<text x="107.0" y="580.0" font-size="13.0" fill="#374151">základni (súvaha = aktíva 100 %, výsledovka = tržby</text>
<text x="107.0" y="596.5" font-size="13.0" fill="#374151">100 %). Odolná voči veľkosti a inflácii, vhodná na</text>
<text x="107.0" y="613.0" font-size="13.0" fill="#374151">porovnanie firiem a odvetví.</text>
<rect x="810.0" y="70.0" width="380" height="118.0" rx="12" fill="#ffffff" stroke="#6a6eb3" stroke-width="2.5"/>
<rect x="810.0" y="70.0" width="7" height="118.0" rx="3.5" fill="#6a6eb3"/>
<text x="827.0" y="97.0" font-size="14.5" font-weight="700" fill="#1a3868">5. Metódy FA: pomerová a sústavová analýza</text>
<text x="827.0" y="121.0" font-size="13.0" fill="#374151">Pomerová analýza = pomer dvoch položiek</text>
<text x="827.0" y="137.5" font-size="13.0" fill="#374151">(rentabilita, likvidita, aktivita, zadlženosť; viď</text>
<text x="827.0" y="154.0" font-size="13.0" fill="#374151">II.4). Sústavy: pyramídy (DuPont rozklad ROE) a</text>
<text x="827.0" y="170.5" font-size="13.0" fill="#374151">modely (Altman, IN05) = skóre zdravia/úpadku.</text>
<rect x="810.0" y="208.0" width="380" height="137.0" rx="12" fill="#ffffff" stroke="#9a562a" stroke-width="2.5"/>
<rect x="810.0" y="208.0" width="7" height="137.0" rx="3.5" fill="#9a562a"/>
<text x="827.0" y="235.0" font-size="14.5" font-weight="700" fill="#1a3868">6. Analýza finančnej situácie z absolútnych</text>
<text x="827.0" y="254.0" font-size="14.5" font-weight="700" fill="#1a3868">ukazovateľov súvahy</text>
<text x="827.0" y="278.0" font-size="13.0" fill="#374151">Súvaha: majetková štruktúra (dlhodobý/obežný</text>
<text x="827.0" y="294.5" font-size="13.0" fill="#374151">majetok) a finančná štruktúra (vlastné vs. cudzie</text>
<text x="827.0" y="311.0" font-size="13.0" fill="#374151">zdroje). Kľúčový ukazovateľ ČPK = obežný majetok −</text>
<text x="827.0" y="327.5" font-size="13.0" fill="#374151">krátkodobé záväzky; kladný = stabilita.</text>
<rect x="810.0" y="365.0" width="380" height="137.0" rx="12" fill="#ffffff" stroke="#e6251e" stroke-width="2.5"/>
<rect x="810.0" y="365.0" width="7" height="137.0" rx="3.5" fill="#e6251e"/>
<text x="827.0" y="392.0" font-size="14.5" font-weight="700" fill="#1a3868">7. Analýza VH, nákladov a výnosov z</text>
<text x="827.0" y="411.0" font-size="14.5" font-weight="700" fill="#1a3868">absolútnych ukazovateľov výsledovky</text>
<text x="827.0" y="435.0" font-size="13.0" fill="#374151">Výsledovka: štruktúra výnosov a nákladov, stupne VH</text>
<text x="827.0" y="451.5" font-size="13.0" fill="#374151">(prevádzkový, finančný, EBT, po zdanení). Pre</text>
<text x="827.0" y="468.0" font-size="13.0" fill="#374151">porovnateľnosť EBIT (pred úrokmi a daňou) a EBITDA</text>
<text x="827.0" y="484.5" font-size="13.0" fill="#374151">(EBIT + odpisy).</text>
<rect x="810.0" y="522.0" width="380" height="137.0" rx="12" fill="#ffffff" stroke="#0e7490" stroke-width="2.5"/>
<rect x="810.0" y="522.0" width="7" height="137.0" rx="3.5" fill="#0e7490"/>
<text x="827.0" y="549.0" font-size="14.5" font-weight="700" fill="#1a3868">8. Ukazovatele nákladovosti, účinnosti a</text>
<text x="827.0" y="568.0" font-size="14.5" font-weight="700" fill="#1a3868">viazanosti</text>
<text x="827.0" y="592.0" font-size="13.0" fill="#374151">Nákladovosť = náklady/výnosy (nižšie lepšie; 1 −</text>
<text x="827.0" y="608.5" font-size="13.0" fill="#374151">nákladovosť = marža). Účinnosť = výnosy/náklady</text>
<text x="827.0" y="625.0" font-size="13.0" fill="#374151">(prevrátená, nad 1). Viazanosť aktív = aktíva/tržby</text>
<text x="827.0" y="641.5" font-size="13.0" fill="#374151">(prevrátená hodnota obratu aktív).</text>
</svg>