<path d="M 790.0 524.2 C 860.0 524.2, 740.0 593.2, 810.0 593.2" stroke="#0e7490" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 790.0 524.2 C 860.0 524.2, 740.0 790.2, 810.0 790.2" stroke="#b45309" stroke-width="2.5" fill="none" opacity="0.85"/>
<rect x="490.0" y="496.8" width="300" height="55.0" rx="15" fill="#1a3868"/>
<text x="640.0" y="529.8" font-size="18.0" font-weight="700" fill="#ffffff" text-anchor="middle">Zúčtovacie vzťahy</text>
<rect x="90.0" y="70.0" width="380" height="167.5" rx="12" fill="#ffffff" stroke="#00adbd" stroke-width="2.5"/>
<rect x="90.0" y="70.0" width="7" height="167.5" rx="3.5" fill="#00adbd"/>
<text x="107.0" y="97.0" font-size="14.5" font-weight="700" fill="#1a3868">1. Obsah a štruktúra účtovej triedy 3</text>
<text x="107.0" y="121.0" font-size="13.0" fill="#374151">Trieda 3 = most k okoliu: pohľadávky (31: 311, 314,</text>
<text x="107.0" y="137.5" font-size="13.0" fill="#374151">315), záväzky (32: 321, 323, 324, 326), zamestnanci</text>
<text x="107.0" y="154.0" font-size="13.0" fill="#374151">a poisťovne (33), dane a dotácie (34: 341, 342, 343,</text>
<text x="107.0" y="170.5" font-size="13.0" fill="#374151">346/347), spoločníci (35/36), iné (37), časové</text>
<text x="107.0" y="187.0" font-size="13.0" fill="#374151">rozlíšenie (38), OP k pohľadávkam (391). Pohľadávky</text>
<text x="107.0" y="203.5" font-size="13.0" fill="#374151">aktívne (MD), záväzky pasívne (D), analytika podľa</text>
<text x="107.0" y="220.0" font-size="13.0" fill="#374151">partnerov.</text>
<rect x="90.0" y="257.5" width="380" height="170.0" rx="12" fill="#ffffff" stroke="#f26539" stroke-width="2.5"/>
<rect x="90.0" y="257.5" width="7" height="170.0" rx="3.5" fill="#f26539"/>
<text x="107.0" y="284.5" font-size="14.5" font-weight="700" fill="#1a3868">2. Obchodné pohľadávky a záväzky (311, 321) a</text>
<text x="107.0" y="303.5" font-size="14.5" font-weight="700" fill="#1a3868">ich oceňovanie</text>
<text x="107.0" y="327.5" font-size="13.0" fill="#374151">Tá istá faktúra je u dodávateľa pohľadávka 311</text>
<text x="107.0" y="344.0" font-size="13.0" fill="#374151">(311/6xx, 311/343), u odberateľa záväzok 321 (5xx</text>
<text x="107.0" y="360.5" font-size="13.0" fill="#374151">alebo majetok/321, 343/321). Ocenenie menovitou</text>
<text x="107.0" y="377.0" font-size="13.0" fill="#374151">hodnotou pri vzniku (postúpené obstarávacou). Cudzia</text>
<text x="107.0" y="393.5" font-size="13.0" fill="#374151">mena ku dňu závierky kurzom ECB. Riziko cez OP</text>
<text x="107.0" y="410.0" font-size="13.0" fill="#374151">(547/391), trvalé nevymoženie odpisom 546.</text>
<rect x="90.0" y="447.5" width="380" height="170.0" rx="12" fill="#ffffff" stroke="#28b065" stroke-width="2.5"/>
<rect x="90.0" y="447.5" width="7" height="170.0" rx="3.5" fill="#28b065"/>
<text x="107.0" y="474.5" font-size="14.5" font-weight="700" fill="#1a3868">3. Mzda: tri sumy a ich zaúčtovanie (331,</text>
<text x="107.0" y="493.5" font-size="14.5" font-weight="700" fill="#1a3868">336, 342)</text>
<text x="107.0" y="517.5" font-size="13.0" fill="#374151">Tri sumy: HRUBÁ mzda = náklad 521/331. Z nej</text>
<text x="107.0" y="534.0" font-size="13.0" fill="#374151">zamestnancovi odvody (2026 sociálne 9,4 % +</text>
<text x="107.0" y="550.5" font-size="13.0" fill="#374151">zdravotné 5 % = 14,4 %) 331/336 a preddavok dane</text>
<text x="107.0" y="567.0" font-size="13.0" fill="#374151">331/342. Odvody zamestnávateľa (2026 sociálne 25,2 %</text>
<text x="107.0" y="583.5" font-size="13.0" fill="#374151">+ zdravotné 11 %) navyše 524/336. Čistá mzda</text>
<text x="107.0" y="600.0" font-size="13.0" fill="#374151">331/221. Cena práce = hrubá + odvody zamestnávateľa.</text>
<rect x="90.0" y="637.5" width="380" height="151.0" rx="12" fill="#ffffff" stroke="#803594" stroke-width="2.5"/>
<rect x="90.0" y="637.5" width="7" height="151.0" rx="3.5" fill="#803594"/>
<text x="107.0" y="664.5" font-size="14.5" font-weight="700" fill="#1a3868">4. Ďalšie mzdové účty: 333, 335, 366</text>
<text x="107.0" y="688.5" font-size="13.0" fill="#374151">Ďalšie účty: 333 ostatné záväzky voči zamestnancom</text>
<text x="107.0" y="705.0" font-size="13.0" fill="#374151">(cestovné: 333/211, 512/333), 335 pohľadávky voči</text>
<text x="107.0" y="721.5" font-size="13.0" fill="#374151">zamestnancom (preddavky 335/211, náhrada škody</text>
<text x="107.0" y="738.0" font-size="13.0" fill="#374151">335/648), 366 mzda spoločníka/konateľa (namiesto</text>
<text x="107.0" y="754.5" font-size="13.0" fill="#374151">331), 365 ostatné záväzky voči spoločníkom (podiel</text>
<text x="107.0" y="771.0" font-size="13.0" fill="#374151">na zisku, pôžička).</text>
<rect x="90.0" y="808.5" width="380" height="170.0" rx="12" fill="#ffffff" stroke="#6a6eb3" stroke-width="2.5"/>
<rect x="90.0" y="808.5" width="7" height="170.0" rx="3.5" fill="#6a6eb3"/>
<text x="107.0" y="835.5" font-size="14.5" font-weight="700" fill="#1a3868">5. Povinnosti zamestnávateľa pri vzniku</text>
<text x="107.0" y="854.5" font-size="14.5" font-weight="700" fill="#1a3868">pracovného pomeru</text>
<text x="107.0" y="878.5" font-size="13.0" fill="#374151">Pred vznikom pracovného pomeru písomná zmluva (§</text>
<text x="107.0" y="895.0" font-size="13.0" fill="#374151">42-43). Registrácia: do SP pred vznikom poistenia</text>
<text x="107.0" y="911.5" font-size="13.0" fill="#374151">(najneskôr deň pred výkonom, RLFO), do ZP do 8</text>
<text x="107.0" y="928.0" font-size="13.0" fill="#374151">pracovných dní od nástupu. Sám zamestnávateľ do SP</text>
<text x="107.0" y="944.5" font-size="13.0" fill="#374151">do 8 dní od prvého zamestnanca. Vznikajú vzťahy 331,</text>
<text x="107.0" y="961.0" font-size="13.0" fill="#374151">336, 342.</text>
<rect x="810.0" y="156.8" width="380" height="151.0" rx="12" fill="#ffffff" stroke="#9a562a" stroke-width="2.5"/>
<rect x="810.0" y="156.8" width="7" height="151.0" rx="3.5" fill="#9a562a"/>
<text x="827.0" y="183.8" font-size="14.5" font-weight="700" fill="#1a3868">6. Povinnosti pri zániku pracovného pomeru</text>
<text x="827.0" y="207.8" font-size="13.0" fill="#374151">Pri skončení: vyúčtovať mzdu a náhrady (aj</text>
<text x="827.0" y="224.2" font-size="13.0" fill="#374151">nevyčerpanú dovolenku), prípadne odstupné/odchodné,</text>
<text x="827.0" y="240.8" font-size="13.0" fill="#374151">vydať zápočtový list. Odhlásenie: zo SP deň po</text>
<text x="827.0" y="257.2" font-size="13.0" fill="#374151">zániku poistenia, zo ZP do 8 pracovných dní.</text>
<text x="827.0" y="273.8" font-size="13.0" fill="#374151">Spôsoby: dohoda (§ 60), výpoveď (§ 61-62), okamžité</text>
<text x="827.0" y="290.2" font-size="13.0" fill="#374151">(§ 68-69), skúšobná doba (§ 72).</text>
<rect x="810.0" y="327.8" width="380" height="170.0" rx="12" fill="#ffffff" stroke="#e6251e" stroke-width="2.5"/>
<rect x="810.0" y="327.8" width="7" height="170.0" rx="3.5" fill="#e6251e"/>
<text x="827.0" y="354.8" font-size="14.5" font-weight="700" fill="#1a3868">7. Špecifiká dohôd o prácach mimo pracovného</text>
<text x="827.0" y="373.8" font-size="14.5" font-weight="700" fill="#1a3868">pomeru (§ 223–228a)</text>
<text x="827.0" y="397.8" font-size="13.0" fill="#374151">Tri dohody (§ 223-228a): DoVP (§ 226) podľa</text>
<text x="827.0" y="414.2" font-size="13.0" fill="#374151">výsledku, max 350 h/rok; DoPČ (§ 228a) podľa druhu,</text>
<text x="827.0" y="430.8" font-size="13.0" fill="#374151">max 10 h/týž (sezónna 520 h/rok); DoBPŠ (§ 227)</text>
<text x="827.0" y="447.2" font-size="13.0" fill="#374151">študent do 26 r., max 20 h/týž. Bežná dohoda</text>
<text x="827.0" y="463.8" font-size="13.0" fill="#374151">podlieha soc. aj zdrav. poisteniu; študent odvodová</text>
<text x="827.0" y="480.2" font-size="13.0" fill="#374151">OP a bez zdravotných. Účtovanie ako mzda (521/331).</text>
<rect x="810.0" y="517.8" width="380" height="151.0" rx="12" fill="#ffffff" stroke="#0e7490" stroke-width="2.5"/>
<rect x="810.0" y="517.8" width="7" height="151.0" rx="3.5" fill="#0e7490"/>
<text x="827.0" y="544.8" font-size="14.5" font-weight="700" fill="#1a3868">8. Náhrada príjmu pri PN a ošetrovné (OČR)</text>
<text x="827.0" y="568.8" font-size="13.0" fill="#374151">PN: prvé obdobie hradí zamestnávateľ náhradou príjmu</text>
<text x="827.0" y="585.2" font-size="13.0" fill="#374151">(527/331), potom SP nemocenské. Od 1. 1. 2026</text>
<text x="827.0" y="601.8" font-size="13.0" fill="#374151">zamestnávateľ 14 dní (1.-3. = 25 % DVZ, 4.-14. = 55</text>
<text x="827.0" y="618.2" font-size="13.0" fill="#374151">% DVZ), SP od 15. dňa (2025: 10 dní, SP od 11.). OČR</text>
<text x="827.0" y="634.8" font-size="13.0" fill="#374151">55 % DVZ, krátkodobé max 14 dní. DVZ = VZ za</text>
<text x="827.0" y="651.2" font-size="13.0" fill="#374151">rozhodujúce obdobie / počet dní.</text>
<rect x="810.0" y="688.8" width="380" height="203.0" rx="12" fill="#ffffff" stroke="#b45309" stroke-width="2.5"/>
<rect x="810.0" y="688.8" width="7" height="203.0" rx="3.5" fill="#b45309"/>
<text x="827.0" y="715.8" font-size="14.5" font-weight="700" fill="#1a3868">9. Náhrada mzdy za dovolenku, odstupné a</text>
<text x="827.0" y="734.8" font-size="14.5" font-weight="700" fill="#1a3868">odchodné</text>
<text x="827.0" y="758.8" font-size="13.0" fill="#374151">Dovolenka min. 4 týždne, 5 týždňov od 33 r. (alebo</text>
<text x="827.0" y="775.2" font-size="13.0" fill="#374151">starostlivosť o dieťa), 8 týždňov pedagógovia;</text>
<text x="827.0" y="791.8" font-size="13.0" fill="#374151">náhrada 100 % priemeru (521/331). Odstupné (§ 76)</text>
<text x="827.0" y="808.2" font-size="13.0" fill="#374151">pri organizačných dôvodoch/nadbytočnosti/strate</text>
<text x="827.0" y="824.8" font-size="13.0" fill="#374151">spôsobilosti, graduované (výpoveď 1-4x, dohoda +1</text>
<text x="827.0" y="841.2" font-size="13.0" fill="#374151">stupeň, úraz min. 10x). Odchodné (§ 76a) pri prvom</text>
<text x="827.0" y="857.8" font-size="13.0" fill="#374151">odchode do dôchodku min. 1x priemer. Účtovanie</text>
<text x="827.0" y="874.2" font-size="13.0" fill="#374151">527/331, výplata 331/221.</text>
</svg>