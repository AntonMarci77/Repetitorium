<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1018" font-family="Segoe UI, Roboto, Arial, sans-serif">
<rect x="0" y="0" width="1280" height="1018" fill="#f7f6f3"/>
<text x="32" y="40" font-size="19" font-weight="700" fill="#1a3868">Mentálna mapa</text>
<text x="32" y="59" font-size="12.5" fill="#6b7280">BC I 06 · esencia odpovede k bodom tézy</text>
<path d="M 490.0 524.2 C 420.0 524.2, 540.0 153.8, 470.0 153.8" stroke="#00adbd" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 490.0 524.2 C 420.0 524.2, 540.0 342.5, 470.0 342.5" stroke="#f26539" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 490.0 524.2 C 420.0 524.2, 540.0 532.5, 470.0 532.5" stroke="#28b065" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 490.0 524.2 C 420.0 524.2, 540.0 713.0, 470.0 713.0" stroke="#803594" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 490.0 524.2 C 420.0 524.2, 540.0 893.5, 470.0 893.5" stroke="#6a6eb3" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 790.0 524.2 C 860.0 524.2, 740.0 232.2, 810.0 232.2" stroke="#9a562a" stroke-width="2.5" fill="none" opacity="0.85"/>
