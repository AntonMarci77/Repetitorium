<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 718" font-family="Segoe UI, Roboto, Arial, sans-serif">
<rect x="0" y="0" width="1280" height="718" fill="#f7f6f3"/>
<text x="32" y="40" font-size="19" font-weight="700" fill="#1a3868">Mentálna mapa</text>
<text x="32" y="59" font-size="12.5" fill="#6b7280">ING II 06 · esencia odpovede k bodom tézy</text>
<path d="M 490.0 374.0 C 420.0 374.0, 540.0 138.5, 470.0 138.5" stroke="#00adbd" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 490.0 374.0 C 420.0 374.0, 540.0 295.5, 470.0 295.5" stroke="#f26539" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 490.0 374.0 C 420.0 374.0, 540.0 452.5, 470.0 452.5" stroke="#28b065" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 490.0 374.0 C 420.0 374.0, 540.0 609.5, 470.0 609.5" stroke="#803594" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 790.0 374.0 C 860.0 374.0, 740.0 148.0, 810.0 148.0" stroke="#6a6eb3" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 790.0 374.0 C 860.0 374.0, 740.0 313.2, 810.0 313.2" stroke="#9a562a" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 790.0 374.0 C 860.0 374.0, 740.0 460.8, 810.0 460.8" stroke="#e6251e" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 790.0 374.0 C 860.0 374.0, 740.0 608.2, 810.0 608.2" stroke="#0e7490" stroke-width="2.5" fill="none" opacity="0.85"/>
<rect x="490.0" y="312.0" width="300" height="124.0" rx="15" fill="#1a3868"/>
<text x="640.0" y="345.0" font-size="18.0" font-weight="700" fill="#ffffff" text-anchor="middle">Postup audítora v</text>
<text x="640.0" y="368.0" font-size="18.0" font-weight="700" fill="#ffffff" text-anchor="middle">oblasti dlhodobého</text>
<text x="640.0" y="391.0" font-size="18.0" font-weight="700" fill="#ffffff" text-anchor="middle">nehmotného a hmotného</text>
<text x="640.0" y="414.0" font-size="18.0" font-weight="700" fill="#ffffff" text-anchor="middle">majetku a zásob</text>
<rect x="90.0" y="70.0" width="380" height="137.0" rx="12" fill="#ffffff" stroke="#00adbd" stroke-width="2.5"/>
<rect x="90.0" y="70.0" width="7" height="137.0" rx="3.5" fill="#00adbd"/>
<text x="107.0" y="97.0" font-size="14.5" font-weight="700" fill="#1a3868">1. Rizikovo orientovaný rámec a tvrdenia (ISA</text>
<text x="107.0" y="116.0" font-size="14.5" font-weight="700" fill="#1a3868">315, 330)</text>
<text x="107.0" y="140.0" font-size="13.0" fill="#374151">Postup štruktúrovať podľa tvrdení (ISA 315):</text>
<text x="107.0" y="156.5" font-size="13.0" fill="#374151">existencia, úplnosť, ocenenie, práva/záväzky,</text>
<text x="107.0" y="173.0" font-size="13.0" fill="#374151">cut-off, prezentácia. Najprv riziko, potom reakcia</text>
<text x="107.0" y="189.5" font-size="13.0" fill="#374151">(ISA 330): testy kontrol + vždy substantívne.</text>
<rect x="90.0" y="227.0" width="380" height="137.0" rx="12" fill="#ffffff" stroke="#f26539" stroke-width="2.5"/>
<rect x="90.0" y="227.0" width="7" height="137.0" rx="3.5" fill="#f26539"/>
<text x="107.0" y="254.0" font-size="14.5" font-weight="700" fill="#1a3868">2. DNM a DHM – existencia a práva</text>
<text x="107.0" y="273.0" font-size="14.5" font-weight="700" fill="#1a3868">(vlastníctvo)</text>
<text x="107.0" y="297.0" font-size="13.0" fill="#374151">DNM/DHM existencia (nadhodnotenie): vzorka z</text>
<text x="107.0" y="313.5" font-size="13.0" fill="#374151">registra → fyzická obhliadka (od záznamu k realite).</text>
<text x="107.0" y="330.0" font-size="13.0" fill="#374151">Práva: listy vlastníctva, zmluvy, technické</text>
<text x="107.0" y="346.5" font-size="13.0" fill="#374151">preukazy; pozor na leasing a záloh.</text>
<rect x="90.0" y="384.0" width="380" height="137.0" rx="12" fill="#ffffff" stroke="#28b065" stroke-width="2.5"/>
<rect x="90.0" y="384.0" width="7" height="137.0" rx="3.5" fill="#28b065"/>
<text x="107.0" y="411.0" font-size="14.5" font-weight="700" fill="#1a3868">3. DNM a DHM – ocenenie a alokácia (odpisy,</text>
<text x="107.0" y="430.0" font-size="14.5" font-weight="700" fill="#1a3868">zníženie hodnoty)</text>
<text x="107.0" y="454.0" font-size="13.0" fill="#374151">Ocenenie je najnáročnejšie: obstarávacia cena</text>
<text x="107.0" y="470.5" font-size="13.0" fill="#374151">(technické zhodnotenie vs. oprava), odpisový plán a</text>
<text x="107.0" y="487.0" font-size="13.0" fill="#374151">prepočet odpisov, najmä indikátory impairmentu a</text>
<text x="107.0" y="503.5" font-size="13.0" fill="#374151">opravná položka. Odhad - ISA 540.</text>
<rect x="90.0" y="541.0" width="380" height="137.0" rx="12" fill="#ffffff" stroke="#803594" stroke-width="2.5"/>
<rect x="90.0" y="541.0" width="7" height="137.0" rx="3.5" fill="#803594"/>
<text x="107.0" y="568.0" font-size="14.5" font-weight="700" fill="#1a3868">4. DNM a DHM – úplnosť, obstaranie a</text>
<text x="107.0" y="587.0" font-size="14.5" font-weight="700" fill="#1a3868">vyradenie</text>
<text x="107.0" y="611.0" font-size="13.0" fill="#374151">Úplnosť (podhodnotenie) opačným smerom - od dokladu</text>
<text x="107.0" y="627.5" font-size="13.0" fill="#374151">k záznamu (či sa oprava nemala aktivovať). Pri</text>
<text x="107.0" y="644.0" font-size="13.0" fill="#374151">vyradení správne zaúčtovanie zostatkovej ceny a</text>
<text x="107.0" y="660.5" font-size="13.0" fill="#374151">cut-off. Analytika: vývoj odpisov a úbytkov.</text>
<rect x="810.0" y="71.2" width="380" height="153.5" rx="12" fill="#ffffff" stroke="#6a6eb3" stroke-width="2.5"/>
<rect x="810.0" y="71.2" width="7" height="153.5" rx="3.5" fill="#6a6eb3"/>
<text x="827.0" y="98.2" font-size="14.5" font-weight="700" fill="#1a3868">5. Zásoby – účasť audítora na inventúre (ISA</text>
<text x="827.0" y="117.2" font-size="14.5" font-weight="700" fill="#1a3868">501)</text>
<text x="827.0" y="141.2" font-size="13.0" fill="#374151">ISA 501: pri významných zásobách povinná účasť na</text>
<text x="827.0" y="157.8" font-size="13.0" fill="#374151">inventúre - pozorovať, testovacie počty OBOJSMERNE</text>
<text x="827.0" y="174.2" font-size="13.0" fill="#374151">(existencia aj úplnosť), cut-off. Inak</text>
<text x="827.0" y="190.8" font-size="13.0" fill="#374151">alternatívy/obmedzenie rozsahu; tretia strana → ISA</text>
<text x="827.0" y="207.2" font-size="13.0" fill="#374151">505.</text>
<rect x="810.0" y="244.8" width="380" height="137.0" rx="12" fill="#ffffff" stroke="#9a562a" stroke-width="2.5"/>
<rect x="810.0" y="244.8" width="7" height="137.0" rx="3.5" fill="#9a562a"/>
<text x="827.0" y="271.8" font-size="14.5" font-weight="700" fill="#1a3868">6. Zásoby – ocenenie (nižšia z OC a NRV),</text>
<text x="827.0" y="290.8" font-size="14.5" font-weight="700" fill="#1a3868">zastarané zásoby</text>
<text x="827.0" y="314.8" font-size="13.0" fill="#374151">Zásoby = nižšia z obstarávacej ceny a NRV (predajná</text>
<text x="827.0" y="331.2" font-size="13.0" fill="#374151">cena mínus náklady na dokončenie a predaj).</text>
<text x="827.0" y="347.8" font-size="13.0" fill="#374151">Najrizikovejšie tvrdenie. Posúdiť OP k zastaraným</text>
<text x="827.0" y="364.2" font-size="13.0" fill="#374151">zásobám (veková štruktúra, obrátka).</text>
<rect x="810.0" y="401.8" width="380" height="118.0" rx="12" fill="#ffffff" stroke="#e6251e" stroke-width="2.5"/>
<rect x="810.0" y="401.8" width="7" height="118.0" rx="3.5" fill="#e6251e"/>
<text x="827.0" y="428.8" font-size="14.5" font-weight="700" fill="#1a3868">7. Zásoby – cut-off, úplnosť a prezentácia</text>
<text x="827.0" y="452.8" font-size="13.0" fill="#374151">Cut-off na prelome roka: spárovať posledné</text>
<text x="827.0" y="469.2" font-size="13.0" fill="#374151">príjemky/výdajky s nákupmi, predajmi, záväzkami</text>
<text x="827.0" y="485.8" font-size="13.0" fill="#374151">(tovar na ceste). Úplnosť: zahrnúť konsignáciu,</text>
<text x="827.0" y="502.2" font-size="13.0" fill="#374151">vylúčiť cudzí komisionálny tovar (väzba na práva).</text>
<rect x="810.0" y="539.8" width="380" height="137.0" rx="12" fill="#ffffff" stroke="#0e7490" stroke-width="2.5"/>
<rect x="810.0" y="539.8" width="7" height="137.0" rx="3.5" fill="#0e7490"/>
<text x="827.0" y="566.8" font-size="14.5" font-weight="700" fill="#1a3868">8. Výsledky auditu – typické zistenia a ich</text>
<text x="827.0" y="585.8" font-size="14.5" font-weight="700" fill="#1a3868">dôsledok</text>
<text x="827.0" y="609.8" font-size="13.0" fill="#374151">Zistenia vyhodnotiť podľa ISA 450 voči významnosti.</text>
<text x="827.0" y="626.2" font-size="13.0" fill="#374151">Typické: fiktívny majetok, chýbajúci impairment,</text>
<text x="827.0" y="642.8" font-size="13.0" fill="#374151">ocenenie nad NRV, cut-off, cudzí tovar. Významné a</text>
<text x="827.0" y="659.2" font-size="13.0" fill="#374151">neopravené → modifikácia názoru.</text>
</svg>