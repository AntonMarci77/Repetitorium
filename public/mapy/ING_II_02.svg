<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 680" font-family="Segoe UI, Roboto, Arial, sans-serif">
<rect x="0" y="0" width="1280" height="680" fill="#f7f6f3"/>
<text x="32" y="40" font-size="19" font-weight="700" fill="#1a3868">Mentálna mapa</text>
<text x="32" y="59" font-size="12.5" fill="#6b7280">ING II 02 · esencia odpovede k bodom tézy</text>
<path d="M 490.0 355.0 C 420.0 355.0, 540.0 146.8, 470.0 146.8" stroke="#00adbd" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 490.0 355.0 C 420.0 355.0, 540.0 286.0, 470.0 286.0" stroke="#f26539" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 490.0 355.0 C 420.0 355.0, 540.0 415.8, 470.0 415.8" stroke="#28b065" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 490.0 355.0 C 420.0 355.0, 540.0 563.2, 470.0 563.2" stroke="#803594" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 790.0 355.0 C 860.0 355.0, 740.0 129.0, 810.0 129.0" stroke="#6a6eb3" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 790.0 355.0 C 860.0 355.0, 740.0 276.5, 810.0 276.5" stroke="#9a562a" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 790.0 355.0 C 860.0 355.0, 740.0 433.5, 810.0 433.5" stroke="#e6251e" stroke-width="2.5" fill="none" opacity="0.85"/>
<path d="M 790.0 355.0 C 860.0 355.0, 740.0 581.0, 810.0 581.0" stroke="#0e7490" stroke-width="2.5" fill="none" opacity="0.85"/>
<rect x="490.0" y="281.5" width="300" height="147.0" rx="15" fill="#1a3868"/>
<text x="640.0" y="314.5" font-size="18.0" font-weight="700" fill="#ffffff" text-anchor="middle">Plánovanie auditu,</text>
<text x="640.0" y="337.5" font-size="18.0" font-weight="700" fill="#ffffff" text-anchor="middle">identifikácia rizík a</text>
<text x="640.0" y="360.5" font-size="18.0" font-weight="700" fill="#ffffff" text-anchor="middle">vnútorný kontrolný</text>
<text x="640.0" y="383.5" font-size="18.0" font-weight="700" fill="#ffffff" text-anchor="middle">systém pri audite</text>
<text x="640.0" y="406.5" font-size="18.0" font-weight="700" fill="#ffffff" text-anchor="middle">účtovnej závierky</text>
<rect x="90.0" y="78.2" width="380" height="137.0" rx="12" fill="#ffffff" stroke="#00adbd" stroke-width="2.5"/>
<rect x="90.0" y="78.2" width="7" height="137.0" rx="3.5" fill="#00adbd"/>
<text x="107.0" y="105.2" font-size="14.5" font-weight="700" fill="#1a3868">1. Akceptácia zákazky a posúdenie rizika</text>
<text x="107.0" y="124.2" font-size="14.5" font-weight="700" fill="#1a3868">zákazky</text>
<text x="107.0" y="148.2" font-size="13.0" fill="#374151">Pred plánovaním rozhodnutie prijať zákazku: riziko</text>
<text x="107.0" y="164.8" font-size="13.0" fill="#374151">zákazky (integrita, nezávislosť, kapacity),</text>
<text x="107.0" y="181.2" font-size="13.0" fill="#374151">komunikácia s predch. audítorom, zmluva (ISA 210).</text>
<text x="107.0" y="197.8" font-size="13.0" fill="#374151">Akceptácia = prvá línia riadenia rizika.</text>
<rect x="90.0" y="235.2" width="380" height="101.5" rx="12" fill="#ffffff" stroke="#f26539" stroke-width="2.5"/>
<rect x="90.0" y="235.2" width="7" height="101.5" rx="3.5" fill="#f26539"/>
<text x="107.0" y="262.2" font-size="14.5" font-weight="700" fill="#1a3868">2. Plánovanie auditu podľa ISA 300 – význam</text>
<text x="107.0" y="286.2" font-size="13.0" fill="#374151">ISA 300: stratégia + plán tak, aby AR klesol na</text>
<text x="107.0" y="302.8" font-size="13.0" fill="#374151">prijateľne nízku úroveň. Plánovanie je priebežné a</text>
<text x="107.0" y="319.2" font-size="13.0" fill="#374151">iteratívne; zvyšuje účinnosť aj efektívnosť.</text>
<rect x="90.0" y="356.8" width="380" height="118.0" rx="12" fill="#ffffff" stroke="#28b065" stroke-width="2.5"/>
<rect x="90.0" y="356.8" width="7" height="118.0" rx="3.5" fill="#28b065"/>
<text x="107.0" y="383.8" font-size="14.5" font-weight="700" fill="#1a3868">3. Stratégia, plán a program auditu (obsah)</text>
<text x="107.0" y="407.8" font-size="13.0" fill="#374151">Stratégia (rozsah, načasovanie, smerovanie) → plán</text>
<text x="107.0" y="424.2" font-size="13.0" fill="#374151">(charakter/rozsah postupov 315 a 330) → program</text>
<text x="107.0" y="440.8" font-size="13.0" fill="#374151">(konkrétne kroky pre účty). Od všeobecného k</text>
<text x="107.0" y="457.2" font-size="13.0" fill="#374151">detailnému.</text>
<rect x="90.0" y="494.8" width="380" height="137.0" rx="12" fill="#ffffff" stroke="#803594" stroke-width="2.5"/>
<rect x="90.0" y="494.8" width="7" height="137.0" rx="3.5" fill="#803594"/>
<text x="107.0" y="521.8" font-size="14.5" font-weight="700" fill="#1a3868">4. Identifikácia rizík podľa ISA 315 a riziko</text>
<text x="107.0" y="540.8" font-size="14.5" font-weight="700" fill="#1a3868">významnej nesprávnosti</text>
<text x="107.0" y="564.8" font-size="13.0" fill="#374151">ISA 315: identifikovať RMM (= IR × CR) na úrovni ÚZ</text>
<text x="107.0" y="581.2" font-size="13.0" fill="#374151">celku (pervazívne) aj tvrdení. IR na spektre</text>
<text x="107.0" y="597.8" font-size="13.0" fill="#374151">(zložitosť, subjektívnosť, zmena, neistota,</text>
<text x="107.0" y="614.2" font-size="13.0" fill="#374151">zaujatosť); vyčlenia sa významné riziká.</text>
<rect x="810.0" y="70.0" width="380" height="118.0" rx="12" fill="#ffffff" stroke="#6a6eb3" stroke-width="2.5"/>
<rect x="810.0" y="70.0" width="7" height="118.0" rx="3.5" fill="#6a6eb3"/>
<text x="827.0" y="97.0" font-size="14.5" font-weight="700" fill="#1a3868">5. Tvrdenia (assertions) v účtovnej závierke</text>
<text x="827.0" y="121.0" font-size="13.0" fill="#374151">Tvrdenia = vyhlásenia manažmentu (existencia,</text>
<text x="827.0" y="137.5" font-size="13.0" fill="#374151">úplnosť, ocenenie, práva/záväzky, cut-off,</text>
<text x="827.0" y="154.0" font-size="13.0" fill="#374151">prezentácia). Slúžia na zacielenie rizík a testov na</text>
<text x="827.0" y="170.5" font-size="13.0" fill="#374151">konkrétne tvrdenie.</text>
<rect x="810.0" y="208.0" width="380" height="137.0" rx="12" fill="#ffffff" stroke="#9a562a" stroke-width="2.5"/>
<rect x="810.0" y="208.0" width="7" height="137.0" rx="3.5" fill="#9a562a"/>
<text x="827.0" y="235.0" font-size="14.5" font-weight="700" fill="#1a3868">6. Vnútorný kontrolný systém – podstata a 5</text>
<text x="827.0" y="254.0" font-size="14.5" font-weight="700" fill="#1a3868">komponentov COSO</text>
<text x="827.0" y="278.0" font-size="13.0" fill="#374151">VKS = proces na primeranú (nie absolútnu) istotu; 5</text>
<text x="827.0" y="294.5" font-size="13.0" fill="#374151">komponentov COSO: prostredie, posúdenie rizík ÚJ,</text>
<text x="827.0" y="311.0" font-size="13.0" fill="#374151">kontrolné činnosti, informácie/komunikácia,</text>
<text x="827.0" y="327.5" font-size="13.0" fill="#374151">monitorovanie. Lepší VKS → nižšie CR.</text>
<rect x="810.0" y="365.0" width="380" height="137.0" rx="12" fill="#ffffff" stroke="#e6251e" stroke-width="2.5"/>
<rect x="810.0" y="365.0" width="7" height="137.0" rx="3.5" fill="#e6251e"/>
<text x="827.0" y="392.0" font-size="14.5" font-weight="700" fill="#1a3868">7. Testovanie vnútorného kontrolného systému</text>
<text x="827.0" y="411.0" font-size="14.5" font-weight="700" fill="#1a3868">(testy kontrol)</text>
<text x="827.0" y="435.0" font-size="13.0" fill="#374151">Najprv návrh a implementácia (walk-through). Pri</text>
<text x="827.0" y="451.5" font-size="13.0" fill="#374151">spoľahnutí otestovať prevádzkovú účinnosť (dopyt,</text>
<text x="827.0" y="468.0" font-size="13.0" fill="#374151">pozorovanie, inšpekcia, re-performance). Zlyhanie</text>
<text x="827.0" y="484.5" font-size="13.0" fill="#374151">kontrol → posilniť substantívne postupy.</text>
<rect x="810.0" y="522.0" width="380" height="118.0" rx="12" fill="#ffffff" stroke="#0e7490" stroke-width="2.5"/>
<rect x="810.0" y="522.0" width="7" height="118.0" rx="3.5" fill="#0e7490"/>
<text x="827.0" y="549.0" font-size="14.5" font-weight="700" fill="#1a3868">8. Reakcia audítora na riziká podľa ISA 330</text>
<text x="827.0" y="573.0" font-size="13.0" fill="#374151">ISA 330: celkové reakcie na úrovni ÚZ (skepticizmus,</text>
<text x="827.0" y="589.5" font-size="13.0" fill="#374151">skúsenejší tím, dohľad, nepredvídateľnosť) + postupy</text>
<text x="827.0" y="606.0" font-size="13.0" fill="#374151">na úrovni tvrdení. Vysoké RMM → nízke DR →</text>
<text x="827.0" y="622.5" font-size="13.0" fill="#374151">viac/kvalitnejších dôkazov.</text>
</svg>