<svg viewBox="0 0 920 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="920" height="560" fill="#ffffff"/>
  <text x="460" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a2b4a">Opačný smer hlavného rizika: pohľadávky vs. záväzky</text>
  <text x="460" y="64" text-anchor="middle" font-size="14" fill="#5a6b85">Postup audítora (téza ING II.7) — priradenie kľúčových postupov k tvrdeniam</text>

  <!-- POHLADAVKY panel -->
  <rect x="30" y="90" width="400" height="430" rx="14" fill="#eef5ff" stroke="#2f6fb0" stroke-width="2"/>
  <text x="230" y="124" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a4a7a">POHĽADÁVKY a VÝNOSY</text>

  <rect x="60" y="142" width="340" height="50" rx="10" fill="#2f6fb0"/>
  <text x="230" y="166" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">Riziko: NADHODNOTENIE</text>
  <text x="230" y="184" text-anchor="middle" font-size="12" fill="#dce9f7">manažment chce vyššie aktíva a tržby</text>

  <text x="60" y="222" font-size="14" font-weight="bold" fill="#1a4a7a">Ťažiskové tvrdenia:</text>
  <text x="60" y="244" font-size="13" fill="#22364f">• EXISTENCIA — sú pohľadávky reálne?</text>
  <text x="60" y="266" font-size="13" fill="#22364f">• OCENENIE / vymožiteľnosť</text>
  <text x="60" y="288" font-size="13" fill="#22364f">• CUT-OFF tržieb (správne obdobie)</text>

  <text x="60" y="324" font-size="14" font-weight="bold" fill="#1a4a7a">Kľúčové postupy:</text>
  <text x="60" y="346" font-size="13" fill="#22364f">→ Externé potvrdenia (ISA 505)</text>
  <text x="78" y="364" font-size="12" fill="#5a6b85">pozitívne (veľké saldá) / negatívne (malé)</text>
  <text x="60" y="386" font-size="13" fill="#22364f">→ Veková štruktúra + opravné položky</text>
  <text x="60" y="408" font-size="13" fill="#22364f">→ Následné inkaso (ISA 560)</text>
  <text x="60" y="430" font-size="13" fill="#22364f">→ Cut-off tržieb (dodací list vs. zaúčt.)</text>
  <text x="60" y="452" font-size="13" fill="#22364f">→ Analytika: doba inkasa, obrátkovosť</text>

  <rect x="60" y="470" width="340" height="38" rx="8" fill="#d7e7f7"/>
  <text x="230" y="494" text-anchor="middle" font-size="12" fill="#1a4a7a">Smer testu: OD záznamu → k tretej strane</text>

  <!-- ZAVAZKY panel -->
  <rect x="490" y="90" width="400" height="430" rx="14" fill="#fdeeea" stroke="#c0532f" stroke-width="2"/>
  <text x="690" y="124" text-anchor="middle" font-size="20" font-weight="bold" fill="#8a3318">ZÁVÄZKY a NÁKLADY</text>

  <rect x="520" y="142" width="340" height="50" rx="10" fill="#c0532f"/>
  <text x="690" y="166" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">Riziko: PODHODNOTENIE</text>
  <text x="690" y="184" text-anchor="middle" font-size="12" fill="#f7ddd3">manažment chce vyšší zisk a nižší dlh</text>

  <text x="520" y="222" font-size="14" font-weight="bold" fill="#8a3318">Ťažiskové tvrdenie:</text>
  <text x="520" y="244" font-size="13" fill="#3f2418">• ÚPLNOSŤ — sú zaúčtované VŠETKY?</text>
  <text x="520" y="266" font-size="13" fill="#3f2418">• existencia a ocenenie (doplnkovo)</text>
  <text x="520" y="288" font-size="13" fill="#3f2418">• CUT-OFF nákupov (správne obdobie)</text>

  <text x="520" y="324" font-size="14" font-weight="bold" fill="#8a3318">Kľúčové postupy:</text>
  <text x="520" y="346" font-size="13" fill="#3f2418">→ Vyhľadávanie nezaúčtovaných záväzkov</text>
  <text x="520" y="368" font-size="13" fill="#3f2418">→ Test následných platieb</text>
  <text x="538" y="386" font-size="12" fill="#7a4a38">(subsequent disbursements)</text>
  <text x="520" y="408" font-size="13" fill="#3f2418">→ Odsúhlasenie na dodávateľské výpisy</text>
  <text x="520" y="430" font-size="13" fill="#3f2418">→ Dohadné položky, cut-off nákupov</text>
  <text x="520" y="452" font-size="13" fill="#3f2418">→ Pozor na NULOVÉ saldá u dodávateľov</text>

  <rect x="520" y="470" width="340" height="38" rx="8" fill="#f7d8cd"/>
  <text x="690" y="494" text-anchor="middle" font-size="12" fill="#8a3318">Smer testu: ZVONKA → dnu (čo CHÝBA?)</text>

  <!-- center arrows -->
  <text x="460" y="300" text-anchor="middle" font-size="34" font-weight="bold" fill="#9aa7bb">vs.</text>
</svg>
