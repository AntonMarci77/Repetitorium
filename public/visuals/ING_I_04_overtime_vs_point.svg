<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="820" height="600" fill="#ffffff"/>
  <text x="410" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a3c6e">Over time vs. point in time – rozhodovací strom (krok 5)</text>

  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#444"/>
    </marker>
  </defs>

  <!-- Start -->
  <rect x="285" y="56" width="250" height="56" rx="8" fill="#1a3c6e" stroke="#0d2549" stroke-width="2"/>
  <text x="410" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Povinnosť plnenia zmluvy</text>
  <text x="410" y="98" text-anchor="middle" font-size="11.5" fill="#cfe0f5">Kedy prechádza kontrola na zákazníka?</text>

  <!-- Q1 -->
  <line x1="410" y1="112" x2="410" y2="138" stroke="#444" stroke-width="2" marker-end="url(#a2)"/>
  <polygon points="410,140 600,185 410,230 220,185" fill="#eef3fa" stroke="#1a3c6e" stroke-width="2"/>
  <text x="410" y="178" text-anchor="middle" font-size="11.5" fill="#222">a) Zákazník súbežne prijíma</text>
  <text x="410" y="194" text-anchor="middle" font-size="11.5" fill="#222">a spotrebúva úžitky z plnenia?</text>

  <!-- Q2 -->
  <line x1="410" y1="230" x2="410" y2="256" stroke="#444" stroke-width="2" marker-end="url(#a2)"/>
  <text x="425" y="248" font-size="11" fill="#b5651d">NIE</text>
  <polygon points="410,258 600,303 410,348 220,303" fill="#eef3fa" stroke="#1a3c6e" stroke-width="2"/>
  <text x="410" y="296" text-anchor="middle" font-size="11.5" fill="#222">b) Aktívum kontrolované</text>
  <text x="410" y="312" text-anchor="middle" font-size="11.5" fill="#222">zákazníkom počas tvorby?</text>

  <!-- Q3 -->
  <line x1="410" y1="348" x2="410" y2="374" stroke="#444" stroke-width="2" marker-end="url(#a2)"/>
  <text x="425" y="366" font-size="11" fill="#b5651d">NIE</text>
  <polygon points="410,376 620,426 410,476 200,426" fill="#eef3fa" stroke="#1a3c6e" stroke-width="2"/>
  <text x="410" y="414" text-anchor="middle" font-size="11.5" fill="#222">c) Bez alternatívneho použitia</text>
  <text x="410" y="430" text-anchor="middle" font-size="11.5" fill="#222">a vymožiteľné právo na platbu</text>
  <text x="410" y="446" text-anchor="middle" font-size="11.5" fill="#222">za doterajšie plnenie?</text>

  <!-- YES branch to over time -->
  <path d="M220,185 L90,185 L90,512" fill="none" stroke="#137a3f" stroke-width="2.5" marker-end="url(#a2)"/>
  <path d="M220,303 L90,303" fill="none" stroke="#137a3f" stroke-width="2.5"/>
  <path d="M200,426 L90,426" fill="none" stroke="#137a3f" stroke-width="2.5"/>
  <text x="150" y="178" font-size="11" font-weight="bold" fill="#137a3f">ÁNO</text>
  <text x="150" y="296" font-size="11" font-weight="bold" fill="#137a3f">ÁNO</text>
  <text x="120" y="419" font-size="11" font-weight="bold" fill="#137a3f">ÁNO</text>

  <!-- Over time result -->
  <rect x="40" y="514" width="320" height="62" rx="8" fill="#e6f5ec" stroke="#137a3f" stroke-width="2"/>
  <text x="200" y="538" text-anchor="middle" font-size="14" font-weight="bold" fill="#137a3f">VÝNOS POSTUPOM ČASU</text>
  <text x="200" y="558" text-anchor="middle" font-size="11.5" fill="#333">over time – podľa pokroku (% rozostavanosti)</text>

  <!-- NIE final to point in time -->
  <line x1="410" y1="476" x2="410" y2="514" stroke="#b5651d" stroke-width="2.5" marker-end="url(#a2)"/>
  <text x="425" y="500" font-size="11" font-weight="bold" fill="#b5651d">NIE (ani jedno)</text>
  <rect x="460" y="514" width="320" height="62" rx="8" fill="#faf0e6" stroke="#b5651d" stroke-width="2"/>
  <text x="620" y="538" text-anchor="middle" font-size="14" font-weight="bold" fill="#b5651d">VÝNOS V URČITOM OKAMIHU</text>
  <text x="620" y="558" text-anchor="middle" font-size="11.5" fill="#333">point in time – naraz pri prevode kontroly</text>

  <!-- connector NIE final crossing -->
  <path d="M410,495 L620,495 L620,514" fill="none" stroke="#b5651d" stroke-width="2.5" marker-end="url(#a2)"/>
</svg>
