<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" font-family="Segoe UI, Arial, sans-serif">
  <rect width="920" height="420" fill="#ffffff"/>
  <text x="460" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Pásmový test lehôt: záväzky po splatnosti a daňové opravné položky</text>
  <text x="460" y="58" text-anchor="middle" font-size="13" fill="#64748b">Záväzky § 17 ods. 27 (zvýšenie ZD) · Opravné položky § 20 ods. 14 (daňový výdavok)</text>

  <!-- timeline -->
  <line x1="80" y1="150" x2="840" y2="150" stroke="#cbd5e1" stroke-width="4"/>
  <!-- markers -->
  <g text-anchor="middle">
    <circle cx="120" cy="150" r="7" fill="#94a3b8"/>
    <text x="120" y="185" font-size="12" fill="#475569">splatnosť</text>

    <circle cx="320" cy="150" r="9" fill="#f59e0b"/>
    <text x="320" y="128" font-size="14" font-weight="700" fill="#0f172a">&gt; 360 dní</text>
    <text x="320" y="185" font-size="13" font-weight="700" fill="#b45309">20 %</text>

    <circle cx="540" cy="150" r="9" fill="#ea580c"/>
    <text x="540" y="128" font-size="14" font-weight="700" fill="#0f172a">&gt; 720 dní</text>
    <text x="540" y="185" font-size="13" font-weight="700" fill="#c2410c">50 %</text>

    <circle cx="760" cy="150" r="9" fill="#b91c1c"/>
    <text x="760" y="128" font-size="14" font-weight="700" fill="#0f172a">&gt; 1 080 dní</text>
    <text x="760" y="185" font-size="13" font-weight="700" fill="#991b1b">100 %</text>
  </g>

  <!-- bars -->
  <rect x="300" y="210" width="40" height="40" fill="#f59e0b"/>
  <rect x="520" y="210" width="40" height="70" fill="#ea580c"/>
  <rect x="740" y="210" width="40" height="100" fill="#b91c1c"/>
  <text x="320" y="270" text-anchor="middle" font-size="11" fill="#475569">20 %</text>
  <text x="540" y="300" text-anchor="middle" font-size="11" fill="#475569">50 %</text>
  <text x="760" y="330" text-anchor="middle" font-size="11" fill="#475569">100 %</text>

  <!-- notes -->
  <rect x="80" y="340" width="760" height="62" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="96" y="363" font-size="12.5" fill="#0f172a"><tspan font-weight="700">Záväzky (§ 17/27):</tspan> kumulatívne sa PRIPOČÍTA k ZD (dopĺňa sa do vyššej úrovne). Z pôvodnej splatnosti; po úhrade § 17/32 → odpočet.</text>
  <text x="96" y="386" font-size="12.5" fill="#0f172a"><tspan font-weight="700">Opravné položky (§ 20/14):</tspan> percento je MAXIMUM daňovo uznanej OP (547/391) – pohľadávka musí byť v zdaniteľných príjmoch a nepremlčaná.</text>
</svg>
