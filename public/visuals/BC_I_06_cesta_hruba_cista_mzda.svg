<svg viewBox="0 0 860 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="860" height="560" fill="#ffffff"/>
  <text x="430" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a2e44">Cesta od hrubej mzdy k čistej mzde a cene práce (rok 2026)</text>
  <text x="430" y="56" text-anchor="middle" font-size="13" fill="#5a6b7b">Príklad: hrubá mzda 1 200 € · sadzby platné od 1. 1. 2026</text>

  <!-- Cena prace box -->
  <rect x="40" y="80" width="300" height="120" rx="8" fill="#fdf3e3" stroke="#d99a36" stroke-width="2"/>
  <text x="190" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#9a6212">CENA PRÁCE ≈ 1 634 €</text>
  <text x="190" y="130" text-anchor="middle" font-size="12" fill="#6b4a18">Hrubá mzda 1 200 €</text>
  <text x="190" y="150" text-anchor="middle" font-size="12" fill="#6b4a18">+ odvody zamestnávateľa ~36,2 %</text>
  <text x="190" y="170" text-anchor="middle" font-size="12" fill="#6b4a18">= + 434 € (524 / 336)</text>
  <text x="190" y="190" text-anchor="middle" font-size="11" fill="#9a6212" font-style="italic">celkový náklad firmy na zamestnanca</text>

  <!-- Hruba mzda box -->
  <rect x="40" y="230" width="300" height="80" rx="8" fill="#e7f0fb" stroke="#3a6ea5" stroke-width="2"/>
  <text x="190" y="258" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f4e79">HRUBÁ MZDA 1 200 €</text>
  <text x="190" y="280" text-anchor="middle" font-size="12" fill="#274d6e">mzdový náklad firmy</text>
  <text x="190" y="299" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f4e79">521 / 331</text>

  <!-- arrow down from cena prace to hruba -->
  <line x1="190" y1="200" x2="190" y2="228" stroke="#b0b0b0" stroke-width="2"/>

  <!-- Split arrows -->
  <text x="430" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">rozpad hrubej mzdy →</text>

  <!-- Odvody zamestnanca -->
  <line x1="340" y1="270" x2="540" y2="130" stroke="#c0392b" stroke-width="2"/>
  <rect x="540" y="100" width="280" height="66" rx="8" fill="#fbeae8" stroke="#c0392b" stroke-width="2"/>
  <text x="680" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#962d22">Odvody zamestnanca 14,4 %</text>
  <text x="680" y="143" text-anchor="middle" font-size="12" fill="#962d22">soc. 9,4 % + zdrav. 5 % = 172,80 €</text>
  <text x="680" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#962d22">331 / 336</text>

  <!-- Preddavok dane -->
  <line x1="340" y1="270" x2="540" y2="240" stroke="#8e44ad" stroke-width="2"/>
  <rect x="540" y="206" width="280" height="66" rx="8" fill="#f3eafa" stroke="#8e44ad" stroke-width="2"/>
  <text x="680" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#6c3483">Preddavok dane 19 %</text>
  <text x="680" y="249" text-anchor="middle" font-size="12" fill="#6c3483">zo ZD po NČZD ≈ 100,69 €</text>
  <text x="680" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#6c3483">331 / 342</text>

  <!-- Cista mzda -->
  <line x1="340" y1="270" x2="540" y2="345" stroke="#27865a" stroke-width="2"/>
  <rect x="540" y="312" width="280" height="78" rx="8" fill="#e6f4ec" stroke="#27865a" stroke-width="2"/>
  <text x="680" y="338" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d6644">ČISTÁ MZDA ≈ 926,51 €</text>
  <text x="680" y="358" text-anchor="middle" font-size="12" fill="#1d6644">to, čo zamestnanec dostane</text>
  <text x="680" y="376" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d6644">331 / 221 (výplata)</text>

  <!-- Legend / equation -->
  <rect x="40" y="420" width="780" height="110" rx="8" fill="#f5f7f9" stroke="#c2ccd6" stroke-width="1.5"/>
  <text x="60" y="448" font-size="14" font-weight="bold" fill="#1a2e44">Kľúčové rovnice</text>
  <text x="60" y="472" font-size="13" fill="#33414f">HRUBÁ MZDA = ČISTÁ MZDA + odvody zamestnanca (331/336) + preddavok dane (331/342)</text>
  <text x="60" y="494" font-size="13" fill="#33414f">CENA PRÁCE = HRUBÁ MZDA + odvody zamestnávateľa (524/336)</text>
  <text x="60" y="518" font-size="12" fill="#7a4a18" font-style="italic">Pozor: odvody a daň zamestnanca NIE sú náklad firmy – firma ich len preposiela. 2025: zdrav. zamestnanca 4 % (odvody 13,4 %).</text>
</svg>
