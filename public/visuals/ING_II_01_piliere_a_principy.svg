<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 660" font-family="Segoe UI, Arial, sans-serif">
  <rect width="920" height="660" fill="#ffffff"/>
  <text x="460" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Dôveryhodný názor audítora: piliere a princípy</text>
  <text x="460" y="56" text-anchor="middle" font-size="13" fill="#64748b">cieľ = primeraná istota o vernom zobrazení účtovnej závierky</text>

  <!-- Goal box -->
  <rect x="260" y="74" width="400" height="58" rx="10" fill="#0e7490"/>
  <text x="460" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">NÁZOR: závierka podáva pravdivý a verný obraz</text>
  <text x="460" y="118" text-anchor="middle" font-size="12" fill="#cffafe">primeraná (vysoká, nie absolútna) istota · ISA 200</text>

  <!-- three pillars -->
  <line x1="460" y1="132" x2="160" y2="160" stroke="#94a3b8" stroke-width="2"/>
  <line x1="460" y1="132" x2="460" y2="160" stroke="#94a3b8" stroke-width="2"/>
  <line x1="460" y1="132" x2="760" y2="160" stroke="#94a3b8" stroke-width="2"/>

  <!-- pillar 1 -->
  <rect x="40" y="160" width="250" height="150" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="165" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">1 · Nezávislosť</text>
  <text x="165" y="204" text-anchor="middle" font-size="11" fill="#1e3a8a">§ 21 zák. 423/2015</text>
  <g font-size="11.5" fill="#0f172a">
    <text x="56" y="228">• v myslení aj na pohľad</text>
    <text x="56" y="248">• žiadny majetkový/pracovný</text>
    <text x="68" y="263">vzťah k subjektu</text>
    <text x="56" y="283">• SVZ: rotácia max. 10 r.,</text>
    <text x="68" y="298">zákaz neaudít. služieb</text>
  </g>

  <!-- pillar 2 -->
  <rect x="335" y="160" width="250" height="150" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="460" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#15803d">2 · Profesionálny skepticizmus</text>
  <text x="460" y="204" text-anchor="middle" font-size="11" fill="#166534">§ 20 zák. · ISA 200</text>
  <g font-size="11.5" fill="#0f172a">
    <text x="351" y="228">• kritický, ostražitý postoj</text>
    <text x="351" y="248">• pripustiť možnú nesprávnosť</text>
    <text x="363" y="263">(chyba aj podvod)</text>
    <text x="351" y="283">• neveriť automaticky</text>
    <text x="363" y="298">bez ohľadu na minulosť</text>
  </g>

  <!-- pillar 3 -->
  <rect x="630" y="160" width="250" height="150" rx="12" fill="#fefce8" stroke="#fde68a"/>
  <text x="755" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#a16207">3 · Kontrola kvality</text>
  <text x="755" y="204" text-anchor="middle" font-size="11" fill="#854d0e">ISQM 1/2 · ISA 220</text>
  <g font-size="11.5" fill="#0f172a">
    <text x="646" y="228">• ISQM 1 – firma (rizikovo)</text>
    <text x="646" y="248">• ISQM 2 – preskúmanie</text>
    <text x="658" y="263">kvality zákazky (EQR)</text>
    <text x="646" y="283">• ISA 220 – úroveň zákazky</text>
    <text x="658" y="298">(zodp. štatut. audítor)</text>
  </g>

  <!-- Ethics base -->
  <rect x="40" y="334" width="840" height="44" rx="10" fill="#1f2937"/>
  <text x="460" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">ZÁKLAD: Etický kódex audítora (SKAU v súlade s kódexom IFAC / IESBA)</text>

  <!-- five principles -->
  <text x="460" y="404" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Päť základných etických princípov</text>
  <g font-size="12">
    <rect x="40" y="416" width="160" height="56" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="120" y="440" text-anchor="middle" font-weight="700" fill="#0f172a">Integrita</text>
    <text x="120" y="459" text-anchor="middle" fill="#64748b" font-size="10.5">čestnosť, priamosť</text>

    <rect x="210" y="416" width="160" height="56" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="290" y="440" text-anchor="middle" font-weight="700" fill="#0f172a">Objektívnosť</text>
    <text x="290" y="459" text-anchor="middle" fill="#64748b" font-size="10.5">bez zaujatosti</text>

    <rect x="380" y="416" width="160" height="56" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="460" y="436" text-anchor="middle" font-weight="700" fill="#0f172a">Odbornosť a</text>
    <text x="460" y="452" text-anchor="middle" font-weight="700" fill="#0f172a">starostlivosť</text>

    <rect x="550" y="416" width="160" height="56" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="630" y="440" text-anchor="middle" font-weight="700" fill="#0f172a">Dôvernosť</text>
    <text x="630" y="459" text-anchor="middle" fill="#64748b" font-size="10.5">mlčanlivosť</text>

    <rect x="720" y="416" width="160" height="56" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="800" y="436" text-anchor="middle" font-weight="700" fill="#0f172a">Profesionálne</text>
    <text x="800" y="452" text-anchor="middle" font-weight="700" fill="#0f172a">správanie</text>
  </g>

  <!-- conceptual framework: threats -->
  <rect x="40" y="494" width="840" height="138" rx="12" fill="#fef2f2" stroke="#fecaca"/>
  <text x="460" y="518" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">Koncepčný rámec: identifikuj hrozby → vyhodnoť → ochranné opatrenia (inak odmietni)</text>
  <g font-size="11.5" fill="#0f172a">
    <text x="60" y="546">• Vlastný záujem (finančný podiel, závislosť od honorára)</text>
    <text x="60" y="568">• Kontrola vlastnej práce (audit toho, čo audítor sám pripravil)</text>
    <text x="60" y="590">• Presadzovanie záujmov klienta (advocacy)</text>
    <text x="470" y="546">• Familiárnosť / dôvernosť (dlhý vzťah, blízka osoba)</text>
    <text x="470" y="568">• Zastrašovanie</text>
    <text x="470" y="596" font-style="italic" fill="#7f1d1d">Opatrenia: rotácia, EQR, oddelenie tímov, dohľad…</text>
  </g>
  <text x="460" y="624" text-anchor="middle" font-size="10.5" fill="#64748b">Zodpovednosť: závierku zostaví manažment · audítor ju nezávisle overí a vyjadrí názor</text>
</svg>
