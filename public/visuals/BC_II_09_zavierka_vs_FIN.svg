<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" font-family="Segoe UI, Arial, sans-serif">
  <rect width="940" height="620" fill="#ffffff"/>
  <text x="470" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Dva výstupy verejného subjektu (RO, PO, obec, VÚC)</text>
  <text x="470" y="58" text-anchor="middle" font-size="13" fill="#64748b">to isté hospodárenie, dva odlišné systémy merania</text>

  <!-- source box -->
  <rect x="320" y="76" width="300" height="50" rx="10" fill="#1f2937"/>
  <text x="470" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Hospodárenie subjektu za rok</text>
  <text x="470" y="118" text-anchor="middle" font-size="11.5" fill="#cbd5e1">majetok · záväzky · príjmy · výdavky</text>

  <line x1="470" y1="126" x2="470" y2="148" stroke="#94a3b8" stroke-width="2"/>
  <line x1="230" y1="148" x2="710" y2="148" stroke="#94a3b8" stroke-width="2"/>
  <line x1="230" y1="148" x2="230" y2="172" stroke="#94a3b8" stroke-width="2"/>
  <line x1="710" y1="148" x2="710" y2="172" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="230,178 224,166 236,166" fill="#94a3b8"/>
  <polygon points="710,178 704,166 716,166" fill="#94a3b8"/>

  <!-- LEFT: ucalovna zavierka -->
  <rect x="40" y="182" width="380" height="300" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="230" y="210" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4ed8">ÚČTOVNÁ ZÁVIERKA</text>
  <text x="230" y="230" text-anchor="middle" font-size="12.5" fill="#1e40af">AKRUÁL – verný obraz majetku a výsledku</text>
  <text x="230" y="248" text-anchor="middle" font-size="11" fill="#3b82f6">opatrenie MF/25755/2007-31</text>
  <g font-size="12.5" fill="#0f172a">
    <text x="62" y="278">1) Súvaha (Úč ROPO SFOV 1-01)</text>
    <text x="76" y="296" font-size="11" fill="#475569">aktíva = pasíva k súvahovému dňu</text>
    <text x="62" y="320">2) Výkaz ziskov a strát (Úč ROPO SFOV 2-01)</text>
    <text x="76" y="338" font-size="11" fill="#475569">náklady (5) − výnosy (6) = účtovný VH</text>
    <text x="62" y="362">3) Poznámky (text + tabuľky)</text>
    <text x="76" y="380" font-size="11" fill="#475569">zásady, metódy, rozpisy</text>
  </g>
  <text x="62" y="408" font-size="11.5" fill="#475569">+ obce/VÚC: konsolidovaná ÚZ</text>
  <text x="62" y="426" font-size="11.5" fill="#475569">zachytáva aj nepeňažné javy (odpisy, OP, rezervy, 384)</text>
  <rect x="62" y="442" width="296" height="28" rx="6" fill="#dbeafe"/>
  <text x="210" y="461" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4ed8">→ ÚČTOVNÝ VÝSLEDOK HOSPODÁRENIA</text>

  <!-- RIGHT: financne vykazy FIN -->
  <rect x="520" y="182" width="380" height="300" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="710" y="210" text-anchor="middle" font-size="17" font-weight="700" fill="#c2410c">FINANČNÉ VÝKAZY FIN</text>
  <text x="710" y="230" text-anchor="middle" font-size="12.5" fill="#9a3412">ROZPOČET A HOTOVOSŤ – plnenie rozpočtu</text>
  <text x="710" y="248" text-anchor="middle" font-size="11" fill="#ea580c">opatrenie MF o fin. výkazníctve · do CKS · kumulatívne</text>
  <g font-size="12.5" fill="#0f172a">
    <text x="542" y="278" font-weight="700">FIN 1-12 – rozpočtový výkaz</text>
    <text x="556" y="296" font-size="11" fill="#475569">príjmy/výdavky/fin. operácie podľa rozp. klasifikácie</text>
    <text x="542" y="320">FIN 2-04 – aktíva a pasíva</text>
    <text x="542" y="340">FIN 3-04 – fin. aktíva/pasíva podľa sektorov</text>
    <text x="542" y="360">FIN 4-04 – vybrané účty (overiť)</text>
    <text x="542" y="380">FIN 5-04 – maastrichtský dlh</text>
    <text x="542" y="400">FIN 6-04 – len obce, VÚC a RO ÚS</text>
  </g>
  <rect x="542" y="416" width="316" height="28" rx="6" fill="#ffedd5"/>
  <text x="700" y="435" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c2410c">FIN 1-12 → záverečný účet obce</text>
  <rect x="542" y="448" width="316" height="22" rx="6" fill="#fdba74"/>
  <text x="700" y="463" text-anchor="middle" font-size="12" font-weight="700" fill="#7c2d12">→ ROZPOČTOVÝ PREBYTOK / SCHODOK</text>

  <!-- bottom: nerovnaju sa -->
  <line x1="210" y1="470" x2="380" y2="516" stroke="#94a3b8" stroke-width="2"/>
  <line x1="700" y1="470" x2="560" y2="516" stroke="#94a3b8" stroke-width="2"/>
  <rect x="300" y="516" width="340" height="78" rx="12" fill="#fef2f2" stroke="#fecaca"/>
  <text x="470" y="542" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">Účtovný VH  ≠  rozpočtový prebytok/schodok</text>
  <text x="470" y="563" text-anchor="middle" font-size="11.5" fill="#7f1d1d">akruál (nepeňažné javy) vs. hotovosť proti rozpočtu</text>
  <text x="470" y="581" text-anchor="middle" font-size="11.5" fill="#7f1d1d">dva rôzne pohľady na to isté hospodárenie</text>
</svg>
