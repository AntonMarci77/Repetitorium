<svg viewBox="0 0 880 470" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <text x="440" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2d3d">Proces zostavenia konsolidovanej účtovnej závierky</text>

  <!-- Phase 1 -->
  <rect x="30" y="70" width="260" height="300" rx="10" fill="#eef4fb" stroke="#1d6fb8" stroke-width="2"/>
  <rect x="30" y="70" width="260" height="40" rx="10" fill="#1d6fb8"/>
  <text x="160" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">1. Predkonsolidačné úpravy</text>
  <text x="48" y="138" font-size="12" fill="#22364a">• deň závierky = deň ÚZ matky</text>
  <text x="48" y="162" font-size="12" fill="#22364a">• pravidlo 3 mesiacov (IFRS 10)</text>
  <text x="48" y="186" font-size="12" fill="#22364a">• jednotná forma a obsah ÚZ</text>
  <text x="48" y="210" font-size="12" fill="#22364a">• jednotná účtovná politika</text>
  <text x="48" y="234" font-size="12" fill="#22364a">• jednotná mena (IAS 21)</text>
  <text x="48" y="258" font-size="12" fill="#22364a">• akvizičná metóda IFRS 3:</text>
  <text x="62" y="280" font-size="11" fill="#3a4d60">– aktíva/záväzky v reálnej hodnote</text>
  <text x="62" y="300" font-size="11" fill="#3a4d60">– goodwill / zisk z výhodnej kúpy</text>
  <text x="62" y="320" font-size="11" fill="#3a4d60">– vykázanie NP</text>
  <text x="48" y="350" font-size="11" fill="#3a4d60" font-style="italic">→ konsolidačný balík</text>

  <!-- arrow -->
  <polygon points="295,210 325,210 325,200 345,217 325,234 325,224 295,224" fill="#7a8b9b"/>

  <!-- Phase 2 -->
  <rect x="350" y="70" width="260" height="300" rx="10" fill="#fdecec" stroke="#d9534f" stroke-width="2"/>
  <rect x="350" y="70" width="260" height="40" rx="10" fill="#d9534f"/>
  <text x="480" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">2. Konsolidačné úpravy (IFRS 10)</text>
  <text x="368" y="138" font-size="12" fill="#3a1f1f">• zostavenie súčtových výkazov</text>
  <text x="368" y="162" font-size="12" fill="#3a1f1f" font-weight="bold">konsolidácia kapitálu:</text>
  <text x="382" y="184" font-size="11" fill="#5a2c2a">eliminácia investície MÚJ ×</text>
  <text x="382" y="202" font-size="11" fill="#5a2c2a">podiel na VI dcéry → goodwill</text>
  <text x="368" y="228" font-size="12" fill="#3a1f1f" font-weight="bold">eliminácia v plnej výške:</text>
  <text x="382" y="250" font-size="11" fill="#5a2c2a">• vzájomné pohľadávky/záväzky</text>
  <text x="382" y="270" font-size="11" fill="#5a2c2a">• medzizisk v aktívach (zásoby)</text>
  <text x="382" y="290" font-size="11" fill="#5a2c2a">• vzájomné náklady a výnosy</text>
  <text x="382" y="310" font-size="11" fill="#5a2c2a">• vzájomné peňažné toky</text>
  <text x="368" y="338" font-size="12" fill="#3a1f1f">• vykázanie NP</text>
  <text x="368" y="358" font-size="11" fill="#5a2c2a" font-style="italic">pridružené/spoločné: metóda VI</text>

  <!-- arrow -->
  <polygon points="615,210 645,210 645,200 665,217 645,234 645,224 615,224" fill="#7a8b9b"/>

  <!-- Phase 3 -->
  <rect x="670" y="70" width="180" height="300" rx="10" fill="#eaf5ee" stroke="#2e9e6b" stroke-width="2"/>
  <rect x="670" y="70" width="180" height="40" rx="10" fill="#2e9e6b"/>
  <text x="760" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">3. Výkazy + poznámky</text>
  <text x="686" y="138" font-size="12" fill="#1f4533">• konsolidovaná súvaha</text>
  <text x="686" y="162" font-size="12" fill="#1f4533">• výkaz Z/S a KV</text>
  <text x="686" y="186" font-size="12" fill="#1f4533">• zmeny VI</text>
  <text x="686" y="210" font-size="12" fill="#1f4533">• cash flow (IAS 7)</text>
  <text x="686" y="234" font-size="12" fill="#1f4533">• poznámky</text>
  <text x="686" y="262" font-size="11" fill="#2f6048">(IAS 1)</text>
  <text x="686" y="292" font-size="12" fill="#1f4533" font-weight="bold">zverejnenia:</text>
  <text x="686" y="312" font-size="11" fill="#2f6048">IFRS 12 (podiely v ÚJ)</text>
  <text x="686" y="330" font-size="11" fill="#2f6048">IFRS 3, IAS 36</text>

  <text x="440" y="402" text-anchor="middle" font-size="13" fill="#5b6b7b" font-weight="bold">SR: KÚZ podnikateľov podľa IFRS prevzatých EÚ • KÚZ verejnej správy podľa opatrení MF SR</text>
  <text x="440" y="426" text-anchor="middle" font-size="12" fill="#5b6b7b">Povinnosť a oslobodenia: § 22 zákona 431/2002 (medzistupeň • veľkostné kritériá • nevýznamnosť • nezahrnuteľné dcéry)</text>
  <text x="440" y="448" text-anchor="middle" font-size="12" fill="#5b6b7b">Ďalšie povinnosti MÚJ: konsolidovaná výročná správa • výkaz vybraných údajov • správa o dani z príjmov (CbCR, § 21a)</text>
</svg>
