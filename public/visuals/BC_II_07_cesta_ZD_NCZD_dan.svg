<svg viewBox="0 0 860 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="860" height="560" fill="#ffffff"/>
  <text x="430" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1a2c50">Cesta od príjmov FO k dani: úloha NČZD (§ 11) a daňových výdavkov</text>

  <!-- Aktivne prijmy -->
  <rect x="40" y="70" width="360" height="100" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="220" y="96" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">AKTÍVNE príjmy (NČZD áno)</text>
  <text x="220" y="120" text-anchor="middle" font-size="13" fill="#1e3a8a">§ 5 závislá činnosť</text>
  <text x="220" y="140" text-anchor="middle" font-size="13" fill="#1e3a8a">§ 6 ods. 1 a 2 podnikanie a SZČ</text>
  <text x="220" y="160" text-anchor="middle" font-size="12" fill="#1e3a8a" font-style="italic">− daňové výdavky (§ 19) / paušál 80 % (§ 19/2/t)</text>

  <!-- Pasivne prijmy -->
  <rect x="460" y="70" width="360" height="100" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="640" y="96" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">PASÍVNE príjmy (NČZD NIE)</text>
  <text x="640" y="120" text-anchor="middle" font-size="13" fill="#991b1b">§ 6 ods. 3 prenájom · § 7 kapitál</text>
  <text x="640" y="140" text-anchor="middle" font-size="13" fill="#991b1b">§ 8 ostatné príjmy</text>
  <text x="640" y="160" text-anchor="middle" font-size="12" fill="#991b1b" font-style="italic">NČZD sa NEodpočítavajú</text>

  <!-- arrow down from aktivne -->
  <line x1="220" y1="170" x2="220" y2="205" stroke="#2563eb" stroke-width="3"/>
  <polygon points="220,212 214,200 226,200" fill="#2563eb"/>

  <!-- ZD pred NCZD -->
  <rect x="60" y="212" width="320" height="56" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
  <text x="220" y="236" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">Čiastkový ZÁKLAD DANE</text>
  <text x="220" y="256" text-anchor="middle" font-size="12" fill="#312e81">(príjmy − daňové výdavky)</text>

  <line x1="220" y1="268" x2="220" y2="300" stroke="#4338ca" stroke-width="3"/>
  <polygon points="220,307 214,295 226,295" fill="#4338ca"/>

  <!-- NCZD box -->
  <rect x="40" y="307" width="360" height="150" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="220" y="330" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">− NEZDANITEĽNÉ ČASTI ZD (§ 11)</text>
  <text x="55" y="356" font-size="13" fill="#14532d">1. na daňovníka — 21× ŽM (2026: 5 966,73 €)</text>
  <text x="55" y="380" font-size="13" fill="#14532d">2. na manželku/manžela — 19,2× ŽM (5 455,30 €)</text>
  <text x="55" y="404" font-size="13" fill="#14532d">3. príspevky na DDS / PEPP — max 180 €</text>
  <text x="55" y="432" font-size="11.5" fill="#166534" font-style="italic">kráti sa pri vyššom ZD (91,8× / 154,8× ŽM),</text>
  <text x="55" y="448" font-size="11.5" fill="#166534" font-style="italic">manželka aj vlastným príjmom + podmienky</text>

  <line x1="220" y1="457" x2="220" y2="488" stroke="#16a34a" stroke-width="3"/>
  <polygon points="220,495 214,483 226,483" fill="#16a34a"/>

  <!-- ZD po znizeni -->
  <rect x="60" y="495" width="320" height="46" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="220" y="523" text-anchor="middle" font-size="14" font-weight="700" fill="#713f12">ZD PO ZNÍŽENÍ × sadzba dane = DAŇ</text>

  <!-- right side note: sadzby -->
  <rect x="460" y="212" width="360" height="245" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="640" y="236" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Sadzby dane FO 2026 (§ 15)</text>
  <text x="478" y="262" font-size="12.5" fill="#334155">Podnikanie (§6/1,2), obrat ≤ 100 000 €: 15 %</text>
  <text x="478" y="286" font-size="12.5" fill="#334155">Závislá / pasívna (4 pásma od 2026):</text>
  <text x="494" y="308" font-size="12" fill="#334155">do 43 983,32 € .......... 19 %</text>
  <text x="494" y="328" font-size="12" fill="#334155">do 60 349,21 € .......... 25 %</text>
  <text x="494" y="348" font-size="12" fill="#334155">do 75 010,32 € .......... 30 %</text>
  <text x="494" y="368" font-size="12" fill="#334155">nad 75 010,32 € ........ 35 %</text>
  <line x1="478" y1="384" x2="802" y2="384" stroke="#cbd5e1" stroke-width="1"/>
  <text x="478" y="406" font-size="11.5" fill="#475569" font-style="italic">Daňový bonus na dieťa (§ 33) = zľava</text>
  <text x="478" y="424" font-size="11.5" fill="#475569" font-style="italic">priamo na DANI, nie NČZD.</text>
  <text x="478" y="446" font-size="11.5" fill="#475569" font-style="italic">ŽM k 1.1.: 273,99 € (2025) / 284,13 € (2026)</text>

  <text x="640" y="520" text-anchor="middle" font-size="11" fill="#94a3b8">Zdroj: ZDP č. 595/2003 Z. z. § 11, § 15, § 19; ŽM a sumy overené 2026</text>
</svg>
