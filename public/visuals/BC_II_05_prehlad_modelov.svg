<svg viewBox="0 0 780 470" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="470" fill="#ffffff"/>
  <text x="390" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a2b4a">Prehľad predikčných a bankrotových modelov</text>
  <text x="390" y="57" text-anchor="middle" font-size="14" fill="#5a6b82">Spôsob rozhodnutia: pásma (Altman, IN05) · znamienko (Taffler) · trend (Beaver)</text>

  <!-- table header -->
  <rect x="30" y="78" width="720" height="34" fill="#1a2b4a"/>
  <text x="120" y="100" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">Model</text>
  <text x="330" y="100" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">Pre koho / vstup</text>
  <text x="560" y="100" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">Prahy / rozhodnutie</text>

  <!-- rows -->
  <rect x="30" y="112" width="720" height="58" fill="#eef2f8"/>
  <text x="40" y="135" font-size="13.5" font-weight="bold" fill="#1a2b4a">Altman Z</text>
  <text x="40" y="155" font-size="12" fill="#5a6b82">kótované a. s.</text>
  <text x="220" y="135" font-size="12.5" fill="#33455e">5 premenných, x4 = trhová</text>
  <text x="220" y="155" font-size="12.5" fill="#33455e">hodnota imania / cudzie zdroje</text>
  <text x="450" y="135" font-size="12.5" fill="#33455e">&lt;1,81 bankrot · 1,81–2,99 sivá</text>
  <text x="450" y="155" font-size="12.5" fill="#33455e">&gt;2,99 bezpečná</text>

  <rect x="30" y="170" width="720" height="58" fill="#ffffff"/>
  <text x="40" y="193" font-size="13.5" font-weight="bold" fill="#1a2b4a">Altman Z'</text>
  <text x="40" y="213" font-size="12" fill="#5a6b82">nekótované</text>
  <text x="220" y="193" font-size="12.5" fill="#33455e">x4 = účtovná hodnota imania,</text>
  <text x="220" y="213" font-size="12.5" fill="#33455e">iné váhy</text>
  <text x="450" y="193" font-size="12.5" fill="#33455e">&lt;1,23 problémy · 1,23–2,9 sivá</text>
  <text x="450" y="213" font-size="12.5" fill="#33455e">&gt;2,9 uspokojivá</text>

  <rect x="30" y="228" width="720" height="58" fill="#eef2f8"/>
  <text x="40" y="251" font-size="13.5" font-weight="bold" fill="#1a2b4a">IN05</text>
  <text x="40" y="271" font-size="12" fill="#5a6b82">SR/ČR, str. Európa</text>
  <text x="220" y="251" font-size="12.5" fill="#33455e">A–E, bez trhovej hodnoty,</text>
  <text x="220" y="271" font-size="12.5" fill="#33455e">úrok. krytie B (max 9)</text>
  <text x="450" y="251" font-size="12.5" fill="#33455e">&lt;0,9 ničí · 0,9–1,6 sivá</text>
  <text x="450" y="271" font-size="12.5" fill="#33455e">&gt;1,6 tvorí hodnotu</text>

  <rect x="30" y="286" width="720" height="58" fill="#ffffff"/>
  <text x="40" y="309" font-size="13.5" font-weight="bold" fill="#1a2b4a">Taffler</text>
  <text x="40" y="329" font-size="12" fill="#5a6b82">univerzálny</text>
  <text x="220" y="309" font-size="12.5" fill="#33455e">4 premenné (rentabilita,</text>
  <text x="220" y="329" font-size="12.5" fill="#33455e">prac. kapitál, riziko)</text>
  <text x="450" y="309" font-size="12.5" fill="#33455e">rozhoduje ZNAMIENKO:</text>
  <text x="450" y="329" font-size="12.5" fill="#33455e">TZ &gt; 0 zdravie · TZ &lt; 0 riziko</text>

  <rect x="30" y="344" width="720" height="58" fill="#eef2f8"/>
  <text x="40" y="367" font-size="13.5" font-weight="bold" fill="#1a2b4a">Beaver</text>
  <text x="40" y="387" font-size="12" fill="#5a6b82">jednorozmerný</text>
  <text x="220" y="367" font-size="12.5" fill="#33455e">trend ukazovateľov, kľúč:</text>
  <text x="220" y="387" font-size="12.5" fill="#33455e">cash flow / cudzie zdroje</text>
  <text x="450" y="367" font-size="12.5" fill="#33455e">nedáva skóre – sleduje TREND</text>
  <text x="450" y="387" font-size="12.5" fill="#33455e">(klesá VI a CF, rastie dlh)</text>

  <rect x="30" y="112" width="720" height="290" fill="none" stroke="#c3cedd" stroke-width="1"/>
  <line x1="200" y1="112" x2="200" y2="402" stroke="#c3cedd" stroke-width="1"/>
  <line x1="440" y1="112" x2="440" y2="402" stroke="#c3cedd" stroke-width="1"/>

  <text x="30" y="430" font-size="12.5" fill="#5a6b82">Premenné modelov sú pomerové ukazovatele (rentabilita, likvidita, zadlženosť, aktivita) stiahnuté do jedného skóre.</text>
  <text x="30" y="450" font-size="12.5" fill="#5a6b82">Modely sú včasné varovanie – kombinovať viacero a doplniť informáciami o udržateľnosti (ESG) z výročnej správy.</text>
</svg>
