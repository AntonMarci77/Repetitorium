<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a2b4a">Výpočet goodwillu – mostík (IFRS 3)</text>
  <text x="450" y="58" text-anchor="middle" font-size="14" fill="#55607a">Protihodnota + NCI (nekontrolný podiel) + RH predtým drž. podielu − RH čistých identifik. aktív = goodwill</text>

  <!-- bridge bars (illustrative numbers: protihodnota 800, NCI, čisté aktíva 900) -->
  <!-- consideration bar -->
  <rect x="60" y="180" width="150" height="200" rx="8" fill="#e8f1fb" stroke="#2f6db5" stroke-width="2"/>
  <text x="135" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a4d8f">Protihodnota</text>
  <text x="135" y="226" text-anchor="middle" font-size="12" fill="#1a4d8f">v reálnej hodnote</text>
  <text x="135" y="300" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a4d8f">800</text>

  <text x="245" y="290" text-anchor="middle" font-size="26" font-weight="bold" fill="#55607a">+</text>

  <!-- NCI bar -->
  <rect x="280" y="240" width="150" height="140" rx="8" fill="#f0ecf8" stroke="#6a4ca0" stroke-width="2"/>
  <text x="355" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a2f80">NCI</text>
  <text x="355" y="316" text-anchor="middle" font-size="18" font-weight="bold" fill="#4a2f80">180 / 190</text>
  <text x="355" y="350" text-anchor="middle" font-size="11" fill="#4a2f80">pomer. / v RH</text>

  <text x="465" y="290" text-anchor="middle" font-size="26" font-weight="bold" fill="#55607a">−</text>

  <!-- net assets bar -->
  <rect x="500" y="160" width="150" height="220" rx="8" fill="#eef6ee" stroke="#3f8f3f" stroke-width="2"/>
  <text x="575" y="186" text-anchor="middle" font-size="13" font-weight="bold" fill="#23631f">RH čistých</text>
  <text x="575" y="204" text-anchor="middle" font-size="13" font-weight="bold" fill="#23631f">identif. aktív</text>
  <text x="575" y="290" text-anchor="middle" font-size="20" font-weight="bold" fill="#23631f">900</text>

  <text x="685" y="290" text-anchor="middle" font-size="26" font-weight="bold" fill="#55607a">=</text>

  <!-- goodwill result -->
  <rect x="720" y="220" width="150" height="160" rx="8" fill="#fff4d6" stroke="#c79a17" stroke-width="2.5"/>
  <text x="795" y="248" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5b00">GOODWILL</text>
  <text x="795" y="300" text-anchor="middle" font-size="22" font-weight="bold" fill="#7a5b00">80 / 90</text>
  <text x="795" y="332" text-anchor="middle" font-size="11" fill="#7a5b00">čiastoč. / plný</text>

  <!-- variant note -->
  <rect x="60" y="408" width="380" height="120" rx="10" fill="#f0ecf8" stroke="#6a4ca0" stroke-width="1.8"/>
  <text x="250" y="432" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a2f80">Voľba ocenenia NCI</text>
  <text x="75" y="456" font-size="12.5" fill="#3a2a55">• pomerný podiel (20 % × 900 = 180) →</text>
  <text x="75" y="474" font-size="12.5" fill="#3a2a55">  goodwill 80 (len na materskú = čiastočný)</text>
  <text x="75" y="498" font-size="12.5" fill="#3a2a55">• reálna hodnota NCI (190) →</text>
  <text x="75" y="516" font-size="12.5" fill="#3a2a55">  goodwill 90 (plný; +10 pripadá na NCI)</text>

  <!-- bargain purchase note -->
  <rect x="470" y="408" width="400" height="120" rx="10" fill="#fdeaea" stroke="#b03030" stroke-width="1.8"/>
  <text x="670" y="432" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a1f1f">Ak vyjde záporne → výhodná kúpa</text>
  <text x="485" y="456" font-size="12.5" fill="#5a1414">napr. protihodnota 700 + NCI 180 − 900 = −20</text>
  <text x="485" y="476" font-size="12.5" fill="#5a1414">→ po POVINNOM prehodnotení ocenenia</text>
  <text x="485" y="496" font-size="12.5" fill="#5a1414">→ zisk z výhodnej kúpy 20 vo VzaS</text>
  <text x="485" y="516" font-size="12" font-style="italic" fill="#5a1414">zisk sa priradí nadobúdateľovi (materskej)</text>
</svg>
