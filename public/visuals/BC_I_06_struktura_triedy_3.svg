  <text x="489" y="370" font-size="12" fill="#33414f">364 Podiel na zisku · 365 Ostatné · 366 Mzda spoločníka</text>

  <rect x="475" y="396" width="355" height="62" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.3"/>
  <text x="489" y="418" font-size="13" font-weight="bold" fill="#962d22">37 – iné záväzky</text>
  <text x="489" y="438" font-size="12" fill="#33414f">372 Kúpa podniku · 379 Iné záväzky</text>

  <rect x="475" y="468" width="355" height="68" rx="6" fill="#f0f6fb" stroke="#3a6ea5" stroke-width="1.3"/>
  <text x="489" y="490" font-size="13" font-weight="bold" fill="#1f4e79">38 – časové rozlíšenie</text>
  <text x="489" y="510" font-size="12" fill="#33414f">383 Výdavky BÚO · 384 Výnosy BÚO</text>
  <text x="489" y="528" font-size="11" fill="#5a6b7b" font-style="italic">tá istá faktúra: u dodávateľa 311, u odberateľa 321</text>

  <text x="440" y="575" text-anchor="middle" font-size="12" fill="#7a4a18" font-style="italic">Mzda: 521/331 (hrubá) → 331/336 (odvody zam.) + 331/342 (daň) + 524/336 (odvody zamestnávateľa) → 331/221 (čistá)</text>
