<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="540" fill="#ffffff"/>
  <text x="380" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a2b4a">Tri poňatia (koncepcie) nákladov</text>
  <text x="380" y="62" text-anchor="middle" font-size="14" fill="#5a6b85">finančné &#8834; hodnotové &#8834; manažérske (ekonomické)</text>

  <!-- Manažérske (najširšie) -->
  <ellipse cx="380" cy="300" rx="330" ry="195" fill="#e8f0fb" stroke="#3a6fb0" stroke-width="2.5"/>
  <!-- Hodnotové -->
  <ellipse cx="350" cy="300" rx="235" ry="150" fill="#cfe3f7" stroke="#2f5e9e" stroke-width="2.5"/>
  <!-- Finančné (najužšie) -->
  <ellipse cx="320" cy="300" rx="135" ry="100" fill="#a9cdef" stroke="#1f4e85" stroke-width="2.5"/>

  <!-- Finančné label -->
  <text x="320" y="288" text-anchor="middle" font-size="17" font-weight="bold" fill="#143a66">FINANČNÉ poňatie</text>
  <text x="320" y="310" text-anchor="middle" font-size="12.5" fill="#143a66">účtovné náklady</text>
  <text x="320" y="328" text-anchor="middle" font-size="12.5" fill="#143a66">(doložené dokladom)</text>

  <!-- Hodnotové label -->
  <text x="350" y="200" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e85">HODNOTOVÉ poňatie</text>
  <text x="350" y="220" text-anchor="middle" font-size="12" fill="#1f4e85">+ kalkulačné náklady</text>
  <text x="350" y="237" text-anchor="middle" font-size="11.5" fill="#1f4e85">odpisy &#183; úroky &#183; riziko &#183; mzda</text>

  <!-- Manažérske label -->
  <text x="380" y="455" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c4f7c">MANAŽÉRSKE (ekonomické) poňatie</text>
  <text x="380" y="475" text-anchor="middle" font-size="12" fill="#2c4f7c">+ oportunitné (alternatívne) náklady = ušlý prospech</text>

  <!-- side note -->
  <text x="380" y="525" text-anchor="middle" font-size="11.5" fill="#7a8aa3" font-style="italic">Čím širšie poňatie, tým bližšie k ekonomickej realite (ďalej od účtovného dokladu).</text>
</svg>
