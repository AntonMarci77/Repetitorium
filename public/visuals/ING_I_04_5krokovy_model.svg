<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a3c6e">5-krokový model IFRS 15 – Výnosy zo zmlúv so zákazníkmi</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#555">Hlavná zásada: výnos sa vykazuje pri prevode KONTROLY nad tovarom/službou na zákazníka</text>

  <!-- Step boxes -->
  <g>
    <rect x="40" y="80" width="200" height="78" rx="8" fill="#e8f0fb" stroke="#1a3c6e" stroke-width="2"/>
    <text x="140" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a3c6e">KROK 1</text>
    <text x="140" y="124" text-anchor="middle" font-size="12" fill="#222">Identifikácia zmluvy</text>
    <text x="140" y="142" text-anchor="middle" font-size="11" fill="#555">(5 kritérií – súhlas,</text>
    <text x="140" y="155" text-anchor="middle" font-size="11" fill="#555">komerčná podstata, inkaso)</text>
  </g>
  <g>
    <rect x="270" y="80" width="200" height="78" rx="8" fill="#e8f0fb" stroke="#1a3c6e" stroke-width="2"/>
    <text x="370" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a3c6e">KROK 2</text>
    <text x="370" y="124" text-anchor="middle" font-size="12" fill="#222">Povinnosti plnenia</text>
    <text x="370" y="142" text-anchor="middle" font-size="11" fill="#555">odlišné (distinct)</text>
    <text x="370" y="155" text-anchor="middle" font-size="11" fill="#555">tovary a služby</text>
  </g>
  <g>
    <rect x="500" y="80" width="200" height="78" rx="8" fill="#e8f0fb" stroke="#1a3c6e" stroke-width="2"/>
    <text x="600" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a3c6e">KROK 3</text>
    <text x="600" y="124" text-anchor="middle" font-size="12" fill="#222">Transakčná cena</text>
    <text x="600" y="142" text-anchor="middle" font-size="11" fill="#555">pevná + premenlivá,</text>
    <text x="600" y="155" text-anchor="middle" font-size="11" fill="#555">financovanie (bez DPH)</text>
  </g>
  <g>
    <rect x="660" y="200" width="200" height="78" rx="8" fill="#e8f0fb" stroke="#1a3c6e" stroke-width="2"/>
    <text x="760" y="224" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a3c6e">KROK 4</text>
    <text x="760" y="244" text-anchor="middle" font-size="12" fill="#222">Alokácia ceny</text>
    <text x="760" y="262" text-anchor="middle" font-size="11" fill="#555">podľa samostatných</text>
    <text x="760" y="275" text-anchor="middle" font-size="11" fill="#555">predajných cien</text>
  </g>
  <g>
    <rect x="350" y="200" width="220" height="78" rx="8" fill="#1a3c6e" stroke="#0d2549" stroke-width="2"/>
    <text x="460" y="224" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">KROK 5</text>
    <text x="460" y="244" text-anchor="middle" font-size="12" fill="#ffffff">Vykázanie výnosu</text>
    <text x="460" y="262" text-anchor="middle" font-size="11" fill="#cfe0f5">pri PREVODE KONTROLY</text>
    <text x="460" y="275" text-anchor="middle" font-size="11" fill="#cfe0f5">(rozhodujúci krok)</text>
  </g>

  <!-- Arrows between steps 1-2-3 -->
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1a3c6e"/>
    </marker>
  </defs>
  <line x1="240" y1="119" x2="270" y2="119" stroke="#1a3c6e" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="470" y1="119" x2="500" y2="119" stroke="#1a3c6e" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M600,158 L600,180 L760,180 L760,200" fill="none" stroke="#1a3c6e" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="660" y1="239" x2="570" y2="239" stroke="#1a3c6e" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Step 5 split -->
  <line x1="460" y1="278" x2="460" y2="310" stroke="#1a3c6e" stroke-width="2.5"/>
  <path d="M460,310 L230,310 L230,340" fill="none" stroke="#137a3f" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M460,310 L690,310 L690,340" fill="none" stroke="#b5651d" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Over time box -->
  <g>
    <rect x="40" y="340" width="380" height="190" rx="8" fill="#e6f5ec" stroke="#137a3f" stroke-width="2"/>
    <text x="230" y="364" text-anchor="middle" font-size="15" font-weight="bold" fill="#137a3f">POSTUPOM ČASU (over time)</text>
    <text x="230" y="384" text-anchor="middle" font-size="11" fill="#333">splnené ASPOŇ JEDNO z 3 kritérií:</text>
    <text x="58" y="408" font-size="11.5" fill="#222">a) zákazník súbežne prijíma a spotrebúva úžitky</text>
    <text x="58" y="430" font-size="11.5" fill="#222">b) plnenie vytvára/vylepšuje aktívum, ktoré</text>
    <text x="72" y="445" font-size="11.5" fill="#222">zákazník kontroluje počas tvorby</text>
    <text x="58" y="467" font-size="11.5" fill="#222">c) aktívum bez alternatívneho použitia +</text>
    <text x="72" y="482" font-size="11.5" fill="#222">vymožiteľné právo na platbu za doteraz</text>
    <text x="72" y="497" font-size="11.5" fill="#222">dokončené plnenie</text>
    <text x="230" y="520" text-anchor="middle" font-size="11" font-style="italic" fill="#137a3f">výnos podľa pokroku (% × cena)</text>
  </g>

  <!-- Point in time box -->
  <g>
    <rect x="500" y="340" width="360" height="190" rx="8" fill="#faf0e6" stroke="#b5651d" stroke-width="2"/>
    <text x="680" y="364" text-anchor="middle" font-size="15" font-weight="bold" fill="#b5651d">V URČITOM OKAMIHU (point in time)</text>
    <text x="680" y="384" text-anchor="middle" font-size="11" fill="#333">žiadne z 3 kritérií → indikátory kontroly:</text>
    <text x="518" y="408" font-size="11.5" fill="#222">• platné právo ÚJ na platbu</text>
    <text x="518" y="430" font-size="11.5" fill="#222">• zákazník má vlastnícke právo</text>
    <text x="518" y="452" font-size="11.5" fill="#222">• prevod fyzickej držby</text>
    <text x="518" y="474" font-size="11.5" fill="#222">• prevzatie rizík a odmien zákazníkom</text>
    <text x="518" y="496" font-size="11.5" fill="#222">• zákazník aktívum prevzal</text>
    <text x="680" y="520" text-anchor="middle" font-size="11" font-style="italic" fill="#b5651d">výnos celý naraz pri prevode kontroly</text>
  </g>
</svg>
