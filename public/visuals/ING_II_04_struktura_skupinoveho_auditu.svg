<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="520" fill="#ffffff"/>
  <text x="390" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a2b4a">Štruktúra auditu skupiny (ISA 600 revidovaný, od 15. 12. 2023)</text>
  <text x="390" y="60" text-anchor="middle" font-size="13.5" fill="#5a6b8a">Jeden audit jednej konsolidovanej závierky – plná zodpovednosť skupinového audítora</text>

  <!-- Group auditor box -->
  <rect x="240" y="84" width="300" height="74" rx="12" fill="#1a2b4a"/>
  <text x="390" y="112" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#ffffff">SKUPINOVÝ (poverený) AUDÍTOR</text>
  <text x="390" y="133" text-anchor="middle" font-size="12.5" fill="#c5d2ea">tím skupinovej zákazky – riadenie, dohľad,</text>
  <text x="390" y="149" text-anchor="middle" font-size="12.5" fill="#c5d2ea">scoping zhora nadol, VÝROK na KÚZ</text>

  <!-- arrows down to components -->
  <line x1="390" y1="158" x2="390" y2="185" stroke="#2f5fa8" stroke-width="2"/>
  <line x1="130" y1="185" x2="650" y2="185" stroke="#2f5fa8" stroke-width="2"/>
  <line x1="130" y1="185" x2="130" y2="210" stroke="#2f5fa8" stroke-width="2"/>
  <line x1="320" y1="185" x2="320" y2="210" stroke="#2f5fa8" stroke-width="2"/>
  <line x1="510" y1="185" x2="510" y2="210" stroke="#2f5fa8" stroke-width="2"/>
  <line x1="650" y1="185" x2="650" y2="210" stroke="#2f5fa8" stroke-width="2"/>
  <text x="400" y="178" font-size="11" fill="#5a6b8a">dvojsmerná, priebežná komunikácia · prístup k dokumentácii</text>

  <!-- Component auditor 1 -->
  <rect x="40" y="212" width="180" height="92" rx="10" fill="#e8f0fb" stroke="#2f5fa8" stroke-width="2"/>
  <text x="130" y="236" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a2b4a">Audítor komponentu</text>
  <text x="130" y="255" text-anchor="middle" font-size="12" fill="#1a2b4a">Komponent A (dcéra)</text>
  <text x="130" y="276" text-anchor="middle" font-size="11" fill="#42526e">člen tímu zákazky</text>
  <text x="130" y="292" text-anchor="middle" font-size="11" fill="#42526e">významnosť komponentu</text>

  <!-- Component auditor 2 -->
  <rect x="230" y="212" width="180" height="92" rx="10" fill="#e8f0fb" stroke="#2f5fa8" stroke-width="2"/>
  <text x="320" y="236" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a2b4a">Audítor komponentu</text>
  <text x="320" y="255" text-anchor="middle" font-size="12" fill="#1a2b4a">Komponent B (divízia)</text>
  <text x="320" y="276" text-anchor="middle" font-size="11" fill="#42526e">rozsah podľa RIZIKA,</text>
  <text x="320" y="292" text-anchor="middle" font-size="11" fill="#42526e">nie podľa veľkosti</text>

  <!-- Component handled by group team -->
  <rect x="420" y="212" width="180" height="92" rx="10" fill="#e9f6ee" stroke="#2e8b57" stroke-width="2"/>
  <text x="510" y="236" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a4a2b">Skupinový tím sám</text>
  <text x="510" y="255" text-anchor="middle" font-size="12" fill="#1a4a2b">Komponent C</text>
  <text x="510" y="276" text-anchor="middle" font-size="11" fill="#3a5a44">vysoké riziko / odhady</text>
  <text x="510" y="292" text-anchor="middle" font-size="11" fill="#3a5a44">(540, 620)</text>

  <!-- Consolidation process -->
  <rect x="610" y="212" width="130" height="92" rx="10" fill="#fbf0e6" stroke="#c8741a" stroke-width="2"/>
  <text x="675" y="234" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#5a3410">Konsolidačný</text>
  <text x="675" y="250" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#5a3410">proces</text>
  <text x="675" y="270" text-anchor="middle" font-size="10.5" fill="#6a4a28">eliminácie, goodwill,</text>
  <text x="675" y="285" text-anchor="middle" font-size="10.5" fill="#6a4a28">NCI (nekontrolný podiel) – audituje</text>
  <text x="675" y="300" text-anchor="middle" font-size="10.5" fill="#6a4a28">skupinový tím</text>

  <!-- key change banner -->
  <rect x="60" y="330" width="660" height="48" rx="8" fill="#eef3fb" stroke="#2f5fa8" stroke-width="1.5"/>
  <text x="390" y="350" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a2b4a">Zmena revízie: zrušená kategória „významný komponent" podľa veľkosti → rizikový scoping ZHORA NADOL</text>
  <text x="390" y="369" text-anchor="middle" font-size="11.5" fill="#42526e">Audítor komponentu už NIE je externý subjekt, na ktorého sa „spoliehame" – je súčasťou tímu skupinovej zákazky</text>

  <!-- responsibility banner -->
  <rect x="160" y="392" width="460" height="44" rx="8" fill="#fdeaea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="390" y="412" text-anchor="middle" font-size="13" font-weight="bold" fill="#922">Zodpovednosť za výrok je PLNÁ a NEDELITEĽNÁ u skupinového audítora</text>
  <text x="390" y="429" text-anchor="middle" font-size="11" fill="#a44">využitie audítorov komponentov / interného auditu / experta ju neznižuje</text>

  <text x="390" y="468" text-anchor="middle" font-size="11" fill="#8a98b0">Zdroj: ISA 600 (Revised) – Audits of Group Financial Statements, IAASB; účinný pre obdobia začínajúce 15. 12. 2023</text>
  <text x="390" y="486" text-anchor="middle" font-size="10" fill="#aab4c8">NCI = nekontrolujúce podiely · KÚZ = konsolidovaná účtovná závierka</text>
</svg>
