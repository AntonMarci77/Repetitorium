<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="Segoe UI, Arial, sans-serif">
  <rect width="920" height="560" fill="#ffffff"/>
  <text x="460" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Model rizika auditu: AR = IR × CR × DR</text>
  <text x="460" y="58" text-anchor="middle" font-size="13" fill="#64748b">Audítor posudzuje IR a CR (existujú u klienta), riadi výhradne DR (rozsah testovania)</text>

  <!-- formula bar -->
  <rect x="160" y="80" width="600" height="56" rx="10" fill="#0f172a"/>
  <text x="460" y="116" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">AR  =  IR  ×  CR  ×  DR</text>

  <!-- RMM bracket -->
  <rect x="200" y="160" width="330" height="200" rx="12" fill="#fef2f2" stroke="#fecaca"/>
  <text x="365" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c">Riziko významnej nesprávnosti</text>
  <text x="365" y="206" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">RMM = IR × CR  (ISA 315)</text>

  <rect x="220" y="224" width="130" height="116" rx="8" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="285" y="250" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">IR</text>
  <text x="285" y="270" text-anchor="middle" font-size="11" fill="#7f1d1d">inherentné</text>
  <text x="285" y="286" text-anchor="middle" font-size="11" fill="#7f1d1d">(prirodzené)</text>
  <text x="285" y="308" text-anchor="middle" font-size="10" fill="#7f1d1d">náchylnosť tvrdenia</text>
  <text x="285" y="322" text-anchor="middle" font-size="10" fill="#7f1d1d">na chybu</text>

  <rect x="380" y="224" width="130" height="116" rx="8" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="445" y="250" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">CR</text>
  <text x="445" y="270" text-anchor="middle" font-size="11" fill="#7f1d1d">kontrolné</text>
  <text x="445" y="292" text-anchor="middle" font-size="10" fill="#7f1d1d">VKS chybu</text>
  <text x="445" y="306" text-anchor="middle" font-size="10" fill="#7f1d1d">nezachytí</text>
  <text x="445" y="322" text-anchor="middle" font-size="10" fill="#7f1d1d">ani neopraví</text>

  <text x="365" y="380" text-anchor="middle" font-size="11" fill="#475569">audítor ich POSUDZUJE, nemení</text>

  <!-- DR box -->
  <rect x="580" y="160" width="200" height="200" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="680" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">Detekčné riziko</text>
  <text x="680" y="206" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">DR  (ISA 330)</text>
  <rect x="600" y="224" width="160" height="78" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="680" y="250" text-anchor="middle" font-size="11" fill="#1e3a8a">postupy audítora</text>
  <text x="680" y="268" text-anchor="middle" font-size="11" fill="#1e3a8a">chybu neodhalia</text>
  <text x="680" y="290" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">audítor RIADI</text>
  <text x="680" y="332" text-anchor="middle" font-size="11" fill="#475569">nepriamo úmerné</text>
  <text x="680" y="348" text-anchor="middle" font-size="11" fill="#475569">k RMM</text>

  <!-- inverse relation -->
  <line x1="530" y1="260" x2="595" y2="260" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="600,260 590,254 590,266" fill="#94a3b8"/>
  <text x="563" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">↔</text>

  <!-- bottom logic -->
  <rect x="60" y="400" width="800" height="130" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="460" y="426" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Väzba na rozsah testovania (cieľ: AR nízke a stabilné)</text>

  <rect x="90" y="442" width="360" height="72" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="270" y="466" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">Vysoké RMM (IR × CR)</text>
  <text x="270" y="486" text-anchor="middle" font-size="12" fill="#7f1d1d">→ nízke prípustné DR</text>
  <text x="270" y="504" text-anchor="middle" font-size="12" fill="#7f1d1d">→ VIAC dôkazov, väčšia vzorka, koniec roka</text>

  <rect x="470" y="442" width="360" height="72" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="650" y="466" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">Nízke RMM (IR × CR)</text>
  <text x="650" y="486" text-anchor="middle" font-size="12" fill="#065f46">→ vyššie prípustné DR</text>
  <text x="650" y="504" text-anchor="middle" font-size="12" fill="#065f46">→ MENEJ testov, viac analytických postupov</text>
</svg>
