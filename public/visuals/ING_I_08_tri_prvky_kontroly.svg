<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="480" fill="#ffffff"/>
  <text x="380" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a2b4a">Model kontroly podľa IFRS 10 (10.7)</text>
  <text x="380" y="62" text-anchor="middle" font-size="14" fill="#5a6b8a">Ovládanie = tri prvky, ktoré musia platiť SÚČASNE</text>

  <!-- Element 1 -->
  <rect x="40" y="95" width="220" height="130" rx="12" fill="#e8f0fb" stroke="#2f5fa8" stroke-width="2"/>
  <circle cx="70" cy="125" r="16" fill="#2f5fa8"/>
  <text x="70" y="131" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">1</text>
  <text x="150" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a2b4a">MOC</text>
  <text x="150" y="152" text-anchor="middle" font-size="13" fill="#1a2b4a">nad subjektom</text>
  <text x="150" y="176" text-anchor="middle" font-size="11.5" fill="#42526e">existujúce práva riadiť</text>
  <text x="150" y="192" text-anchor="middle" font-size="11.5" fill="#42526e">relevantné činnosti</text>
  <text x="150" y="208" text-anchor="middle" font-size="11.5" fill="#42526e">(ovplyvňujúce výnosy)</text>

  <!-- Element 2 -->
  <rect x="270" y="95" width="220" height="130" rx="12" fill="#e9f6ee" stroke="#2e8b57" stroke-width="2"/>
  <circle cx="300" cy="125" r="16" fill="#2e8b57"/>
  <text x="300" y="131" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">2</text>
  <text x="380" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a4a2b">EXPOZÍCIA</text>
  <text x="380" y="152" text-anchor="middle" font-size="13" fill="#1a4a2b">voči var. výnosom</text>
  <text x="380" y="176" text-anchor="middle" font-size="11.5" fill="#3a5a44">výnosy z podielu sa</text>
  <text x="380" y="192" text-anchor="middle" font-size="11.5" fill="#3a5a44">menia podľa výkonnosti</text>
  <text x="380" y="208" text-anchor="middle" font-size="11.5" fill="#3a5a44">(alebo právo na ne)</text>

  <!-- Element 3 -->
  <rect x="500" y="95" width="220" height="130" rx="12" fill="#fbf0e6" stroke="#c8741a" stroke-width="2"/>
  <circle cx="530" cy="125" r="16" fill="#c8741a"/>
  <text x="530" y="131" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">3</text>
  <text x="610" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#5a3410">VÄZBA</text>
  <text x="610" y="152" text-anchor="middle" font-size="13" fill="#5a3410">moc → výnosy</text>
  <text x="610" y="176" text-anchor="middle" font-size="11.5" fill="#6a4a28">schopnosť využiť moc</text>
  <text x="610" y="192" text-anchor="middle" font-size="11.5" fill="#6a4a28">na ovplyvnenie výšky</text>
  <text x="610" y="208" text-anchor="middle" font-size="11.5" fill="#6a4a28">vlastných výnosov</text>

  <!-- Plus signs -->
  <text x="265" y="170" text-anchor="middle" font-size="28" font-weight="bold" fill="#8a98b0">+</text>
  <text x="495" y="170" text-anchor="middle" font-size="28" font-weight="bold" fill="#8a98b0">+</text>

  <!-- arrow down -->
  <line x1="380" y1="232" x2="380" y2="270" stroke="#1a2b4a" stroke-width="2.5"/>
  <polygon points="380,282 372,266 388,266" fill="#1a2b4a"/>

  <!-- result -->
  <rect x="200" y="288" width="360" height="56" rx="10" fill="#1a2b4a"/>
  <text x="380" y="313" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">OVLÁDANIE → povinná konsolidácia</text>
  <text x="380" y="333" text-anchor="middle" font-size="12.5" fill="#c5d2ea">metóda úplnej konsolidácie (100 %)</text>

  <!-- warning -->
  <rect x="120" y="370" width="520" height="46" rx="8" fill="#fdeaea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="380" y="390" text-anchor="middle" font-size="13" font-weight="bold" fill="#922">Chýba čo i len JEDEN prvok = niet kontroly = NEkonsoliduje sa</text>
  <text x="380" y="408" text-anchor="middle" font-size="11.5" fill="#a44">Kontrola nezávisí od % podielu (možná aj de facto / zmluvne); nepretržité posudzovanie (10.8)</text>

  <text x="380" y="450" text-anchor="middle" font-size="11" fill="#8a98b0">Zdroj: IFRS 10 Konsolidovaná účtovná závierka, ods. 6–8 (nariadenie EÚ 2023/1803)</text>
</svg>
