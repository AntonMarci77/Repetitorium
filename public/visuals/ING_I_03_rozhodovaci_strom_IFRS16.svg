<svg viewBox="0 0 760 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="620" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a2b4a">IFRS 16 u nájomcu – rozhodovací strom</text>

  <!-- Q1 -->
  <rect x="180" y="58" width="400" height="64" rx="10" fill="#eef4fb" stroke="#3a78c2" stroke-width="2"/>
  <text x="380" y="84" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#27557f">Obsahuje zmluva LÍZING?</text>
  <text x="380" y="104" text-anchor="middle" font-size="11.5" fill="#5a6a85">právo ovládať používanie identifikovateľného aktíva za protihodnotu</text>

  <!-- arrow down to Q2 -->
  <line x1="380" y1="122" x2="380" y2="150" stroke="#3a78c2" stroke-width="2"/>
  <polygon points="380,150 374,140 386,140" fill="#3a78c2"/>
  <text x="398" y="142" font-size="11" fill="#3a8a4a" font-weight="bold">ÁNO</text>

  <!-- NO branch from Q1 -->
  <line x1="580" y1="90" x2="690" y2="90" stroke="#8a8f99" stroke-width="2"/>
  <polygon points="690,90 680,84 680,96" fill="#8a8f99"/>
  <rect x="610" y="118" width="140" height="56" rx="9" fill="#f0f1f3" stroke="#8a8f99" stroke-width="1.5"/>
  <text x="680" y="142" text-anchor="middle" font-size="11.5" fill="#555c66">NIE → mimo IFRS 16</text>
  <text x="680" y="160" text-anchor="middle" font-size="10.5" fill="#7a8090">(napr. zmluva o službe)</text>

  <!-- Q2 -->
  <rect x="160" y="150" width="440" height="78" rx="10" fill="#fff6e8" stroke="#d8a23a" stroke-width="2"/>
  <text x="380" y="176" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a5a1a">Uplatní nájomca VÝNIMKU?</text>
  <text x="380" y="196" text-anchor="middle" font-size="11.5" fill="#5a6a85">krátkodobý lízing ≤ 12 mes. (bez kúpnej opcie)</text>
  <text x="380" y="214" text-anchor="middle" font-size="11.5" fill="#5a6a85">alebo lízing s nízkou hodnotou podkladového aktíva</text>

  <!-- YES (vynimka) -->
  <line x1="160" y1="189" x2="90" y2="189" stroke="#d8a23a" stroke-width="2"/>
  <line x1="90" y1="189" x2="90" y2="270" stroke="#d8a23a" stroke-width="2"/>
  <polygon points="90,270 84,260 96,260" fill="#d8a23a"/>
  <text x="118" y="182" font-size="11" fill="#3a8a4a" font-weight="bold">ÁNO</text>
  <rect x="20" y="272" width="280" height="92" rx="10" fill="#fff" stroke="#d8a23a" stroke-width="2"/>
  <text x="160" y="296" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a5a1a">Zjednodušené účtovanie</text>
  <text x="160" y="318" text-anchor="middle" font-size="11.5" fill="#27343f">Splátky rovno do NÁKLADOV</text>
  <text x="160" y="338" text-anchor="middle" font-size="11.5" fill="#27343f">(rovnomerne / systematicky)</text>
  <text x="160" y="356" text-anchor="middle" font-size="10.5" fill="#7a8090">správa sa ako operatívny nájom</text>

  <!-- NO (zakladny model) -->
  <line x1="600" y1="189" x2="670" y2="189" stroke="#7a3ac2" stroke-width="2"/>
  <line x1="670" y1="189" x2="670" y2="270" stroke="#7a3ac2" stroke-width="2"/>
  <polygon points="670,270 664,260 676,260" fill="#7a3ac2"/>
  <text x="612" y="182" font-size="11" fill="#7a3a3a" font-weight="bold">NIE</text>
  <rect x="460" y="272" width="280" height="120" rx="10" fill="#f3eefb" stroke="#7a3ac2" stroke-width="2"/>
  <text x="600" y="296" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a2f8a">Základný model</text>
  <text x="600" y="320" text-anchor="middle" font-size="11.5" fill="#27343f">Vykáž PRÁVO UŽÍVAŤ aktívum (RoU)</text>
  <text x="600" y="340" text-anchor="middle" font-size="11.5" fill="#27343f">+ ZÁVÄZOK z lízingu (SH splátok)</text>
  <text x="600" y="362" text-anchor="middle" font-size="11" fill="#5a6a85">RoU sa odpisuje, záväzok sa úročí</text>
  <text x="600" y="380" text-anchor="middle" font-size="10.5" fill="#7a8090">RoU / Záväzok z lízingu</text>

  <!-- bottom note: lessor -->
  <rect x="60" y="430" width="640" height="150" rx="12" fill="#eef4fb" stroke="#9bb8da" stroke-width="2"/>
  <text x="380" y="456" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a4a7a">U PRENAJÍMATEĽA: klasifikácia ZOSTÁVA (asymetria)</text>
  <text x="380" y="484" text-anchor="middle" font-size="12.5" fill="#27343f">FINANČNÝ lízing → pohľadávka = čistá investícia do lízingu; finančný výnos sa rozpúšťa</text>
  <text x="380" y="508" text-anchor="middle" font-size="12.5" fill="#27343f">OPERATÍVNY lízing → aktívum zostáva v súvahe, odpisuje sa, splátky = výnos rovnomerne</text>
  <text x="380" y="540" text-anchor="middle" font-size="12" fill="#7a3a3a" font-weight="bold">Test: prevádza lízing v podstate VŠETKY riziká a odmeny z vlastníctva?</text>
  <text x="380" y="562" text-anchor="middle" font-size="11.5" fill="#5a6a85">áno → finančný · nie → operatívny</text>
</svg>
