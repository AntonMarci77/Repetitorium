<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="640" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Oceňovanie majetku a záväzkov – veličiny podľa momentu a objektu</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#64748b">Zákon č. 431/2002 Z. z. o účtovníctve · § 24 (deň ocenenia) · § 25 a § 27 (veličiny)</text>

  <!-- TWO MOMENTS header -->
  <rect x="30" y="76" width="445" height="40" rx="8" fill="#1e3a8a"/>
  <text x="252" y="101" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">A) Deň uskutočnenia účtovného prípadu (§ 25)</text>
  <rect x="485" y="76" width="445" height="40" rx="8" fill="#7c2d12"/>
  <text x="707" y="101" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">B) Deň zostavenia účtovnej závierky (§ 27)</text>

  <!-- LEFT column: pri prirastku -->
  <!-- OC -->
  <rect x="30" y="126" width="445" height="58" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="44" y="148" font-size="14" font-weight="700" fill="#1d4ed8">Obstarávacia cena (OC)</text>
  <text x="44" y="168" font-size="11.5" fill="#334155">kúpený DHM/DNM, zásoby, CP, kúpené pohľadávky,</text>
  <text x="44" y="181" font-size="11.5" fill="#334155">prevzaté záväzky · cena + súvisiace náklady − zľavy</text>

  <!-- VN -->
  <rect x="30" y="190" width="445" height="58" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="44" y="212" font-size="14" font-weight="700" fill="#1d4ed8">Vlastné náklady (VN)</text>
  <text x="44" y="232" font-size="11.5" fill="#334155">majetok a zásoby vlastnej výroby, príchovky a prírastky</text>
  <text x="44" y="245" font-size="11.5" fill="#334155">zvierat · priame (+ nepriame) náklady na výrobu</text>

  <!-- menovita -->
  <rect x="30" y="254" width="445" height="58" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="44" y="276" font-size="14" font-weight="700" fill="#1d4ed8">Menovitá hodnota</text>
  <text x="44" y="296" font-size="11.5" fill="#334155">peňažné prostriedky, ceniny, pohľadávky a záväzky</text>
  <text x="44" y="309" font-size="11.5" fill="#334155">pri vzniku · suma na ktorú znejú</text>

  <!-- RH prirastok -->
  <rect x="30" y="318" width="445" height="70" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="44" y="340" font-size="14" font-weight="700" fill="#047857">Reálna hodnota (RH) – pri prírastku</text>
  <text x="44" y="360" font-size="11.5" fill="#334155">dar, preradenie z osobného vlastníctva, inventarizačný</text>
  <text x="44" y="373" font-size="11.5" fill="#334155">prebytok, kúpa/vklad podniku alebo jeho časti, zámena</text>

  <!-- ROC zrusena -->
  <rect x="30" y="394" width="445" height="56" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="5 4"/>
  <text x="44" y="416" font-size="13.5" font-weight="700" fill="#94a3b8">Reprodukčná OC – ZRUŠENÁ (do 31. 12. 2015)</text>
  <text x="44" y="436" font-size="11.5" fill="#94a3b8">dar / preradenie / prebytok → od 1. 1. 2016 nahradila</text>
  <text x="44" y="449" font-size="11.5" fill="#94a3b8">reálna hodnota; v platnom zákone už pojem nie je</text>

  <!-- RIGHT column: ku dnu zavierky -->
  <!-- RH precenenie -->
  <rect x="485" y="126" width="445" height="92" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="499" y="148" font-size="14" font-weight="700" fill="#047857">Precenenie na reálnu hodnotu (§ 27 ods. 1)</text>
  <text x="499" y="168" font-size="11.5" fill="#334155">cenné papiere a podiely (OKREM držaných do splatnosti,</text>
  <text x="499" y="181" font-size="11.5" fill="#334155">vlastných CP a podielov v dcérach/pridružených),</text>
  <text x="499" y="194" font-size="11.5" fill="#334155">deriváty, komodity na verejnom trhu, drahé kovy,</text>
  <text x="499" y="207" font-size="11.5" fill="#334155">podielové listy fondu, nehnuteľnosti fondu/poisťovní</text>

  <!-- RH hierarchia -->
  <rect x="485" y="224" width="445" height="76" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="499" y="246" font-size="13.5" font-weight="700" fill="#0f766e">Ako sa zistí RH (§ 27 ods. 2) – hierarchia</text>
  <text x="499" y="266" font-size="11.5" fill="#334155">a) trhová cena → b) model z aktívneho trhu →</text>
  <text x="499" y="279" font-size="11.5" fill="#334155">c) model z neaktívneho trhu → d) posudok znalca</text>
  <text x="499" y="294" font-size="11.5" fill="#64748b">(znalec až ako posledná možnosť)</text>

  <!-- opatrnost -->
  <rect x="485" y="306" width="445" height="82" rx="8" fill="#fffbeb" stroke="#fde68a"/>
  <text x="499" y="328" font-size="13.5" font-weight="700" fill="#b45309">Zásada opatrnosti (§ 26)</text>
  <text x="499" y="348" font-size="11.5" fill="#334155">zásoby → čistá realizačná hodnota, ak je nižšia;</text>
  <text x="499" y="361" font-size="11.5" fill="#334155">opravné položky (dočasné zníženie hodnoty),</text>
  <text x="499" y="374" font-size="11.5" fill="#334155">rezervy; záväzky vo zvýšenom ocenení</text>

  <!-- cudzia mena -->
  <rect x="485" y="394" width="445" height="56" rx="8" fill="#faf5ff" stroke="#e9d5ff"/>
  <text x="499" y="416" font-size="13.5" font-weight="700" fill="#7e22ce">Cudzia mena (§ 24 ods. 2)</text>
  <text x="499" y="436" font-size="11.5" fill="#334155">referenčný kurz ECB/NBS · prípad = kurz dňa PRED;</text>
  <text x="499" y="449" font-size="11.5" fill="#334155">závierka = kurz toho dňa → kurzové rozdiely 563/663</text>

  <!-- ZASADY band -->
  <rect x="30" y="470" width="900" height="64" rx="10" fill="#1f2937"/>
  <text x="480" y="492" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Nadradený rámec: účtovné ZÁSADY a METÓDY (§ 7)</text>
  <text x="480" y="513" text-anchor="middle" font-size="11.5" fill="#cbd5e1">verný a pravdivý obraz · going concern (min. 12 mes.) · akruál · opatrnosť · stálosť metód · zákaz vzájomného započítania · bilančná kontinuita</text>
  <text x="480" y="528" text-anchor="middle" font-size="11" fill="#94a3b8">zásady = princípy · metódy = konkrétne postupy (oceňovanie, OP, rezervy, odpisy) v postupoch účtovania</text>

  <!-- ZMENY band -->
  <rect x="30" y="544" width="445" height="78" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="252" y="565" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d4ed8">Zmena účtovného ODHADU → PROSPEKTÍVNE</text>
  <text x="252" y="585" text-anchor="middle" font-size="11.5" fill="#334155">OP, rezerva, doba a spôsob odpisovania</text>
  <text x="252" y="600" text-anchor="middle" font-size="11.5" fill="#334155">→ cez bežné a budúce náklady/výnosy</text>
  <text x="252" y="615" text-anchor="middle" font-size="11" fill="#64748b">NIE je oprava chyby (§ 59 ods. 14 postupov)</text>

  <rect x="485" y="544" width="445" height="78" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="707" y="565" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b91c1c">Oprava CHYBY minulých období</text>
  <text x="707" y="585" text-anchor="middle" font-size="11.5" fill="#334155">nevýznamná → bežný výsledok (náklady/výnosy)</text>
  <text x="707" y="600" text-anchor="middle" font-size="11.5" fill="#334155">významná → retrospektívne cez 428 / 429</text>
  <text x="707" y="615" text-anchor="middle" font-size="11" fill="#64748b">(mimo výsledku bežného obdobia)</text>
</svg>
