<svg viewBox="0 0 820 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="820" height="560" fill="#ffffff"/>
  <text x="410" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1a2b4a">Rozhodovacia matica typu názoru audítora (ISA 705)</text>
  <text x="410" y="58" text-anchor="middle" font-size="14" fill="#5a6b85">charakter problému  ×  všeobsiahlosť dopadu</text>

  <!-- Axis labels -->
  <text x="40" y="300" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2b4a" transform="rotate(-90 40 300)">CHARAKTER PROBLÉMU</text>
  <text x="500" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2b4a">VŠEOBSIAHLOSŤ DOPADU (pervasiveness)</text>

  <!-- Column headers -->
  <rect x="290" y="115" width="240" height="55" fill="#e8eef7" stroke="#9bb2d6"/>
  <text x="410" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2b4a">Materiálne, ale</text>
  <text x="410" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2b4a">NIE všeobsiahle</text>
  <rect x="530" y="115" width="250" height="55" fill="#e8eef7" stroke="#9bb2d6"/>
  <text x="655" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2b4a">Materiálne A</text>
  <text x="655" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2b4a">súčasne všeobsiahle</text>

  <!-- Row headers -->
  <rect x="70" y="180" width="220" height="160" fill="#e8eef7" stroke="#9bb2d6"/>
  <text x="180" y="245" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2b4a">Závierka je</text>
  <text x="180" y="266" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2b4a">VÝZNAMNE</text>
  <text x="180" y="287" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2b4a">NESPRÁVNA</text>
  <text x="180" y="310" text-anchor="middle" font-size="11" fill="#5a6b85">(audítor VIE o chybe)</text>

  <rect x="70" y="350" width="220" height="160" fill="#e8eef7" stroke="#9bb2d6"/>
  <text x="180" y="408" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2b4a">NEDOSTATOK</text>
  <text x="180" y="429" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2b4a">DÔKAZOV</text>
  <text x="180" y="450" text-anchor="middle" font-size="12" fill="#5a6b85">(obmedzenie rozsahu)</text>
  <text x="180" y="472" text-anchor="middle" font-size="11" fill="#5a6b85">(audítor NEVIE posúdiť)</text>

  <!-- Cells -->
  <!-- nesprávnosť × ohraničené -->
  <rect x="290" y="180" width="240" height="160" fill="#fff4d6" stroke="#d9a300" stroke-width="2"/>
  <text x="410" y="248" text-anchor="middle" font-size="18" font-weight="700" fill="#8a6b00">NÁZOR S VÝHRADOU</text>
  <text x="410" y="272" text-anchor="middle" font-size="12" fill="#6b5500">(qualified opinion)</text>
  <text x="410" y="300" text-anchor="middle" font-size="11" fill="#6b5500">„okrem vplyvu skutočnosti..."</text>

  <!-- nesprávnosť × všeobsiahle -->
  <rect x="530" y="180" width="250" height="160" fill="#f9d6d6" stroke="#c0392b" stroke-width="2"/>
  <text x="655" y="248" text-anchor="middle" font-size="18" font-weight="700" fill="#a52a1d">ZÁPORNÝ NÁZOR</text>
  <text x="655" y="272" text-anchor="middle" font-size="12" fill="#7a2018">(adverse opinion)</text>
  <text x="655" y="300" text-anchor="middle" font-size="11" fill="#7a2018">závierka NEPOSKYTUJE</text>
  <text x="655" y="316" text-anchor="middle" font-size="11" fill="#7a2018">pravdivý a verný obraz</text>

  <!-- nedostatok × ohraničené -->
  <rect x="290" y="350" width="240" height="160" fill="#fff4d6" stroke="#d9a300" stroke-width="2"/>
  <text x="410" y="418" text-anchor="middle" font-size="18" font-weight="700" fill="#8a6b00">NÁZOR S VÝHRADOU</text>
  <text x="410" y="442" text-anchor="middle" font-size="12" fill="#6b5500">(qualified opinion)</text>
  <text x="410" y="470" text-anchor="middle" font-size="11" fill="#6b5500">„okrem možného vplyvu..."</text>

  <!-- nedostatok × všeobsiahle -->
  <rect x="530" y="350" width="250" height="160" fill="#f9d6d6" stroke="#c0392b" stroke-width="2"/>
  <text x="655" y="410" text-anchor="middle" font-size="17" font-weight="700" fill="#a52a1d">ODMIETNUTIE</text>
  <text x="655" y="432" text-anchor="middle" font-size="17" font-weight="700" fill="#a52a1d">VYJADRENIA NÁZORU</text>
  <text x="655" y="456" text-anchor="middle" font-size="12" fill="#7a2018">(disclaimer of opinion)</text>
  <text x="655" y="480" text-anchor="middle" font-size="11" fill="#7a2018">audítor názor NEVYJADRÍ</text>

  <text x="410" y="540" text-anchor="middle" font-size="12" fill="#5a6b85">Nemodifikovaný (čistý) názor = bez významných nesprávností a s dostatočnými dôkazmi. Odsek Emphasis/Other Matter názor NEmodifikuje.</text>
</svg>
