<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="Segoe UI, Arial, sans-serif">
  <rect width="920" height="560" fill="#ffffff"/>
  <text x="460" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Časové rozlíšenie nákladov a výnosov (účty 381–385)</text>
  <text x="460" y="56" text-anchor="middle" font-size="13" fill="#64748b">akruálny princíp · § 5 a § 56 Postupov · podmienka: známy obsah, suma aj obdobie</text>

  <!-- pomocka -->
  <rect x="40" y="74" width="840" height="38" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="460" y="98" text-anchor="middle" font-size="13" fill="#0f172a">Otázka: prišli peniaze (výdavok/príjem) skôr alebo neskôr ako vznikol náklad/výnos? · „budúcich období" = do akého obdobia patrí</text>

  <!-- NAKLADY column -->
  <rect x="40" y="128" width="400" height="180" rx="12" fill="#fef2f2" stroke="#fecaca"/>
  <text x="240" y="154" text-anchor="middle" font-size="16" font-weight="700" fill="#b91c1c">Strana nákladov</text>

  <rect x="60" y="166" width="360" height="60" rx="8" fill="#ffffff" stroke="#fca5a5"/>
  <text x="74" y="188" font-size="13.5" font-weight="700" fill="#0f172a">381 Náklady budúcich období  (AKTÍVUM)</text>
  <text x="74" y="208" font-size="11.5" fill="#475569">výdavok teraz → náklad neskôr · napr. vopred platené nájomné, predplatné</text>

  <rect x="60" y="234" width="360" height="60" rx="8" fill="#ffffff" stroke="#fca5a5"/>
  <text x="74" y="256" font-size="13.5" font-weight="700" fill="#0f172a">383 Výdavky budúcich období  (PASÍVUM)</text>
  <text x="74" y="276" font-size="11.5" fill="#475569">náklad teraz → výdavok neskôr · napr. nájomné platené pozadu</text>

  <!-- VYNOSY column -->
  <rect x="480" y="128" width="400" height="180" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="680" y="154" text-anchor="middle" font-size="16" font-weight="700" fill="#15803d">Strana výnosov</text>

  <rect x="500" y="166" width="360" height="60" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="514" y="188" font-size="13.5" font-weight="700" fill="#0f172a">384 Výnosy budúcich období  (PASÍVUM)</text>
  <text x="514" y="208" font-size="11.5" fill="#475569">príjem teraz → výnos neskôr · napr. nájomné prijaté vopred, dotácia (§ 52a)</text>

  <rect x="500" y="234" width="360" height="60" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="514" y="256" font-size="13.5" font-weight="700" fill="#0f172a">385 Príjmy budúcich období  (AKTÍVUM)</text>
  <text x="514" y="276" font-size="11.5" fill="#475569">výnos teraz → príjem neskôr · napr. nájomné prijaté pozadu</text>

  <!-- 382 -->
  <rect x="40" y="324" width="840" height="50" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="60" y="346" font-size="13.5" font-weight="700" fill="#9a3412">382 Komplexné náklady budúcich období (AKTÍVUM)</text>
  <text x="60" y="365" font-size="11.5" fill="#475569">náklady budúcich období sledované vo vzťahu k danému účelu (napr. dlhodobá reklamná kampaň, príprava výroby)</text>

  <!-- legenda aktivum/pasivum -->
  <rect x="40" y="388" width="840" height="46" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <circle cx="62" cy="411" r="6" fill="#1d4ed8"/>
  <text x="76" y="415" font-size="12.5" fill="#0f172a"><tspan font-weight="700">Aktíva:</tspan> 381, 382, 385 (podnik niečo „má" – budúci náklad/príjem).</text>
  <circle cx="500" cy="411" r="6" fill="#b91c1c"/>
  <text x="514" y="415" font-size="12.5" fill="#0f172a"><tspan font-weight="700">Pasíva:</tspan> 383, 384 (podnik niečo „dlhuje" – budúci výdavok/výnos).</text>

  <!-- vztah k rezervam -->
  <rect x="40" y="448" width="840" height="80" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="60" y="472" font-size="13.5" font-weight="700" fill="#3730a3">Kedy NEpoužiť časové rozlíšenie?</text>
  <text x="60" y="494" font-size="12" fill="#0f172a">Ak NIE je známa presná suma alebo termín → REZERVA (§ 26/5) alebo DOHADNÁ POLOŽKA (388/389).</text>
  <text x="60" y="514" font-size="12" fill="#0f172a">Časové rozlíšenie = známy obsah, suma aj obdobie. Všetko spája akruálny princíp – nezávislosť období.</text>
</svg>
