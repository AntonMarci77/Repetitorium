<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Plánovanie auditu: od akceptácie po reakciu na riziká</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#64748b">Rizikovo orientovaný prístup – ISA 300 · ISA 315 · ISA 330</text>

  <!-- step 0 acceptance -->
  <rect x="60" y="80" width="840" height="58" rx="10" fill="#1f2937"/>
  <text x="480" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">0. Akceptácia zákazky a posúdenie rizika zákazky</text>
  <text x="480" y="126" text-anchor="middle" font-size="12" fill="#cbd5e1">integrita a kapacity · nezávislosť (etika) · komunikácia s predch. audítorom · zmluva o audite (ISA 210)</text>
  <line x1="480" y1="138" x2="480" y2="158" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="480,164 474,152 486,152" fill="#94a3b8"/>

  <!-- ISA 300 strategy/plan/program -->
  <rect x="60" y="168" width="840" height="120" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="480" y="192" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">1. Plánovanie auditu (ISA 300)</text>
  <rect x="84" y="206" width="252" height="66" rx="8" fill="#dbeafe"/>
  <text x="210" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Celková stratégia</text>
  <text x="210" y="250" text-anchor="middle" font-size="11" fill="#1e40af">rozsah · načasovanie · smerovanie</text>
  <text x="210" y="265" text-anchor="middle" font-size="11" fill="#1e40af">predbežná významnosť, zdroje</text>
  <text x="350" y="244" text-anchor="middle" font-size="18" fill="#1d4ed8">→</text>
  <rect x="366" y="206" width="228" height="66" rx="8" fill="#dbeafe"/>
  <text x="480" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Plán auditu</text>
  <text x="480" y="250" text-anchor="middle" font-size="11" fill="#1e40af">charakter, načasovanie, rozsah</text>
  <text x="480" y="265" text-anchor="middle" font-size="11" fill="#1e40af">postupov (ISA 315 + ISA 330)</text>
  <text x="608" y="244" text-anchor="middle" font-size="18" fill="#1d4ed8">→</text>
  <rect x="624" y="206" width="252" height="66" rx="8" fill="#dbeafe"/>
  <text x="750" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Program auditu</text>
  <text x="750" y="250" text-anchor="middle" font-size="11" fill="#1e40af">konkrétne kroky pre účty/oblasti</text>
  <text x="750" y="265" text-anchor="middle" font-size="11" fill="#1e40af">(zásoby, pohľadávky, ...)</text>
  <line x1="480" y1="288" x2="480" y2="308" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="480,314 474,302 486,302" fill="#94a3b8"/>

  <!-- ISA 315 risk + VKS/COSO -->
  <rect x="60" y="318" width="840" height="150" rx="12" fill="#fef2f2" stroke="#fecaca"/>
  <text x="480" y="342" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c">2. Identifikácia a vyhodnotenie rizík (ISA 315 rev. 2019)</text>
  <text x="480" y="362" text-anchor="middle" font-size="12" fill="#7f1d1d">RMM = IR × CR · úroveň ÚZ ako celku aj úroveň tvrdení · významné riziká</text>
  <text x="480" y="386" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">Vnútorný kontrolný systém – 5 komponentov COSO (2013)</text>
  <rect x="78" y="398" width="150" height="58" rx="7" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="153" y="422" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">Kontrolné</text>
  <text x="153" y="438" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">prostredie</text>
  <rect x="238" y="398" width="150" height="58" rx="7" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="313" y="422" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">Posudzovanie</text>
  <text x="313" y="438" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">rizík ÚJ</text>
  <rect x="398" y="398" width="150" height="58" rx="7" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="473" y="422" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">Kontrolné</text>
  <text x="473" y="438" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">činnosti</text>
  <rect x="558" y="398" width="150" height="58" rx="7" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="633" y="420" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">Informácie a</text>
  <text x="633" y="436" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">komunikácia</text>
  <rect x="718" y="398" width="164" height="58" rx="7" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="800" y="430" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">Monitorovanie</text>
  <line x1="480" y1="468" x2="480" y2="488" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="480,494 474,482 486,482" fill="#94a3b8"/>

  <!-- ISA 330 responses -->
  <rect x="60" y="498" width="840" height="86" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="480" y="522" text-anchor="middle" font-size="15" font-weight="700" fill="#047857">3. Reakcia audítora na riziká (ISA 330)</text>
  <rect x="84" y="534" width="390" height="40" rx="7" fill="#d1fae5"/>
  <text x="279" y="552" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">Celkové reakcie (úroveň ÚZ)</text>
  <text x="279" y="568" text-anchor="middle" font-size="10" fill="#065f46">skepticizmus · skúsenejší tím · dohľad · nepredvídateľnosť</text>
  <rect x="486" y="534" width="390" height="40" rx="7" fill="#d1fae5"/>
  <text x="681" y="552" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">Ďalšie postupy (úroveň tvrdení)</text>
  <text x="681" y="568" text-anchor="middle" font-size="10" fill="#065f46">testy kontrol + substantívne postupy (detaily, analytické)</text>
</svg>
